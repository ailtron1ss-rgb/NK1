name: NK1 Docker Compose Runtime Smoke

on:
  push:
    branches:
      - fix/restored-action-receipt-integrity-2026-10-25
    paths:
      - ".github/workflows/nk1-compose-smoke.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "tools/super-start.mjs"
      - "tools/super-dev.mjs"
      - "tools/super-ui-build.mjs"
      - "tools/super-gateway.mjs"
      - "tools/super-gateway-config.mjs"
      - "tools/super-gateway-config.test.mjs"
      - "tools/super-launch-paths.test.mjs"
      - "tools/super-ui-build.test.mjs"
      - "tools/super-install.mjs"
      - "tools/project-runtime-pin.mjs"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - "app/package.json"
      - "app/package-lock.json"
      - "app/vite.config.ts"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - "runtime/neuro-kurisu/src/server/server.mjs"
      - "research/research_bridge.py"
  pull_request:
    branches:
      - fix/restored-action-receipt-integrity-2026-10-25
    paths:
      - ".github/workflows/nk1-compose-smoke.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "tools/super-start.mjs"
      - "tools/super-dev.mjs"
      - "tools/super-ui-build.mjs"
      - "tools/super-gateway.mjs"
      - "tools/super-gateway-config.mjs"
      - "tools/super-gateway-config.test.mjs"
      - "tools/super-launch-paths.test.mjs"
      - "tools/super-ui-build.test.mjs"
      - "tools/super-install.mjs"
      - "tools/project-runtime-pin.mjs"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - "app/package.json"
      - "app/package-lock.json"
      - "app/vite.config.ts"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - "runtime/neuro-kurisu/src/server/server.mjs"
      - "research/research_bridge.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk1-compose-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source stack
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the stack
        run: docker compose up --build --detach

      - name: Wait for healthy UI gateway
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            container_id="$(docker compose ps -q neuro-kurisu)"
            if [ -z "$container_id" ]; then
              echo "Compose did not create the neuro-kurisu container"
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")"
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              echo "Container stopped before becoming healthy"
              docker compose logs --no-color
              exit 1
            fi
            if [ "$health" = "healthy" ]; then
              curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null
              echo "NK1_COMPOSE_SMOKE=PASS attempt=$attempt"
              exit 0
            fi
            sleep 5
          done
          echo "Compose healthcheck timed out"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop ephemeral stack
        if: always()
        run: docker compose down --volumes --remove-orphans
