name: NK1 NMCN runtime bridge
on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/integration/nmcn/**"
      - "runtime/neuro-kurisu/scripts/nmcn_sidecar.py"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/tests/nmcn-runtime-bridge.mjs"
      - ".github/workflows/nk1-nmcn-runtime-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nk1-nmcn-runtime-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Bounded NMCN sidecar contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - name: Validate Python sidecar syntax
        run: python -m py_compile runtime/neuro-kurisu/scripts/nmcn_sidecar.py
      - name: Validate NMCN bridge boundary
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/nmcn-runtime-bridge.mjs
