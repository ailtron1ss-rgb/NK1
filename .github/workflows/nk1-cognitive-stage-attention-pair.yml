name: NK1 Cognitive Stage Receipts and Voluntary Attention Pair

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - 'runtime/neuro-kurisu/src/organism/core/OrganismCore.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts'
      - 'runtime/neuro-kurisu/src/organism/core/types.ts'
      - 'runtime/neuro-kurisu/src/organism/system/CognitiveEventFabric.ts'
      - 'runtime/neuro-kurisu/src/organism/system/CognitiveStageReceipt.ts'
      - 'runtime/neuro-kurisu/src/organism/system/CognitiveResourceEconomy.ts'
      - 'runtime/neuro-kurisu/tests/cognitive-stage-evidence-workpass83.mjs'
      - 'runtime/neuro-kurisu/tests/cognitive-stage-attention-pair-workpass83.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/nk1-cognitive-stage-attention-pair.yml'
permissions:
  contents: read
concurrency:
  group: nk1-cognitive-stage-attention-pair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cognitive-stage-attention:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/neuro-kurisu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real owner-to-CEF attention and memory receipts
        run: npm run test:workpass83:cognitive-stage-evidence
      - name: Current voluntary attention intent adaptation
        run: npm run test:cognitive-stage-attention-pair
      - name: Runtime typecheck
        run: npm run typecheck
