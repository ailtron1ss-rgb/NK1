name: NK1 Memory Projection Retrieval Integrity

on:
  push:
    branches:
      - aspect/memory-projection-retrieval-integrity-20261113
    paths:
      - '.github/workflows/nk1-memory-projection-retrieval-integrity.yml'
      - 'runtime/neuro-kurisu/src/organism/memory/MultiTimescaleMemory.ts'
      - 'runtime/neuro-kurisu/src/organism/memory/SemanticMemoryGraph.ts'
      - 'runtime/neuro-kurisu/tests/memory-projection-retrieval-integrity-20261113.mjs'
  pull_request:
    branches:
      - workpass70-source
    paths:
      - '.github/workflows/nk1-memory-projection-retrieval-integrity.yml'
      - 'runtime/neuro-kurisu/src/organism/memory/MultiTimescaleMemory.ts'
      - 'runtime/neuro-kurisu/src/organism/memory/SemanticMemoryGraph.ts'
      - 'runtime/neuro-kurisu/tests/memory-projection-retrieval-integrity-20261113.mjs'

permissions:
  contents: read

jobs:
  memory-projection-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Multi-timescale and semantic graph regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/memory-projection-retrieval-integrity-20261113.mjs
      - name: MemoryOS2 semantic vector integrity
        working-directory: runtime/neuro-kurisu
        run: npm run test:memory-semantic-vector-integrity
      - name: MemoryFabric retrieval accounting
        working-directory: runtime/neuro-kurisu
        run: npm run test:memory-fabric-semantic-retrieval
      - name: MemoryOS2 metadata retrieval
        working-directory: runtime/neuro-kurisu
        run: npm run test:memoryos2-metadata-retrieval
      - name: Memory subsystem state roundtrip
        working-directory: runtime/neuro-kurisu
        run: npm run test:memory-subsystem-state-roundtrip
      - name: Runtime TypeScript check
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
