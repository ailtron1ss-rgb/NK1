name: NK1 Self Model Restore Integrity
on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - 'runtime/neuro-kurisu/src/organism/cognition/SelfModelV2.ts'
      - 'runtime/neuro-kurisu/tests/self-model-restore-integrity.mjs'
      - '.github/workflows/nk1-self-model-restore-integrity.yml'
  push:
    branches: [workpass70-source]
    paths:
      - 'runtime/neuro-kurisu/src/organism/cognition/SelfModelV2.ts'
      - 'runtime/neuro-kurisu/tests/self-model-restore-integrity.mjs'
      - '.github/workflows/nk1-self-model-restore-integrity.yml'
permissions:
  contents: read
concurrency:
  group: nk1-self-model-restore-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  self-model-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify self-model restore integrity
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/self-model-restore-integrity.mjs
