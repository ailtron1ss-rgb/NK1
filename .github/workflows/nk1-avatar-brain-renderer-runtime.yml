name: NK1 Avatar Brain Renderer Bridge

on:
  push:
    branches: [workpass70-source]
    paths:
      - runtime/neuro-kurisu/src/organism/body/AvatarBrainAffectBridge.ts
      - runtime/neuro-kurisu/src/organism/body/AvatarRendererAdapter.ts
      - runtime/neuro-kurisu/src/organism/body/EmbodimentRuntime.ts
      - runtime/neuro-kurisu/tests/avatar-brain-renderer-runtime.mjs
      - .github/workflows/nk1-avatar-brain-renderer-runtime.yml
  pull_request:
    branches: [workpass70-source]
    paths:
      - runtime/neuro-kurisu/src/organism/body/AvatarBrainAffectBridge.ts
      - runtime/neuro-kurisu/src/organism/body/AvatarRendererAdapter.ts
      - runtime/neuro-kurisu/src/organism/body/EmbodimentRuntime.ts
      - runtime/neuro-kurisu/tests/avatar-brain-renderer-runtime.mjs
      - .github/workflows/nk1-avatar-brain-renderer-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk1-avatar-brain-renderer-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  avatar-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Verify brain-to-renderer projection and capability boundary
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/avatar-brain-renderer-runtime.mjs
      - name: Typecheck runtime
        run: npm --prefix runtime/neuro-kurisu run typecheck
