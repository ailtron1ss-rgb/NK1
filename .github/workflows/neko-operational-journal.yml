name: N.E.K.O. operational journal durability
on:
  pull_request:
    branches:
      - workpass70-source
    paths:
      - 'runtime/neuro-kurisu/src/organism/persistence/OperationalJournal.ts'
      - 'runtime/neuro-kurisu/tests/operational-journal-durability.mjs'
      - 'runtime/neuro-kurisu/tests/operational-hardening.mjs'
      - 'docs/engineering/NK1_OPERATIONAL_JOURNAL_DURABILITY_2026-11-04.md'
      - '.github/workflows/neko-operational-journal.yml'
  push:
    branches:
      - 'aspect/neko-operational-journal-durability-rebased-20261105'
    paths:
      - 'runtime/neuro-kurisu/src/organism/persistence/OperationalJournal.ts'
      - 'runtime/neuro-kurisu/tests/operational-journal-durability.mjs'
      - 'runtime/neuro-kurisu/tests/operational-hardening.mjs'
      - 'docs/engineering/NK1_OPERATIONAL_JOURNAL_DURABILITY_2026-11-04.md'
      - '.github/workflows/neko-operational-journal.yml'
permissions:
  contents: read
concurrency:
  group: neko-operational-journal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  durability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run operational journal durability regressions
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/operational-journal-durability.mjs
      - name: Run existing operational hardening regression
        working-directory: runtime/neuro-kurisu
        run: npm run operational
      - name: Typecheck organism runtime
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
