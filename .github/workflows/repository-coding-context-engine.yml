name: NK1 repository coding context engine

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/system/RepositoryCodingContextEngine.ts"
      - "runtime/neuro-kurisu/tests/repository-coding-context-engine.mjs"
      - "runtime/neuro-kurisu/docs/REPOSITORY_CODING_CONTEXT_ENGINE.md"
      - "runtime/neuro-kurisu/src/organism/index.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - ".github/workflows/repository-coding-context-engine.yml"
  push:
    branches:
      - workpass70-source
      - "aspect/**"
    paths:
      - "runtime/neuro-kurisu/src/organism/system/RepositoryCodingContextEngine.ts"
      - "runtime/neuro-kurisu/tests/repository-coding-context-engine.mjs"
      - "runtime/neuro-kurisu/docs/REPOSITORY_CODING_CONTEXT_ENGINE.md"
      - "runtime/neuro-kurisu/src/organism/index.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - ".github/workflows/repository-coding-context-engine.yml"

permissions:
  contents: read

concurrency:
  group: repository-coding-context-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-coding-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        working-directory: runtime/neuro-kurisu
        run: npm ci
      - name: Repository coding context security and lifecycle contracts
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/repository-coding-context-engine.mjs
      - name: Runtime typecheck
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
