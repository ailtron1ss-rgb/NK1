name: NeuroCore core regression validation

on:
  push:
    branches: [workpass70-source]
    paths:
      - "app/**"
      - "runtime/neuro-kurisu/src/**"
      - "runtime/neuro-kurisu/tests/**"
      - ".github/workflows/workpass71-validation.yml"
      - "tools/audit-assets.mjs"
      - "contracts/inventory/canonical-public-assets-workpass42.json"
      - "app/scripts/sync-canonical-public-assets.mjs"
      - "app/scripts/sync-canonical-public-assets.test.mjs"
      - ".gitignore"
      - "docs/WORKPASS72_HANDOVER_2026-10-19.md"
      - "docs/REPOSITORY_CLEANUP_AUDIT_WORKPASS72.md"
      - "docs/REPOSITORY_CLEANUP_AUDIT_WORKPASS72.json"
      - "README.md"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - "SUPER_VERSION.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies without lifecycle scripts
        run: npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: Audit canonical public asset ownership
        run: node tools/audit-assets.mjs
      - name: Validate grapheme timeline
        run: npm --prefix app run test:embodiment-timeline
      - name: Run app script regression suite
        run: npm --prefix app run test:scripts
      - name: App typecheck
        run: npm --prefix app run typecheck
      - name: App development bundle build
        run: npm --prefix app run build:dev
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: Local LLM bounded-response regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/local-chat-provider-workpass40.mjs
      - name: Local LLM backend selection regression
        run: node runtime/neuro-kurisu/tests/local-llm-selection-workpass74.mjs
      - name: Language invocation ordering regression
        run: node runtime/neuro-kurisu/tests/language-invoke-order-regression.mjs
      - name: Speech gateway, timescale and persistence regression
        shell: bash
        run: |
          set -euo pipefail
          cd runtime/neuro-kurisu
          node --experimental-strip-types tests/workpass71-continuum-timescale.mjs
          node --experimental-strip-types tests/workpass69-speech-interruption-gateway.mjs
          node --experimental-strip-types tests/termux-tts-concurrency-workpass69.mjs
          node --experimental-strip-types tests/workpass64-archived-receipt-reconciliation.mjs
          node --experimental-strip-types tests/organism-smoke.mjs
          node --experimental-strip-types tests/memory-retrieval-experiment.mjs
          node --experimental-strip-types tests/cold-retrieval-residency-regression.mjs
          node --experimental-strip-types tests/memory-retrieval-candidate-coverage.mjs
          node --experimental-strip-types tests/memory-retrieval-numeric-terms.mjs
          node --experimental-strip-types tests/memory-retrieval-fuzzy-workpass32.mjs
          node --experimental-strip-types tests/workpass55-memory-concept-recall.mjs
          node --experimental-strip-types tests/memory-query-intent-workpass51.mjs
          node --experimental-strip-types tests/p2684-memory-residency.mjs
          node --experimental-strip-types tests/p2697-mobile-residency.mjs
          node --experimental-strip-types tests/memory-background-index-workpass56.mjs
          node --experimental-strip-types tests/local-embedding-privacy-workpass56.mjs
          node --experimental-strip-types tests/memory-policy-outcome-verification-gate-workpass72.mjs
          node --experimental-strip-types tests/workpass72-verification-provenance-boundary.mjs
          node --experimental-strip-types tests/memory-semantic-embeddings-workpass33.mjs
          node --experimental-strip-types tests/memory-cognition-retrieval-workpass34.mjs
          node --experimental-strip-types tests/p2693-delayed-policy-credit.mjs
          node --experimental-strip-types tests/p2695-organism-policy-decision-flow.mjs
