name: NK1 Hyperon MeTTa concept bridge
on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/cognition/NeuroSymbolicConceptCompiler.ts"
      - "runtime/neuro-kurisu/tests/hyperon-metta-concept-bridge.mjs"
      - ".github/workflows/hyperon-metta-concept-bridge.yml"
  push:
    branches: ["aspect/hyperon-metta-concept-bridge-20261113"]
    paths:
      - "runtime/neuro-kurisu/src/organism/cognition/NeuroSymbolicConceptCompiler.ts"
      - "runtime/neuro-kurisu/tests/hyperon-metta-concept-bridge.mjs"
      - ".github/workflows/hyperon-metta-concept-bridge.yml"
permissions:
  contents: read
concurrency:
  group: nk1-hyperon-metta-bridge-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked runtime dependencies
        working-directory: runtime/neuro-kurisu
        run: npm ci --no-audit --no-fund
      - name: Runtime typecheck
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
      - name: MeTTa bridge regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/hyperon-metta-concept-bridge.mjs
