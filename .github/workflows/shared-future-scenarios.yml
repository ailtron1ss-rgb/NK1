name: NK1 Shared Future scenario space
on:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/SharedFutureEngine.ts"
      - "runtime/neuro-kurisu/src/organism/developmental/FutureSimulator.ts"
      - "runtime/neuro-kurisu/src/organism/core/CognitiveRuntimeCluster.ts"
      - "runtime/neuro-kurisu/tests/shared-future-scenarios.mjs"
      - ".github/workflows/shared-future-scenarios.yml"
permissions:
  contents: read
jobs:
  shared-future:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Run Shared Future scenario and consent regressions
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/shared-future-scenarios.mjs
      - name: Typecheck runtime
        working-directory: runtime/neuro-kurisu
        run: node scripts/typecheck-runtime.mjs
