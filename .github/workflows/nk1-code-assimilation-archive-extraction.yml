name: NK1 code assimilation archive extraction

on:
  pull_request:
    paths:
      - 'runtime/neuro-kurisu/src/organism/learning/CodeAssimilationArchiveExtraction.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/CodeAssimilationArchiveWorkspace.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/CodeAssimilationArchivePreflight.ts'
      - 'runtime/neuro-kurisu/tests/code-assimilation-archive-extraction-workpass658.mjs'
      - 'runtime/neuro-kurisu/tests/code-assimilation-archive-workspace-workpass659.mjs'
      - '.github/workflows/nk1-code-assimilation-archive-extraction.yml'
  push:
    branches:
      - 'aspect/code-assimilation-archive-extraction-20261104'
      - 'aspect/code-assimilation-sandbox-materialization-20261104'
    paths:
      - 'runtime/neuro-kurisu/src/organism/learning/CodeAssimilationArchiveExtraction.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/CodeAssimilationArchivePreflight.ts'
      - 'runtime/neuro-kurisu/tests/code-assimilation-archive-extraction-workpass658.mjs'
      - '.github/workflows/nk1-code-assimilation-archive-extraction.yml'

permissions:
  contents: read

concurrency:
  group: nk1-code-assimilation-archive-extraction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archive-extraction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Typecheck runtime source boundary
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
      - name: Test bounded quarantine ZIP extraction
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/code-assimilation-archive-extraction-workpass658.mjs
      - name: Test sandbox workspace materialization
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/code-assimilation-archive-workspace-workpass659.mjs
