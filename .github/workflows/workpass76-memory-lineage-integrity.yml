name: NK1 MemoryOS2 revision lineage restore integrity

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/tests/workpass76-memory-lineage-restore-integrity.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "CHANGELOG.md"
      - ".github/workflows/workpass76-memory-lineage-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-lineage-restore-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Runtime typecheck and revision-lineage integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: Run revision lineage restore regression
        run: npm --prefix runtime/neuro-kurisu run test:workpass76:memory-lineage-integrity
      - name: Preserve superseded-memory suppression behavior
        run: npm --prefix runtime/neuro-kurisu run test:workpass87:superseded-memory
      - name: Verify revision graph persistence round-trip
        run: npm --prefix runtime/neuro-kurisu run test:revision-graph:persistence
      - name: Verify revision-aware memory projection
        run: npm --prefix runtime/neuro-kurisu run test:revision-aware-projection
      - name: Verify read-only memory doctor still reports normalized restore damage
        run: npm --prefix runtime/neuro-kurisu run test:p314:memory-doctor
