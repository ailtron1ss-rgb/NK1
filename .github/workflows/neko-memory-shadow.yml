name: N.E.K.O. memory shadow adapter
on:
  pull_request:
    branches:
      - workpass70-source
    paths:
      - 'integrations/neko-memory-shadow/**'
      - 'runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts'
      - 'runtime/neuro-kurisu/tests/neko-memoryos2-ranked-channel-preview.mjs'
      - 'docs/NEKO_NK1_MEMORY_SHADOW_WORKPASS_2026-11-04.md'
      - '.github/workflows/neko-memory-shadow.yml'
  push:
    branches:
      - 'aspect/neko-memory-shadow-rrf-20261104'
    paths:
      - 'integrations/neko-memory-shadow/**'
      - 'runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts'
      - 'runtime/neuro-kurisu/tests/neko-memoryos2-ranked-channel-preview.mjs'
      - 'docs/NEKO_NK1_MEMORY_SHADOW_WORKPASS_2026-11-04.md'
      - '.github/workflows/neko-memory-shadow.yml'
permissions:
  contents: read
concurrency:
  group: neko-memory-shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run isolated RRF and preview adapter tests
        working-directory: integrations/neko-memory-shadow
        run: npm test
      - name: Exercise the real MemoryOS2 preview and answerability gate
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/neko-memoryos2-ranked-channel-preview.mjs
      - name: Typecheck organism runtime
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
