name: N.E.K.O. memory shadow adapter
on:
  pull_request:
    branches:
      - workpass70-source
    paths:
      - 'integrations/neko-memory-shadow/**'
      - '.github/workflows/neko-memory-shadow.yml'
  push:
    branches:
      - 'aspect/neko-memory-shadow-rrf-20261104'
    paths:
      - 'integrations/neko-memory-shadow/**'
      - '.github/workflows/neko-memory-shadow.yml'
permissions:
  contents: read
concurrency:
  group: neko-memory-shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run isolated adapter tests
        working-directory: integrations/neko-memory-shadow
        run: npm test
