name: NK1 world perception integrity

on:
  push:
    paths:
      - "runtime/neuro-kurisu/src/organism/cognition/PerceptionEngine.ts"
      - "runtime/neuro-kurisu/tests/p41-perceptual-integrity-deep-pass.mjs"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/tests/p41-integration.mjs"
      - "runtime/neuro-kurisu/src/organism/body/VisionSemanticBackend.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/PerceptualEpistemicGraph.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/P41SemanticPerception.ts"
      - "runtime/neuro-kurisu/src/organism/world/GroundedWorldState.ts"
      - "runtime/neuro-kurisu/src/organism/body/PerceptualEvidenceCompiler.ts"
      - "runtime/neuro-kurisu/src/organism/body/GeminiVisionSemanticBackend.ts"
      - "runtime/neuro-kurisu/src/organism/body/TemporalObjectTracker.ts"
      - "runtime/neuro-kurisu/tests/temporal-object-tracker.mjs"
      - "runtime/neuro-kurisu/tests/world-perception-camera-runtime-tracking.mjs"
      - "runtime/neuro-kurisu/tests/world-perception-grounded-identity-provenance.mjs"
      - "runtime/neuro-kurisu/tests/gemini-vision-mime-integrity.mjs"
      - "runtime/neuro-kurisu/src/organism/core/WorldContextNormalizer.ts"
      - "runtime/neuro-kurisu/src/organism/core/types.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/tests/*perception*.mjs"
      - "runtime/neuro-kurisu/tests/world-context-normalizer-integrity.mjs"
      - "runtime/neuro-kurisu/tests/world-perception-delta-integrity.mjs"
      - "runtime/neuro-kurisu/tests/world-perception-runtime-wiring.mjs"
      - "runtime/neuro-kurisu/tests/world-perception-runtime-ingress.mjs"
      - "runtime/neuro-kurisu/package.json"
      - ".github/workflows/world-perception-integrity.yml"
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/cognition/PerceptionEngine.ts"
      - "runtime/neuro-kurisu/tests/p41-perceptual-integrity-deep-pass.mjs"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/tests/p41-integration.mjs"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/body/VisionSemanticBackend.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/PerceptualEpistemicGraph.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/P41SemanticPerception.ts"
      - "runtime/neuro-kurisu/src/organism/world/GroundedWorldState.ts"
      - "runtime/neuro-kurisu/src/organism/body/PerceptualEvidenceCompiler.ts"
      - "runtime/neuro-kurisu/src/organism/body/GeminiVisionSemanticBackend.ts"
      - "runtime/neuro-kurisu/src/organism/body/TemporalObjectTracker.ts"
      - "runtime/neuro-kurisu/tests/temporal-object-tracker.mjs"
      - "runtime/neuro-kurisu/tests/world-perception-camera-runtime-tracking.mjs"
      - "runtime/neuro-kurisu/tests/world-perception-grounded-identity-provenance.mjs"
      - "runtime/neuro-kurisu/tests/gemini-vision-mime-integrity.mjs"
      - "runtime/neuro-kurisu/src/organism/core/WorldContextNormalizer.ts"
      - "runtime/neuro-kurisu/src/organism/core/types.ts"
      - "runtime/neuro-kurisu/tests/*perception*.mjs"
      - "runtime/neuro-kurisu/tests/world-context-normalizer-integrity.mjs"
      - "runtime/neuro-kurisu/tests/world-perception-delta-integrity.mjs"
      - "runtime/neuro-kurisu/package.json"
      - ".github/workflows/world-perception-integrity.yml"

permissions:
  contents: read

concurrency:
  group: nk1-world-perception-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  world-perception-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        working-directory: runtime/neuro-kurisu
        run: npm ci
      - name: Run world-context normalizer integrity tests
        working-directory: runtime/neuro-kurisu
        run: npm run test:world-context-normalizer-integrity
      - name: Run sensor integrity and stale-sample tests
        working-directory: runtime/neuro-kurisu
        run: npm run test:perception-engine-signal-integrity
      - name: Run semantic world-delta and resource-pressure tests
        working-directory: runtime/neuro-kurisu
        run: npm run test:world-perception-delta-integrity
      - name: Verify normalized world context reaches canonical core
        working-directory: runtime/neuro-kurisu
        run: npm run test:world-perception-runtime-wiring
      - name: Exercise event flow in a real OrganismRuntime step
        working-directory: runtime/neuro-kurisu
        run: npm run test:world-perception-runtime-ingress
      - name: Run canonical P41 semantic perception regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p41:semantic-perception
      - name: Run Core P41 cross-modal identity integration
        working-directory: runtime/neuro-kurisu
        run: npm run test:p41:integration
      - name: Run P41 instance tracking, calibration, and epistemic integrity
        working-directory: runtime/neuro-kurisu
        run: npm run test:p41:perceptual-integrity-deep-pass
      - name: Run P41 independent-evidence truthfulness regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p41:truthfulness
      - name: Verify grounded object identity and evidence provenance
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/world-perception-grounded-identity-provenance.mjs
      - name: Verify camera MIME and spatial evidence integrity
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/gemini-vision-mime-integrity.mjs
      - name: Verify temporal object identity across camera frames
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/temporal-object-tracker.mjs
      - name: Exercise canonical runtime camera capture and tracking
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/world-perception-camera-runtime-tracking.mjs
      - name: Type-check canonical runtime
        if: always()
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
