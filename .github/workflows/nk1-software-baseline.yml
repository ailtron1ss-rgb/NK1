name: NK1 integrated software baseline
on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/**"
      - "app/**"
      - "scripts/verify-organism-software-baseline.sh"
      - ".github/workflows/nk1-software-baseline.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nk1-software-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  software-baseline:
    name: Runtime and embodiment software contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up repository-pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            runtime/neuro-kurisu/package-lock.json
            app/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Install locked app dependencies
        run: npm ci --prefix app --no-audit --no-fund
      - name: Run integrated software baseline
        run: bash scripts/verify-organism-software-baseline.sh
