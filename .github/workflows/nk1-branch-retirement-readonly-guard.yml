name: NK1 Branch Retirement Read-Only Guard

on:
  push:
    paths:
      - 'tools/retire-cognitive-branch-refs.mjs'
      - 'tests/branch-retirement-readonly.mjs'
      - 'tests/fixtures/mock-branch-retirement-github-api.mjs'
      - '.github/workflows/nk1-cognitive-branch-retirement.yml'
      - '.github/workflows/nk1-branch-retirement-readonly-guard.yml'
  pull_request:
    branches: [workpass70-source]
    paths:
      - 'tools/retire-cognitive-branch-refs.mjs'
      - 'tests/branch-retirement-readonly.mjs'
      - 'tests/fixtures/mock-branch-retirement-github-api.mjs'
      - '.github/workflows/nk1-cognitive-branch-retirement.yml'
      - '.github/workflows/nk1-branch-retirement-readonly-guard.yml'

permissions:
  contents: read

concurrency:
  group: nk1-branch-retirement-readonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prove branch-retirement utility cannot mutate refs
        run: node tests/branch-retirement-readonly.mjs
