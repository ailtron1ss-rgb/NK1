name: NK1 self-prior coherence regulation
on:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/cognition/IntrinsicMotivationGoalCoupling.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/SelfPriorDensityModel.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/IntrinsicMotivationEngine.ts"
      - "runtime/neuro-kurisu/tests/self-prior-coherence-regulation.mjs"
      - "runtime/neuro-kurisu/src/organism/core/types.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/B272EndogenousGoalGenesis.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/core/CognitiveRuntimeCluster.ts"
      - "runtime/neuro-kurisu/tests/intrinsic-motivation-goal-coupling.mjs"
      - ".github/workflows/self-prior-coherence-regulation.yml"
  push:
    branches:
      - "aspect/intrinsic-drive-goal-coupling-20261103"
      - "aspect/metacognitive-memory-autonomy-live-20261103"
      - "aspect/self-prior-coherence-regulation-20261104"
    paths:
      - "runtime/neuro-kurisu/src/organism/cognition/IntrinsicMotivationGoalCoupling.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/SelfPriorDensityModel.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/IntrinsicMotivationEngine.ts"
      - "runtime/neuro-kurisu/tests/self-prior-coherence-regulation.mjs"
      - "runtime/neuro-kurisu/src/organism/core/types.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/B272EndogenousGoalGenesis.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/tests/intrinsic-motivation-goal-coupling.mjs"
      - ".github/workflows/self-prior-coherence-regulation.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Run self-prior drift, calibration and coherence regressions
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/intrinsic-motivation-goal-coupling.mjs && node --experimental-strip-types runtime/neuro-kurisu/tests/self-prior-coherence-regulation.mjs
      - name: Typecheck runtime
        working-directory: runtime/neuro-kurisu
        run: node scripts/typecheck-runtime.mjs
