name: NK1 self-model, motivation and autonomy receipts
on:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/system/AutonomousDecisionReceipt.ts"
      - "runtime/neuro-kurisu/src/organism/system/AutonomousSocialInitiativeEngine.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/core/AgencySubsystemRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/persistence/StateMigrations.ts"
      - "runtime/neuro-kurisu/tests/self-motivation-autonomy-receipt.mjs"
      - "runtime/neuro-kurisu/tests/self-motivation-autonomy-runtime.mjs"
      - ".github/workflows/nk1-self-motivation-autonomy.yml"
  push:
    branches:
      - "aspect/nk1-self-motivation-autonomy-*"
    paths:
      - "runtime/neuro-kurisu/src/organism/system/AutonomousDecisionReceipt.ts"
      - "runtime/neuro-kurisu/src/organism/system/AutonomousSocialInitiativeEngine.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/core/AgencySubsystemRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/persistence/StateMigrations.ts"
      - "runtime/neuro-kurisu/tests/self-motivation-autonomy-receipt.mjs"
      - "runtime/neuro-kurisu/tests/self-motivation-autonomy-runtime.mjs"
      - ".github/workflows/nk1-self-motivation-autonomy.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Decision receipt and delivery-policy unit regressions
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/self-motivation-autonomy-receipt.mjs
      - name: Decision receipt end-to-end runtime regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/self-motivation-autonomy-runtime.mjs
      - name: Existing motivation coupling regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/intrinsic-motivation-goal-coupling.mjs
      - name: Existing proactive-initiative anti-repeat regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/autonomous-social-anti-repeat-bm25.mjs
      - name: Typecheck runtime
        working-directory: runtime/neuro-kurisu
        run: node scripts/typecheck-runtime.mjs
