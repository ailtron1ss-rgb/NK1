name: NK1 runtime shutdown durability

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/tests/runtime-shutdown-durability.mjs"
      - ".github/workflows/nk1-runtime-shutdown-durability.yml"

permissions:
  contents: read

concurrency:
  group: nk1-runtime-shutdown-durability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shutdown-durability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Runtime shutdown durability regression
        run: node --experimental-strip-types --test runtime/neuro-kurisu/tests/runtime-shutdown-durability.mjs
