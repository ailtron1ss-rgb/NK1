name: NK1 bilingual concept-stem precision
on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - 'runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts'
      - 'runtime/neuro-kurisu/tests/memory-retrieval-concept-stem-precision.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/nk1-memory-concept-stem-precision.yml'
  push:
    branches: [aspect/memory-concept-stem-precision-current-20261123]
    paths:
      - 'runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts'
      - 'runtime/neuro-kurisu/tests/memory-retrieval-concept-stem-precision.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/nk1-memory-concept-stem-precision.yml'
permissions:
  contents: read
concurrency:
  group: nk1-memory-concept-stem-precision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  memory-concept-stem-precision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Verify concept-stem precision regression
        run: npm --prefix runtime/neuro-kurisu run test:memory-retrieval-concept-stem-precision
      - name: Preserve cross-lingual bridge behavior
        run: npm --prefix runtime/neuro-kurisu run test:memory-retrieval-cross-lingual-bridge
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
