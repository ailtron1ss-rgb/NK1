name: NK1 cognitive branch retirement candidate audit (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    if: github.ref == 'refs/heads/workpass70-source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Report candidate refs without mutating repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/retire-cognitive-branch-refs.mjs
