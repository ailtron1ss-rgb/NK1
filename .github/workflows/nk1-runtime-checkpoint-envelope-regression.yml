name: NK1 Runtime Checkpoint Envelope Revival

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/persistence/StateMigrations.ts"
      - "runtime/neuro-kurisu/src/organism/persistence/OperationalJournal.ts"
      - "runtime/neuro-kurisu/src/organism/system/RuntimeCheckpointEnvelope.ts"
      - "runtime/neuro-kurisu/tests/runtime-checkpoint-envelope-revival.mjs"
      - "runtime/neuro-kurisu/package.json"
      - ".github/workflows/nk1-runtime-checkpoint-envelope-regression.yml"
  push:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/persistence/StateMigrations.ts"
      - "runtime/neuro-kurisu/src/organism/persistence/OperationalJournal.ts"
      - "runtime/neuro-kurisu/src/organism/system/RuntimeCheckpointEnvelope.ts"
      - "runtime/neuro-kurisu/tests/runtime-checkpoint-envelope-revival.mjs"
      - "runtime/neuro-kurisu/package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk1-runtime-checkpoint-envelope-revival-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Run the canonical runtime checkpoint contract
        run: npm --prefix runtime/neuro-kurisu run test:runtime-checkpoint-envelope-revival
