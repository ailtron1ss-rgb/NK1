name: NK1 Memory explicit-ID integrity

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/tests/memory-*.mjs"
      - ".github/workflows/nk1-memory-id-integrity.yml"
  push:
    branches: [aspect/memory-write-id-integrity-20261123]
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/tests/memory-duplicate-id-write-guard.mjs"
      - ".github/workflows/nk1-memory-id-integrity.yml"

permissions:
  contents: read

concurrency:
  group: nk1-memory-id-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  explicit-id-write-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify explicit IDs remain unique through write and restore
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/memory-duplicate-id-write-guard.mjs
      - name: Verify live writes normalize defaults and preserve merged signals
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/memory-write-defaults-integrity.mjs
      - name: Verify capacity, eviction and durable byte accounting
        working-directory: runtime/neuro-kurisu
        run: |
          node --experimental-strip-types tests/memory-byte-budget-consistency.mjs
          node --experimental-strip-types tests/memory-byte-estimate-idempotency.mjs
          node --experimental-strip-types tests/memory-capacity-protection.mjs
          node --experimental-strip-types tests/memory-evidence-lineage-bytes.mjs
      - name: Verify revision graph and temporal reachability
        working-directory: runtime/neuro-kurisu
        run: |
          node --experimental-strip-types tests/memory-conflict-revision-graph.mjs
          node --experimental-strip-types tests/memory-revision-tip-reachability.mjs
          node --experimental-strip-types tests/memory-temporal-validity-write-guard.mjs
      - name: Verify restore, metadata indexes and grounded recall
        working-directory: runtime/neuro-kurisu
        run: |
          node --experimental-strip-types tests/memory-live-restore-oracle-fuzz.mjs
          node --experimental-strip-types tests/memory-metadata-index-consistency.mjs
          node --experimental-strip-types tests/memory-answerability-word-root.mjs
          node --experimental-strip-types tests/memory-tip-of-tongue-partial-activation.mjs
