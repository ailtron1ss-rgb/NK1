name: NK1 Android telemetry provenance integrity

on:
  push:
    branches:
      - fix/android-telemetry-provenance-20261102
    paths:
      - 'runtime/neuro-kurisu/src/organism/body/AndroidEmbodimentBridge.ts'
      - 'runtime/neuro-kurisu/tests/android-telemetry-provenance.mjs'
      - '.github/workflows/android-telemetry-provenance.yml'
  pull_request:
    branches:
      - workpass70-source
    paths:
      - 'runtime/neuro-kurisu/src/organism/body/AndroidEmbodimentBridge.ts'
      - 'runtime/neuro-kurisu/tests/android-telemetry-provenance.mjs'
      - '.github/workflows/android-telemetry-provenance.yml'

permissions:
  contents: read

concurrency:
  group: nk1-android-telemetry-provenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-telemetry-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked runtime dependencies
        working-directory: runtime/neuro-kurisu
        run: npm ci --no-audit --no-fund
      - name: Test Android telemetry provenance and malformed payload handling
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/android-telemetry-provenance.mjs
      - name: Type-check canonical runtime
        if: always()
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
