name: NK1 goal-bound planner lineage

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - 'runtime/neuro-kurisu/src/organism/world/PlanEngine.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts'
      - 'runtime/neuro-kurisu/tests/goal-bound-plan-lineage-20261126.mjs'
      - 'runtime/neuro-kurisu/tests/goal-bound-plan-runtime-integration-20261126.mjs'
      - 'runtime/neuro-kurisu/tests/cognitive-runtime-planner-execution-gate-workpass603.mjs'
      - 'runtime/neuro-kurisu/tests/p10-planner-integration.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/nk1-goal-bound-planner-lineage.yml'
permissions:
  contents: read
concurrency:
  group: nk1-goal-bound-planner-lineage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  planner-lineage:
    name: Goal-bound plan contract and runtime gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/neuro-kurisu
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Goal-bound plan lineage contract
        run: npm run test:goal-bound-plan-lineage
      - name: Runtime-bound canonical decision lineage integration
        run: npm run test:goal-bound-plan-runtime-integration
      - name: Planner execution budget and runtime gate contract
        run: node --experimental-strip-types tests/cognitive-runtime-planner-execution-gate-workpass603.mjs
      - name: Existing PlanEngine integration
        run: node --experimental-strip-types tests/p10-planner-integration.mjs
      - name: Existing planner fallback
        run: node --experimental-strip-types tests/p2750-planner-fallback.mjs
      - name: Execution budget and runtime gate
        run: node --experimental-strip-types tests/cognitive-execution-planner-stage-workpass591.mjs
      - name: Planner cadence and budget regressions
        run: node --experimental-strip-types tests/cognitive-execution-planner-cadence-workpass586.mjs && node --experimental-strip-types tests/cognitive-execution-planner-budget-workpass587.mjs
      - name: Planner restore integrity
        run: node --experimental-strip-types tests/cognitive-execution-planner-restore-integrity-workpass611.mjs
      - name: Cognitive planner and ActionGateway route
        run: npm run test:workpass97:planner-route
      - name: Install pinned TypeScript compiler for semantic checking
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund typescript@5.8.3 @types/node@22.20.5
      - name: Semantic runtime TypeScript check
        run: npm run typecheck
