name: WorkPass362 clean app build and release contracts

on:
  push:
    branches: [workpass349-native-dataset-path-identity-2026-10-26]
    paths:
      - "app/**"
      - "migrations/**"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/server/server.mjs"
      - "runtime/neuro-kurisu/tests/workpass358-organism-runtime-restart-memory.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - "package.json"
      - "tools/super-launch.test.mjs"
      - "tools/super-dev.mjs"
      - "tools/super-start.mjs"
      - "tools/super-paths.mjs"
      - "package-lock.json"
      - "tools/super-doctor.mjs"
      - "tools/app-dependency-contract.test.mjs"
      - ".github/workflows/workpass362-clean-app-build.yml"
  pull_request:
    branches: [workpass334-inner-imperative-homeostasis-2026-10-24]
    paths:
      - "app/**"
      - "migrations/**"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/server/server.mjs"
      - "runtime/neuro-kurisu/tests/workpass358-organism-runtime-restart-memory.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - "package.json"
      - "tools/super-launch.test.mjs"
      - "tools/super-dev.mjs"
      - "tools/super-start.mjs"
      - "tools/super-paths.mjs"
      - "package-lock.json"
      - "tools/super-doctor.mjs"
      - "tools/app-dependency-contract.test.mjs"
      - ".github/workflows/workpass362-clean-app-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk1-workpass362-app-build-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  clean-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nk1_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nk1_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify clean-checkout prerequisites before installing dependencies
        run: npm run doctor
      - name: Install the locked root orchestrator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify root launcher paths and state directory contract
        run: npm run test:super-launch
      - name: Install locked app dependencies
        run: npm ci --prefix app --no-audit --no-fund
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Verify app dependency and script contracts
        run: npm run test:app-dependency-contract && npm run test:app:scripts
      - name: Type-check app and organism runtime together
        run: npm run typecheck
      - name: Build production UI and exercise the migration entry point
        env:
          NODE_ENV: "production"
        run: npm --prefix app run build
      - name: Exercise real PostgreSQL migration apply, rerun and rollback
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nk1_ci
        run: node app/scripts/migrate-postgres.integration.mjs
      - name: Verify UI-to-runtime API linkage
        run: npm run audit:ui-api-linkage
      - name: Verify runtime schema contracts
        run: npm run check:schema
      - name: Verify canonical public assets remain consistent after build
        run: npm run audit:assets
