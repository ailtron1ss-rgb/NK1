name: OME26 Hyper-Plastic Network

on:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/server/local-language-backend-policy.mjs"
      - "runtime/neuro-kurisu/src/organism/research/HyperPlasticNetwork.ts"
      - "runtime/neuro-kurisu/tests/ome26-hyper-plastic-network.mjs"
      - ".github/workflows/ome26-hyper-plastic-network.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ome26-hyper-plastic-network-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify Hyper-Plastic Network research contract
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/ome26-hyper-plastic-network.mjs
