name: NK1 Operational Journal Cursor Regression

on:
  pull_request:
    branches:
      - workpass70-source
    paths:
      - 'runtime/neuro-kurisu/src/organism/persistence/OperationalJournal.ts'
      - 'runtime/neuro-kurisu/tests/operational-journal-cursor-workpass84.mjs'
      - '.github/workflows/operational-journal-cursor-regression.yml'
      - 'Прогресс/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-journal-cursor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cursor-regression:
    name: Operational journal cursor + durability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up the repository-pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run cursor durability regressions
        run: node --experimental-strip-types --test runtime/neuro-kurisu/tests/operational-journal-cursor-workpass84.mjs
