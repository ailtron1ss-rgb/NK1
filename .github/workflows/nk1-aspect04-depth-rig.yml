name: NK1 Aspect 04 — 2.5D depth rig
on:
  pull_request:
    paths:
      - "app/src/components/avatar/depthRig.ts"
      - "app/src/components/avatar/embodimentIntentAdapter.ts"
      - "app/src/components/avatar/depthRigRendererAdapter.ts"
      - "app/scripts/depth-rig.test.mjs"
      - ".github/workflows/nk1-aspect04-depth-rig.yml"
  push:
    branches:
      - "work/nk1-aspect04-depth-rig-2026-10-30"
    paths:
      - "app/src/components/avatar/depthRig.ts"
      - "app/src/components/avatar/embodimentIntentAdapter.ts"
      - "app/scripts/depth-rig.test.mjs"
      - ".github/workflows/nk1-aspect04-depth-rig.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  depth-rig-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate layered rig contract
        working-directory: app
        run: node --experimental-strip-types --test scripts/depth-rig.test.mjs
