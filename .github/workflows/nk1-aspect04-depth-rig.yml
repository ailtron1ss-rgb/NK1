name: NK1 Aspect 04 — 2.5D depth rig
on:
  pull_request:
    paths:
      - "app/src/components/avatar/depthRig.ts"
      - "app/scripts/depth-rig.test.mjs"
      - ".github/workflows/nk1-aspect04-depth-rig.yml"
  push:
    branches:
      - "work/nk1-aspect04-depth-rig-2026-10-30"
    paths:
      - "app/src/components/avatar/depthRig.ts"
      - "app/scripts/depth-rig.test.mjs"
      - ".github/workflows/nk1-aspect04-depth-rig.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  depth-rig-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Validate layered rig contract
        working-directory: app
        run: node --experimental-strip-types --test scripts/depth-rig.test.mjs
