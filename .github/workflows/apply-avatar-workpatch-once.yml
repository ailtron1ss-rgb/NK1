name: one-time avatar workpatch bootstrap
on:
  push:
    branches:
      - aspect/avatar-visual-prototype-polish-20261124
permissions:
  contents: write
jobs:
  apply-workpatch:
    if: github.event.head_commit.message == 'bootstrap: apply avatar workpatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Apply validated avatar workpatch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .github/workpatches/avatar-visual-prototype-20261125.patch.gz | git apply --check
          gzip -dc .github/workpatches/avatar-visual-prototype-20261125.patch.gz | git apply --index
          rm .github/workpatches/avatar-visual-prototype-20261125.patch.gz
          rm .github/workflows/apply-avatar-workpatch-once.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(avatar): route contact through organism embodiment'
          git push origin "HEAD:${GITHUB_REF_NAME}"
