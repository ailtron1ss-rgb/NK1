name: WorkPass99 replay strategy benchmark

on:
  push:
    branches: [workpass79-cognitive-rebuild, workpass206-runtime-evaluator-wiring]
    paths:
      - 'runtime/neuro-kurisu/src/organism/learning/ReplaySelectionPolicy.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/P23LearningEngine.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/MultiSourceLearningMechanisms.ts'
      - 'runtime/neuro-kurisu/tests/p23-replay-selection-policy.mjs'
      - 'runtime/neuro-kurisu/tests/p23-replay-runtime-config.mjs'
      - 'runtime/neuro-kurisu/tests/p23-replay-strategy-benchmark.mjs'
      - '.github/workflows/workpass99-replay-strategy-benchmark.yml'
      - 'runtime/neuro-kurisu/package.json'
      - 'runtime/neuro-kurisu/package-lock.json'
      - 'runtime/neuro-kurisu/tsconfig.clean.json'
      - 'runtime/neuro-kurisu/src/node-shims.d.ts'
      - '.nvmrc'
  pull_request:
    paths:
      - 'runtime/neuro-kurisu/tests/p23-replay-strategy-benchmark.mjs'
      - '.github/workflows/workpass99-replay-strategy-benchmark.yml'
      - 'runtime/neuro-kurisu/package.json'
      - 'runtime/neuro-kurisu/package-lock.json'
      - 'runtime/neuro-kurisu/tsconfig.clean.json'
      - 'runtime/neuro-kurisu/src/node-shims.d.ts'
      - '.nvmrc'
      - 'runtime/neuro-kurisu/src/organism/learning/ReplaySelectionPolicy.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/P23LearningEngine.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/MultiSourceLearningMechanisms.ts'
      - 'runtime/neuro-kurisu/tests/p23-replay-selection-policy.mjs'
      - 'runtime/neuro-kurisu/tests/p23-replay-runtime-config.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk1-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  replay-strategy-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Compare replay selection strategies
        run: |
          node --experimental-transform-types runtime/neuro-kurisu/tests/p23-replay-selection-policy.mjs
          node --experimental-transform-types runtime/neuro-kurisu/tests/p23-replay-runtime-config.mjs
          node --experimental-transform-types runtime/neuro-kurisu/tests/p23-replay-strategy-benchmark.mjs
