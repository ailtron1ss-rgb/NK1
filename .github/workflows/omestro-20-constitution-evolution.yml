name: OmeStro 20 — Constitution Evolution

on:
  push:
    branches:
      - aspect/omestro-20-constitution-evolution-20261117
      - workpass70-source
    paths:
      - "runtime/neuro-kurisu/src/organism/cognition/evolution/ConstitutionEvolutionEngine.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/evolution/ConstitutionReviewAuthority.ts"
      - "runtime/neuro-kurisu/src/organism/core/GovernanceSubsystemRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/core/PersistenceProjectionCoordinator.ts"
      - "runtime/neuro-kurisu/src/organism/core/types.ts"
      - "runtime/neuro-kurisu/src/organism/system/ActionGateway.ts"
      - "runtime/neuro-kurisu/src/server/server.mjs"
      - "runtime/neuro-kurisu/tests/constitution-evolution-*.mjs"
      - "runtime/neuro-kurisu/tests/p69-p73-giant.mjs"
      - "runtime/neuro-kurisu/docs/OMESTRO_20_CONSTITUTION_EVOLUTION.md"
      - "app/src/neuro-kurisu/api.ts"
      - "app/src/components/ActionApprovalCenter.tsx"
      - "app/src/components/ConstitutionEvolutionConsole.tsx"
      - "app/src/routes/index.tsx"
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/omestro-20-constitution-evolution.yml"
  pull_request:
    branches:
      - workpass70-source
    paths:
      - "runtime/neuro-kurisu/src/organism/cognition/evolution/ConstitutionEvolutionEngine.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/evolution/ConstitutionReviewAuthority.ts"
      - "runtime/neuro-kurisu/src/organism/core/GovernanceSubsystemRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/core/PersistenceProjectionCoordinator.ts"
      - "runtime/neuro-kurisu/src/organism/core/types.ts"
      - "runtime/neuro-kurisu/src/organism/system/ActionGateway.ts"
      - "runtime/neuro-kurisu/src/server/server.mjs"
      - "runtime/neuro-kurisu/tests/constitution-evolution-*.mjs"
      - "runtime/neuro-kurisu/tests/p69-p73-giant.mjs"
      - "runtime/neuro-kurisu/docs/OMESTRO_20_CONSTITUTION_EVOLUTION.md"
      - "app/src/neuro-kurisu/api.ts"
      - "app/src/components/ActionApprovalCenter.tsx"
      - "app/src/components/ConstitutionEvolutionConsole.tsx"
      - "app/src/routes/index.tsx"
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/omestro-20-constitution-evolution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omestro-20-constitution-evolution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            runtime/neuro-kurisu/package-lock.json
            app/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Install locked app dependencies
        run: npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: App typecheck
        run: npm --prefix app run typecheck
      - name: Constitutional lifecycle and invariant tests
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/constitution-evolution-engine.mjs
      - name: Signed independent constitutional review authority
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/constitution-evolution-review-authority.mjs
      - name: End-to-end server API, ActionGateway ratification and rollback
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/constitution-evolution-server.mjs
      - name: Governance snapshot, restore and fail-closed integration
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/constitution-evolution-runtime-integration.mjs
      - name: Existing P69-P73 runtime persistence regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/p69-p73-giant.mjs
