name: NK1 ChronoTruth bitemporal memory

on:
  push:
    branches: [aspect/chrono-truth-bitemporal-memory-20261117]
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/organism/memory/MemoryFabric.ts"
      - "runtime/neuro-kurisu/tests/chrono-truth-bitemporal-memory.mjs"
      - ".github/workflows/nk1-chrono-truth-bitemporal-memory.yml"
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/organism/memory/MemoryFabric.ts"
      - "runtime/neuro-kurisu/tests/chrono-truth-bitemporal-memory.mjs"
      - ".github/workflows/nk1-chrono-truth-bitemporal-memory.yml"

permissions:
  contents: read

concurrency:
  group: nk1-chrono-truth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bitemporal-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: ChronoTruth behavioral regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/chrono-truth-bitemporal-memory.mjs
      - name: Existing temporal revision regression
        run: npm --prefix runtime/neuro-kurisu run test:memory-temporal-inspector-closure
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
