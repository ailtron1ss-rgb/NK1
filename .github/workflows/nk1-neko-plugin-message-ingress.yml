name: NK1 N.E.K.O. plugin message ingress

on:
  pull_request:
    branches: [workpass70-source, "aspect/**"]
    paths:
      - "runtime/neuro-kurisu/src/organism/integration/neko/PluginMessageIngress.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/tests/neko-plugin-message-ingress.mjs"
      - ".github/workflows/nk1-neko-plugin-message-ingress.yml"
  push:
    branches: [workpass70-source, "aspect/**"]
    paths:
      - "runtime/neuro-kurisu/src/organism/integration/neko/PluginMessageIngress.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/tests/neko-plugin-message-ingress.mjs"
      - ".github/workflows/nk1-neko-plugin-message-ingress.yml"

permissions:
  contents: read

concurrency:
  group: nk1-neko-plugin-message-ingress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  message-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        working-directory: runtime/neuro-kurisu
        run: npm ci
      - name: N.E.K.O. push_message.v2 ingress contract
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/neko-plugin-message-ingress.mjs
      - name: Existing N.E.K.O. ActionGateway adapter regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:neko-plugin-gateway-adapter
      - name: Real ActionGateway integration
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/neko-plugin-gateway-real-action-gateway.mjs
      - name: Preserve existing tool-input contract regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:tool-input-contracts-workpass624
      - name: Runtime typecheck
        if: always()
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
