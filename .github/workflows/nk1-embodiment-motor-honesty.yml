name: NK1 embodiment motor-honesty regressions

on:
  workflow_dispatch:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "app/src/components/avatar/depthRig.ts"
      - "app/src/components/avatar/planarArmIK.ts"
      - "app/src/components/avatar/embodimentIntentAdapter.ts"
      - "app/scripts/depth-rig.test.mjs"
      - "app/scripts/planar-arm-ik.test.mjs"
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/nk1-embodiment-motor-honesty.yml"
  push:
    branches: [consolidation/embodiment-motor-honesty-current-20261120]
    paths:
      - "app/src/components/avatar/depthRig.ts"
      - "app/src/components/avatar/planarArmIK.ts"
      - "app/src/components/avatar/embodimentIntentAdapter.ts"
      - "app/scripts/depth-rig.test.mjs"
      - "app/scripts/planar-arm-ik.test.mjs"
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/nk1-embodiment-motor-honesty.yml"

permissions:
  contents: read

concurrency:
  group: nk1-embodiment-motor-honesty-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  embodiment-motor-honesty:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked app dependencies
        run: npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: App TypeScript check
        run: npm --prefix app run typecheck
      - name: Focused embodiment regressions
        run: |
          node --experimental-strip-types --test app/scripts/depth-rig.test.mjs
          npm --prefix app run test:planar-arm-ik
