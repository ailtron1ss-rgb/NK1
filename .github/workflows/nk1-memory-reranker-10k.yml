name: NK1 Memory Reranker 10k Performance Gate
on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - 'runtime/neuro-kurisu/src/organism/developmental/MemorySemanticReranker.ts'
      - 'runtime/neuro-kurisu/tests/memory-semantic-affect-reranking.mjs'
      - 'runtime/neuro-kurisu/tests/memory-semantic-affect-reranker-benchmark.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/nk1-memory-reranker-10k.yml'
  push:
    branches: [workpass70-source]
    paths:
      - 'runtime/neuro-kurisu/src/organism/developmental/MemorySemanticReranker.ts'
      - 'runtime/neuro-kurisu/tests/memory-semantic-affect-reranking.mjs'
      - 'runtime/neuro-kurisu/tests/memory-semantic-affect-reranker-benchmark.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/nk1-memory-reranker-10k.yml'
permissions:
  contents: read
concurrency:
  group: nk1-memory-reranker-10k-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  memory-reranker-10k:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Memory reranker contract
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/memory-semantic-affect-reranking.mjs
      - name: MemoryFabric semantic retrieval regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/memory-fabric-semantic-retrieval.mjs
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: Profile 10k semantic-memory candidates (p95 <= 30ms)
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/memory-semantic-affect-reranker-benchmark.mjs
