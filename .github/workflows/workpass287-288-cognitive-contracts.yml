name: WorkPass287-288 cognitive contracts

on:
  push:
    paths:
      - "runtime/neuro-kurisu/src/organism/system/UnifiedCognitiveCycle.ts"
      - "runtime/neuro-kurisu/src/organism/core/UnifiedCognitiveSubstrate.ts"
      - "runtime/neuro-kurisu/tests/workpass617-unified-substrate-restore-integrity.mjs"
      - "runtime/neuro-kurisu/src/organism/memory/CanonicalMemoryLifecycleAuthority.ts"
      - "runtime/neuro-kurisu/src/organism/developmental/P70MemoryLifecycleGovernor.ts"
      - "runtime/neuro-kurisu/tests/workpass618-canonical-memory-lifecycle-integrity.mjs"
      - "runtime/neuro-kurisu/src/organism/cognition/IntrinsicMotivationEngine.ts"
      - "runtime/neuro-kurisu/tests/workpass287-unified-cycle-contract.mjs"
      - "runtime/neuro-kurisu/tests/workpass288-intrinsic-motivation-contract.mjs"
      - "runtime/neuro-kurisu/src/organism/cognition/B272EndogenousGoalGenesis.ts"
      - "runtime/neuro-kurisu/tests/big-pass-272-endogenous-goal-genesis.mjs"
      - "runtime/neuro-kurisu/package.json"
      - ".github/workflows/workpass287-288-cognitive-contracts.yml"
      - 'runtime/neuro-kurisu/package-lock.json'
      - 'runtime/neuro-kurisu/tsconfig.clean.json'
      - 'runtime/neuro-kurisu/src/node-shims.d.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismCore.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts'
      - 'runtime/neuro-kurisu/src/organism/persistence/StateMigrations.ts'
      - 'runtime/neuro-kurisu/src/organism/system/RealityEvidenceLedger.ts'
      - 'runtime/neuro-kurisu/tests/nk1-cognitive-unified-ownership-regression.mjs'
      - 'runtime/neuro-kurisu/tests/workpass287-cognitive-architecture-contract.mjs'
      - 'runtime/neuro-kurisu/tests/workpass319-cycle-order.mjs'
      - '.nvmrc'
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/system/UnifiedCognitiveCycle.ts"
      - "runtime/neuro-kurisu/src/organism/core/UnifiedCognitiveSubstrate.ts"
      - "runtime/neuro-kurisu/tests/workpass617-unified-substrate-restore-integrity.mjs"
      - "runtime/neuro-kurisu/src/organism/memory/CanonicalMemoryLifecycleAuthority.ts"
      - "runtime/neuro-kurisu/src/organism/developmental/P70MemoryLifecycleGovernor.ts"
      - "runtime/neuro-kurisu/tests/workpass618-canonical-memory-lifecycle-integrity.mjs"
      - "runtime/neuro-kurisu/src/organism/cognition/IntrinsicMotivationEngine.ts"
      - "runtime/neuro-kurisu/tests/workpass287-unified-cycle-contract.mjs"
      - "runtime/neuro-kurisu/tests/workpass288-intrinsic-motivation-contract.mjs"
      - "runtime/neuro-kurisu/src/organism/cognition/B272EndogenousGoalGenesis.ts"
      - "runtime/neuro-kurisu/tests/big-pass-272-endogenous-goal-genesis.mjs"
      - "runtime/neuro-kurisu/package.json"
      - ".github/workflows/workpass287-288-cognitive-contracts.yml"
      - 'runtime/neuro-kurisu/package-lock.json'
      - 'runtime/neuro-kurisu/tsconfig.clean.json'
      - 'runtime/neuro-kurisu/src/node-shims.d.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismCore.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts'
      - 'runtime/neuro-kurisu/src/organism/persistence/StateMigrations.ts'
      - 'runtime/neuro-kurisu/src/organism/system/RealityEvidenceLedger.ts'
      - 'runtime/neuro-kurisu/tests/nk1-cognitive-unified-ownership-regression.mjs'
      - 'runtime/neuro-kurisu/tests/workpass287-cognitive-architecture-contract.mjs'
      - 'runtime/neuro-kurisu/tests/workpass319-cycle-order.mjs'
      - '.nvmrc'

permissions:
  contents: read

concurrency:
  group: nk1-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  cognitive-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check unified cognitive-cycle contract
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/workpass287-unified-cycle-contract.mjs
      - name: Check intrinsic motivation contract
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/workpass288-intrinsic-motivation-contract.mjs
      - name: Check motivation-to-goal integration
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/big-pass-272-endogenous-goal-genesis.mjs
      - name: Check canonical evidence ownership, migration and restart recovery
        working-directory: runtime/neuro-kurisu
        run: npm run test:nk1:cognitive-unified-ownership
      - name: Check cognitive cycle ordering and canonical evidence persistence
        working-directory: runtime/neuro-kurisu
        run: node tests/workpass319-cycle-order.mjs
      - name: Check architecture contract independent of working directory
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/workpass287-cognitive-architecture-contract.mjs
      - name: Check unified cognitive substrate restore and tick integrity
        working-directory: runtime/neuro-kurisu
        run: npm run test:aspect01:unified-substrate-integrity
      - name: Check canonical memory lifecycle restore and tick integrity
        working-directory: runtime/neuro-kurisu
        run: npm run test:aspect01:canonical-memory-lifecycle-integrity
