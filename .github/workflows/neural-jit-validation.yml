name: NeuroCore Neural JIT validation

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/learning/NeuralJitEngine.ts"
      - "runtime/neuro-kurisu/src/organism/learning/NeuralJitLocalCaptureAdapter.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/language/LanguageOrgan.ts"
      - "runtime/neuro-kurisu/src/organism/system/OutcomeVerificationService.ts"
      - "runtime/neuro-kurisu/src/server/server.mjs"
      - "runtime/neuro-kurisu/src/node-shims.d.ts"
      - "runtime/neuro-kurisu/tests/neural-jit-*.mjs"
      - "runtime/neuro-kurisu/tests/server-language-http-fake-provider.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/neural-jit-validation.yml"
      - ".nvmrc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk1-neural-jit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  neural-jit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            runtime/neuro-kurisu/package-lock.json
      - name: Install pinned TypeScript compiler from app lockfile
        run: npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Runtime semantic and syntax typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: Neural JIT compiler, evidence and persistence regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/neural-jit-engine.mjs
      - name: Neural JIT OrganismRuntime wiring
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/neural-jit-runtime-wiring.mjs
      - name: Neural JIT verified ActionGateway runtime bridge
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/neural-jit-runtime-bridge.mjs
      - name: Real local-language HTTP boundary with fake llama.cpp provider
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/server-language-http-fake-provider.mjs
