name: NK1 avatar cognitive-affect motor coupling
on:
  push:
    branches: [workpass70-source]
  pull_request:
    branches: [workpass70-source]
    paths:
      - app/src/components/AvatarStage.tsx
      - app/src/components/avatar/motorIntent.ts
      - app/scripts/avatar-motor-intent.test.mjs
      - .github/workflows/nk1-avatar-cognitive-affect-coupling.yml
permissions:
  contents: read
concurrency:
  group: nk1-avatar-cognitive-affect-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  avatar-cognitive-affect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked app dependencies
        working-directory: app
        run: npm ci
      - name: Verify cognitive-to-avatar motor intent
        working-directory: app
        run: npm run test:avatar-motor-intent
      - name: Typecheck app
        working-directory: app
        run: npm run typecheck
