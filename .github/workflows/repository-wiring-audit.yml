name: Repository wiring contract audit

on:
  push:
    branches:
      - workpass70-source
      - audit/repository-wiring-contracts-2026-10-25
      - feature/memory-budget-restore-integrity-20261025
      - work/node24-project-pin-alignment-20261025
    paths:
      - ".github/workflows/repository-wiring-audit.yml"
      - ".github/workflows/**"
      - "package.json"
      - "app/package.json"
      - "runtime/neuro-kurisu/package.json"
      - "tools/verify-repository-wiring.mjs"
      - "tools/verify-repository-wiring.test.mjs"
      - ".nvmrc"
      - "tools/project-runtime-pin.mjs"
      - "tools/project-runtime-pin.test.mjs"
      - "tools/super-install.mjs"
      - "tools/super-doctor.mjs"
      - "tools/integration-supervisor.mjs"
      - "tools/integration-supervisor.test.mjs"
      - "tools/verify-integration.mjs"
  pull_request:
    branches:
      - workpass70-source
      - feature/memory-budget-restore-integrity-20261025
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "app/package.json"
      - "runtime/neuro-kurisu/package.json"
      - "tools/verify-repository-wiring.mjs"
      - "tools/verify-repository-wiring.test.mjs"
      - ".nvmrc"
      - "tools/project-runtime-pin.mjs"
      - "tools/project-runtime-pin.test.mjs"
      - "tools/super-install.mjs"
      - "tools/super-doctor.mjs"
      - "tools/integration-supervisor.mjs"
      - "tools/integration-supervisor.test.mjs"
      - "tools/verify-integration.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Select project Node.js runtime
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify project runtime pin
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version | sed 's/^v//')"
          printf 'expected=%s actual=%s\n' "$expected" "$actual"
          case "$expected" in
            *.*.*) test "$actual" = "$expected" ;;
            *) case "$actual" in "$expected"|"$expected".*) ;; *) exit 1 ;; esac ;;
          esac

      - name: Test project Node/npm runtime pin contract
        run: npm run test:runtime-pin-contract

      - name: Test integration process supervisor
        run: npm run test:integration-supervisor

      - name: Test repository wiring audit fixtures
        run: npm run test:repo-wiring

      - name: Audit workflow and executable linkages
        run: npm run audit:repo-wiring
