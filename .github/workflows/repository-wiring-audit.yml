name: Repository wiring contract audit

on:
  push:
    branches:
      - workpass70-source
      - audit/repository-wiring-contracts-2026-10-25
      - fix/wiring-audit-edge-cases-2026-10-25
    paths:
      - ".github/workflows/repository-wiring-audit.yml"
      - ".github/workflows/**"
      - "package.json"
      - "app/package.json"
      - "runtime/neuro-kurisu/package.json"
      - "tools/verify-repository-wiring.mjs"
      - "tools/verify-repository-wiring.test.mjs"
      - "runtime/neuro-kurisu/src/organism/core/CognitiveDependencyGraph.ts"
      - "runtime/neuro-kurisu/tests/cognitive-dependency-graph-workpass320.mjs"
      - "runtime/neuro-kurisu/tests/cognitive-dependency-interrupt-episode-workpass324.mjs"
  pull_request:
    branches:
      - workpass70-source
      - audit/repository-wiring-contracts-2026-10-25
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "app/package.json"
      - "runtime/neuro-kurisu/package.json"
      - "tools/verify-repository-wiring.mjs"
      - "tools/verify-repository-wiring.test.mjs"
      - "runtime/neuro-kurisu/src/organism/core/CognitiveDependencyGraph.ts"
      - "runtime/neuro-kurisu/tests/cognitive-dependency-graph-workpass320.mjs"
      - "runtime/neuro-kurisu/tests/cognitive-dependency-interrupt-episode-workpass324.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Select project Node.js runtime
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify project runtime pin
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version | sed 's/^v//')"
          printf 'expected=%s actual=%s\n' "$expected" "$actual"
          case "$expected" in
            *.*.*) test "$actual" = "$expected" ;;
            *) case "$actual" in "$expected"|"$expected".*) ;; *) exit 1 ;; esac ;;
          esac

      - name: Test repository wiring audit fixtures
        run: npm run test:repo-wiring

      - name: Audit workflow and executable linkages
        run: npm run audit:repo-wiring

      - name: Test cognitive dependency graph restore and frame integrity
        run: npm --prefix runtime/neuro-kurisu run test:p320:cognitive-dependency-restore

      - name: Test cognitive interrupt episode linkage
        run: npm --prefix runtime/neuro-kurisu run test:p324:interrupt-episodes
