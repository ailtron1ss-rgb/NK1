permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Select project Node.js runtime
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify project runtime pin
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version | sed 's/^v//')"
          printf 'expected=%s actual=%s\n' "$expected" "$actual"
          case "$expected" in
            *.*.*) test "$actual" = "$expected" ;;
            *) case "$actual" in "$expected"|"$expected".*) ;; *) exit 1 ;; esac ;;
          esac

      - name: Test repository wiring audit fixtures
        run: npm run test:repo-wiring

      - name: Audit workflow and executable linkages
        run: npm run audit:repo-wiring

      - name: Test cognitive dependency graph restore and frame integrity
        run: npm --prefix runtime/neuro-kurisu run test:p320:cognitive-dependency-restore

      - name: Test cognitive interrupt episode linkage
        run: npm --prefix runtime/neuro-kurisu run test:p324:interrupt-episodes

      - name: Test B272 endogenous goal and outcome attribution
        run: npm --prefix runtime/neuro-kurisu run test:workpass292:motivation-to-goal

      - name: Test B273 autonomous goal lifecycle attribution
        run: npm --prefix runtime/neuro-kurisu run test:big-pass-273

      - name: Test B273 persisted-state migration
        run: npm --prefix runtime/neuro-kurisu run test:big-pass-273:migration

      - name: Test B273 Core integration
        run: npm --prefix runtime/neuro-kurisu run test:big-pass-273:core

      - name: Test B274 skill candidate attribution
        run: npm --prefix runtime/neuro-kurisu run test:big-pass-274

      - name: Test B274 independent skill evaluation
        run: npm --prefix runtime/neuro-kurisu run test:big-pass-274:evaluator

      - name: Test B274 persisted-state migration
        run: npm --prefix runtime/neuro-kurisu run test:big-pass-274:migration

      - name: Test B274 Core integration
        run: npm --prefix runtime/neuro-kurisu run test:big-pass-274:core

      - name: Verify B272 credit attribution in both feedback paths
        run: npm --prefix runtime/neuro-kurisu run test:cognitive-feedback-attribution-wiring

      - name: Test live runtime graph persistence and restart continuity
        run: npm --prefix runtime/neuro-kurisu run test:cognitive-dependency-runtime-wiring

      - name: Test interrupt-aware cognitive routing budget
        run: npm --prefix runtime/neuro-kurisu run test:cognitive-routing-policy

      - name: Verify routing policy remains connected to the live runtime
        run: npm --prefix runtime/neuro-kurisu run test:cognitive-routing-policy-runtime-wiring
      - name: Verify Hexis evidence lineage, HMX integrity, and live API wiring
        run: npm --prefix runtime/neuro-kurisu run test:hexis-adaptation && npm --prefix runtime/neuro-kurisu run test:hexis-memory-evidence-lineage && npm --prefix runtime/neuro-kurisu run test:hexis-p65-persistence && npm --prefix runtime/neuro-kurisu run test:omega:hexis-memory-provenance && npm --prefix runtime/neuro-kurisu run test:omega:hexis-source-monitor && npm --prefix runtime/neuro-kurisu run test:omega:hexis-review-inbox && npm --prefix runtime/neuro-kurisu run test:hexis-server-smoke
