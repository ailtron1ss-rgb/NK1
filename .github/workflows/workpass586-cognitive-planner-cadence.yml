name: NK1 cognitive planner cadence weighting

on:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/core/CognitiveExecutionPlanner.ts"
      - "runtime/neuro-kurisu/src/organism/core/ObservationPlanningStage.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/world/PlanEngine.ts"
      - "runtime/neuro-kurisu/tests/cognitive-execution-planner-cadence-workpass586.mjs"
      - "runtime/neuro-kurisu/tests/cognitive-execution-planner-budget-workpass587.mjs"
      - "runtime/neuro-kurisu/tests/cognitive-execution-planner-stage-workpass591.mjs"
      - "runtime/neuro-kurisu/tests/cognitive-camera-perception-budget-workpass595.mjs"
      - "runtime/neuro-kurisu/tests/cognitive-runtime-planner-execution-gate-workpass603.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - "CHANGELOG.md"
      - ".github/workflows/workpass586-cognitive-planner-cadence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-planner-cadence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and cadence-weight regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        working-directory: runtime/neuro-kurisu
        run: npm ci
      - name: Typecheck runtime
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
      - name: Run cadence-weighting regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:cognitive-execution-planner-cadence
      - name: Run aggregate budget regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:cognitive-execution-planner-budget
      - name: Run observation-stage integration regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:cognitive-execution-planner-stage
      - name: Run perception-specific camera budget regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:cognitive-camera-perception-budget
      - name: Run runtime execution-plan gate regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:cognitive-runtime-planner-execution-gate
