name: Letta Memory Bridge

on:
  pull_request:
    branches:
      - workpass70-source
    paths:
      - "runtime/neuro-kurisu/src/organism/integration/letta/**"
      - "runtime/neuro-kurisu/src/organism/core/MemorySubsystemRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/core/PersistenceProjectionCoordinator.ts"
      - "runtime/neuro-kurisu/src/organism/memory/MemoryFabric.ts"
      - "runtime/neuro-kurisu/tests/integration/letta-memory-bridge.mjs"
      - "runtime/neuro-kurisu/tests/integration/letta-memory-lifecycle-sync.mjs"
      - "runtime/neuro-kurisu/tests/integration/letta-cognitive-recall-wiring.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - ".github/workflows/letta-memory-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: letta-memory-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adapter-contracts:
    name: Letta adapter and lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts
        working-directory: runtime/neuro-kurisu
      - name: Letta memory bridge contract
        run: npm run test:letta-memory-bridge
        working-directory: runtime/neuro-kurisu
      - name: Letta canonical lifecycle, outbox recovery, and hybrid recall
        run: npm run test:letta-memory-lifecycle-sync
        working-directory: runtime/neuro-kurisu
      - name: Letta live cognitive recall wiring contract
        run: npm run test:letta-cognitive-recall-wiring
        working-directory: runtime/neuro-kurisu
      - name: Existing Letta governance contract
        run: node --experimental-strip-types tests/integration/letta-governance-adaptation.mjs
        working-directory: runtime/neuro-kurisu
