name: NK1 longitudinal memory holdout pairing

on:
  pull_request:
    paths:
      - 'runtime/neuro-kurisu/src/organism/memory/ExperienceContinuumFabric.ts'
      - 'runtime/neuro-kurisu/tests/workpass78-longitudinal-holdout-phase-pairing.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/memory-longitudinal-holdout-pairing.yml'
  push:
    branches:
      - workpass70-source
    paths:
      - 'runtime/neuro-kurisu/src/organism/memory/ExperienceContinuumFabric.ts'
      - 'runtime/neuro-kurisu/tests/workpass78-longitudinal-holdout-phase-pairing.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/memory-longitudinal-holdout-pairing.yml'

permissions:
  contents: read

jobs:
  holdout-pairing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          package-manager-cache: false
      - name: Validate phase-isolated replay holdout evidence
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass78:longitudinal-holdout-phase-pairing
