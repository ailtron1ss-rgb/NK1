name: NK1 cognitive network bus input integrity
on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/cognition/CognitiveNetworkBus.ts"
      - "runtime/neuro-kurisu/tests/cognitive-network-bus-boundary.mjs"
      - ".github/workflows/nk1-cognitive-network-bus-input-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nk1-cognitive-network-bus-input-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Hostile plugin and restore numeric boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - name: Validate cognitive bus hostile input normalization
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/cognitive-network-bus-boundary.mjs
