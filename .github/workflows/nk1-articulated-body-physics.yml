name: NK1 articulated body particle physics

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "app/src/components/AvatarStage.tsx"
      - "app/scripts/vrm-normalized-humanoid.integration.test.mjs"
      - "app/scripts/avatar-3d-glb-motion-integration.test.mjs"
      - "app/scripts/glb-body-channel-adapter.test.mjs"
      - "app/src/components/avatar/glbBodyChannelAdapter.ts"
      - "app/src/components/avatar/vrmRuntimeAdapter.ts"
      - "app/src/components/Avatar3DStage.tsx"
      - "app/src/components/avatar/articulatedBodyParticles.ts"
      - "app/scripts/articulated-body-particles.test.mjs"
      - ".github/workflows/nk1-articulated-body-physics.yml"
  push:
    branches: [workpass70-source, aspect/embodied-behavior-integration-20261127]
    paths:
      - "app/src/components/AvatarStage.tsx"
      - "app/src/components/avatar/articulatedBodyParticles.ts"
      - "app/scripts/articulated-body-particles.test.mjs"
      - ".github/workflows/nk1-articulated-body-physics.yml"

permissions:
  contents: read

concurrency:
  group: nk1-articulated-body-physics
  cancel-in-progress: true

jobs:
  articulated-body:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned app dependencies
        run: npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: Articulated particle body physics and stability contracts
        run: node --experimental-strip-types --test app/scripts/articulated-body-particles.test.mjs app/scripts/glb-body-channel-adapter.test.mjs app/scripts/avatar-3d-glb-motion-integration.test.mjs app/scripts/vrm-normalized-humanoid.integration.test.mjs
      - name: TypeScript validation
        run: npm --prefix app run typecheck
      - name: Development bundle
        run: npm --prefix app run build:dev
