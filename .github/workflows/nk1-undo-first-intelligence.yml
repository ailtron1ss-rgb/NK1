name: NK1 Undo-First Intelligence

on:
  push:
    branches: [aspect/undo-first-intelligence-20261117]
    paths:
      - "runtime/neuro-kurisu/src/organism/system/ActionGateway.ts"
      - "runtime/neuro-kurisu/tests/undo-first-action-gateway.mjs"
      - ".github/workflows/nk1-undo-first-intelligence.yml"
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/system/ActionGateway.ts"
      - "runtime/neuro-kurisu/tests/undo-first-action-gateway.mjs"
      - ".github/workflows/nk1-undo-first-intelligence.yml"

permissions:
  contents: read

concurrency:
  group: nk1-undo-first-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  undo-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify Node runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - name: Install locked runtime dependencies without lifecycle scripts
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: Undo-First preparation, crash boundary and compensation regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/undo-first-action-gateway.mjs
      - name: Preserve existing action crash and receipt reconciliation regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/big-pass-380-action-crash-reconciliation.mjs
      - name: Preserve existing durable archive and replay regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/action-ledger-archive-workpass38.mjs
