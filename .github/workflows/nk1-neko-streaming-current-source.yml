name: NK1 current-source N.E.K.O. streaming audio contracts

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/integration/neko/NekoAudioStreamContract.ts"
      - "runtime/neuro-kurisu/src/organism/integration/neko/NekoAudioFrameBuffer.ts"
      - "runtime/neuro-kurisu/src/organism/integration/neko/NekoVoiceTurnCoordinator.ts"
      - "runtime/neuro-kurisu/src/organism/integration/neko/NekoAsrTranscriptAdapter.ts"
      - "runtime/neuro-kurisu/src/organism/body/EmbodimentRuntime.ts"
      - "runtime/neuro-kurisu/tests/neko-audio-*.mjs"
      - "runtime/neuro-kurisu/tests/neko-asr-stream-admission.mjs"
      - "runtime/neuro-kurisu/tests/neko-voice-turn-coordinator.mjs"
      - "runtime/neuro-kurisu/tests/neko-voice-embodiment-streaming-wiring.mjs"
      - "runtime/neuro-kurisu/package.json"
      - ".github/workflows/nk1-neko-streaming-current-source.yml"
  push:
    branches: [consolidation/neko-streaming-current-source-implementation-20261119-v2]
    paths:
      - "runtime/neuro-kurisu/src/organism/integration/neko/NekoAudioStreamContract.ts"
      - "runtime/neuro-kurisu/src/organism/integration/neko/NekoAudioFrameBuffer.ts"
      - "runtime/neuro-kurisu/src/organism/integration/neko/NekoVoiceTurnCoordinator.ts"
      - "runtime/neuro-kurisu/src/organism/integration/neko/NekoAsrTranscriptAdapter.ts"
      - "runtime/neuro-kurisu/src/organism/body/EmbodimentRuntime.ts"
      - "runtime/neuro-kurisu/tests/neko-audio-*.mjs"
      - "runtime/neuro-kurisu/tests/neko-asr-stream-admission.mjs"
      - "runtime/neuro-kurisu/tests/neko-voice-turn-coordinator.mjs"
      - "runtime/neuro-kurisu/tests/neko-voice-embodiment-streaming-wiring.mjs"
      - "runtime/neuro-kurisu/package.json"
      - ".github/workflows/nk1-neko-streaming-current-source.yml"

permissions:
  contents: read

concurrency:
  group: nk1-neko-streaming-current-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  streaming-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        working-directory: runtime/neuro-kurisu
        run: npm ci
      - name: PCM16 frame contract
        working-directory: runtime/neuro-kurisu
        run: npm run test:neko-audio-stream-contract
      - name: Bounded queue and semantic ring buffer
        working-directory: runtime/neuro-kurisu
        run: npm run test:neko-audio-frame-buffer
      - name: Streaming ASR admission
        working-directory: runtime/neuro-kurisu
        run: npm run test:neko-asr-stream-admission
      - name: Voice turn coordinator
        working-directory: runtime/neuro-kurisu
        run: npm run test:neko-voice-turn-coordinator
      - name: Embodiment streaming consent and cancellation
        working-directory: runtime/neuro-kurisu
        run: npm run test:neko-voice-embodiment-streaming-wiring
      - name: Current ASR transcript boundary
        working-directory: runtime/neuro-kurisu
        run: npm run test:neko-asr-transcript-adapter
      - name: Current VAD speech admission
        working-directory: runtime/neuro-kurisu
        run: npm run test:neko-speech-admission-gate
      - name: Current Smart Turn semantic endpoint
        working-directory: runtime/neuro-kurisu
        run: npm run test:neko-smart-turn-semantic-endpoint
      - name: Current voice evidence and cognitive context
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/neko-asr-voice-input-evidence.mjs && npm run test:embodiment-voice-cognitive-context
      - name: Runtime typecheck
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
