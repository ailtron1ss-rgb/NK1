name: NK1 embodied telemetry proof boundary

on:
  push:
    branches:
      - aspect/embodied-action-proof-provenance-20261110
    paths:
      - runtime/neuro-kurisu/src/organism/body/EmbodiedActionExecutor.ts
      - runtime/neuro-kurisu/src/organism/system/ExternalPostconditionVerifier.ts
      - runtime/neuro-kurisu/src/organism/system/RealityGroundingController.ts
      - runtime/neuro-kurisu/tests/p2841-telemetry-proof-boundary.mjs
      - runtime/neuro-kurisu/tests/p2841-postcondition-grounded-world.mjs
      - .github/workflows/nk1-embodied-telemetry-proof-boundary.yml
  pull_request:
    branches:
      - workpass70-source
    paths:
      - runtime/neuro-kurisu/src/organism/body/EmbodiedActionExecutor.ts
      - runtime/neuro-kurisu/src/organism/system/ExternalPostconditionVerifier.ts
      - runtime/neuro-kurisu/src/organism/system/RealityGroundingController.ts
      - runtime/neuro-kurisu/tests/p2841-telemetry-proof-boundary.mjs
      - runtime/neuro-kurisu/tests/p2841-postcondition-grounded-world.mjs
      - .github/workflows/nk1-embodied-telemetry-proof-boundary.yml

permissions:
  contents: read

concurrency:
  group: nk1-embodied-telemetry-proof-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  telemetry-proof-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify Node runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - name: Install locked runtime dependencies without lifecycle scripts
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: Verify telemetry and camera artifacts cannot authorize world learning
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/p2841-telemetry-proof-boundary.mjs
      - name: Preserve complete postcondition provenance regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/p2841-postcondition-grounded-world.mjs
