name: NK1 semantic embedding vector integrity

on:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/tests/memory-semantic-embeddings-workpass33.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - "CHANGELOG.md"
      - ".github/workflows/workpass589-semantic-vector-fail-closed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-vector-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and semantic vector fallback regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        working-directory: runtime/neuro-kurisu
        run: npm ci
      - name: Typecheck runtime
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
      - name: Run semantic vector integrity regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:memory-semantic-embeddings-workpass33
