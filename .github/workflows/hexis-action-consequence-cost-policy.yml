name: NK1 Hexis-derived action consequence gate

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/core/ActionConsequenceCostPolicy.ts"
      - "runtime/neuro-kurisu/src/organism/system/AutonomousResourceToolLifeController.ts"
      - "runtime/neuro-kurisu/tests/hexis-action-consequence-cost-policy.mjs"
      - ".github/workflows/hexis-action-consequence-cost-policy.yml"
  push:
    branches:
      - "aspect/hexis-consequence-cost-policy-20261113"
    paths:
      - "runtime/neuro-kurisu/src/organism/core/ActionConsequenceCostPolicy.ts"
      - "runtime/neuro-kurisu/src/organism/system/AutonomousResourceToolLifeController.ts"
      - "runtime/neuro-kurisu/tests/hexis-action-consequence-cost-policy.mjs"
      - ".github/workflows/hexis-action-consequence-cost-policy.yml"

permissions:
  contents: read

concurrency:
  group: nk1-hexis-consequence-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  consequence-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify Node runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - name: Run consequence policy and autonomous-selection regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/hexis-action-consequence-cost-policy.mjs
      - name: Preserve existing action-cost unification regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/action-cost-unification-workpass36.mjs
