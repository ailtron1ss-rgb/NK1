name: Unified cognitive substrate runtime wiring

on:
  push:
    branches:
      - fix/unified-substrate-runtime-wiring-rebased-2026-10-25
    paths:
      - '.nvmrc'
      - 'package.json'
      - 'tools/node-runtime-contract.mjs'
      - 'tools/super-install.mjs'
      - 'tools/super-install.test.mjs'
      - 'runtime/neuro-kurisu/src/organism/core/UnifiedCognitiveSubstrate.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismCore.ts'
      - 'runtime/neuro-kurisu/src/organism/core/FeedbackDeliveryGuard.ts'
      - 'runtime/neuro-kurisu/src/organism/persistence/StateMigrations.ts'
      - 'runtime/neuro-kurisu/src/organism/cognition/B273AutonomousGoalLifecycle.ts'
      - 'runtime/neuro-kurisu/src/organism/cognition/B274AutonomousSkillLaboratory.ts'
      - 'runtime/neuro-kurisu/tests/big-pass-273-autonomous-goal-lifecycle.mjs'
      - 'runtime/neuro-kurisu/tests/big-pass-274-autonomous-skill-laboratory.mjs'
      - 'runtime/neuro-kurisu/tests/big-pass-274-core-autonomous-skill.mjs'
      - 'runtime/neuro-kurisu/tests/big-pass-274-independent-skill-evaluation.mjs'
      - 'runtime/neuro-kurisu/tests/cognitive-feedback-attribution-wiring.mjs'
      - 'runtime/neuro-kurisu/src/organism/system/CognitiveResourceEconomy.ts'
      - 'runtime/neuro-kurisu/tests/cognitive-resource-economy-workpass322.mjs'
      - 'runtime/neuro-kurisu/tests/big-pass-338-endogenous-goal-plasticity-core.mjs'
      - 'runtime/neuro-kurisu/tests/unified-substrate-runtime-wiring.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/unified-substrate-runtime-wiring.yml'
  pull_request:
    paths:
      - '.nvmrc'
      - 'package.json'
      - 'tools/node-runtime-contract.mjs'
      - 'tools/super-install.mjs'
      - 'tools/super-install.test.mjs'
      - 'runtime/neuro-kurisu/src/organism/core/UnifiedCognitiveSubstrate.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismCore.ts'
      - 'runtime/neuro-kurisu/src/organism/core/FeedbackDeliveryGuard.ts'
      - 'runtime/neuro-kurisu/src/organism/persistence/StateMigrations.ts'
      - 'runtime/neuro-kurisu/src/organism/cognition/B273AutonomousGoalLifecycle.ts'
      - 'runtime/neuro-kurisu/src/organism/cognition/B274AutonomousSkillLaboratory.ts'
      - 'runtime/neuro-kurisu/tests/big-pass-273-autonomous-goal-lifecycle.mjs'
      - 'runtime/neuro-kurisu/tests/big-pass-274-autonomous-skill-laboratory.mjs'
      - 'runtime/neuro-kurisu/tests/big-pass-274-core-autonomous-skill.mjs'
      - 'runtime/neuro-kurisu/tests/big-pass-274-independent-skill-evaluation.mjs'
      - 'runtime/neuro-kurisu/tests/cognitive-feedback-attribution-wiring.mjs'
      - 'runtime/neuro-kurisu/src/organism/system/CognitiveResourceEconomy.ts'
      - 'runtime/neuro-kurisu/tests/cognitive-resource-economy-workpass322.mjs'
      - 'runtime/neuro-kurisu/tests/big-pass-338-endogenous-goal-plasticity-core.mjs'
      - 'runtime/neuro-kurisu/tests/unified-substrate-runtime-wiring.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/unified-substrate-runtime-wiring.yml'

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify installer follows the pinned Node runtime
        run: npm run test:super-install
      - name: Restore and runtime-wiring regression
        run: npm run test:unified-substrate-runtime-wiring --prefix runtime/neuro-kurisu
      - name: Validate conservative live cognitive resource allocation
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/cognitive-resource-economy-workpass322.mjs
      - name: Verify exactly-once cognitive feedback delivery
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/cognitive-feedback-attribution-wiring.mjs
      - name: Run B273 generated-action attribution regression
        run: npm --prefix runtime/neuro-kurisu run test:big-pass-273
      - name: Run B274 selected-action skill attribution regression
        run: npm --prefix runtime/neuro-kurisu run test:big-pass-274
      - name: Run B274 live Core attribution and restart regression
        run: npm --prefix runtime/neuro-kurisu run test:big-pass-274:core
      - name: Run B272 goal-credit attribution and embodied outcome regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/big-pass-338-endogenous-goal-plasticity-core.mjs
      - name: Existing unified-cycle contract
        run: npm run test:workpass287:cognitive-cycle --prefix runtime/neuro-kurisu
      - name: Existing cognitive-boundary runtime wiring
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/cognitive-cycle-boundary-runtime-wiring.mjs
      - name: Operational runtime and substrate restart smoke
        run: npm run test:smoke --prefix runtime/neuro-kurisu
