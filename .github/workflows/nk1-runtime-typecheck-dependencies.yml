name: NK1 Runtime Typecheck and Cognitive Integration

on:
  push:
    branches:
      - fix/runtime-typecheck-dependency-contracts-2026-10-25
  pull_request:
    branches:
      - nk1-ready-unified-cycle-restore-integrity-20261025
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk1-runtime-typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source stack
        uses: actions/checkout@v7

      - name: Set up pinned project Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            runtime/neuro-kurisu/package-lock.json

      - name: Install canonical app and runtime dependencies from lockfiles
        id: install
        run: |
          npm ci --prefix app
          npm ci --prefix runtime/neuro-kurisu

      - name: App TypeScript check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run typecheck --prefix app

      - name: Build frontend production bundle
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build --prefix app

      - name: Semantic runtime TypeScript check
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck

      - name: Verify compiler and typecheck dependency selection
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: npm run test:typecheck-runtime-compiler-selection

      - name: Unified cognitive-cycle contract
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass287:cognitive-cycle

      - name: Intrinsic motivation contract
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass288:intrinsic-motivation

      - name: Motivation-to-goal integration
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass292:motivation-to-goal

      - name: Runtime cognitive-cycle wiring
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: npm run test:cognitive-cycle-boundary-runtime-wiring

      - name: Continual-learning replay regressions
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: npm run test:learning-replay

      - name: P26 malformed-input and snapshot integrity
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: npm run test:p26:learning-input-integrity

      - name: P26 signed holdout verifier and signature-bound replay
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: npm run test:p26:signed-holdout-verifier

      - name: P26 recovery and task-order robustness
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: |
          npm run test:p26:learning-recovery-benchmark
          npm run test:p26:learning-continual-matrix

      - name: Causal replay runtime wiring
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: npm run test:causal-replay-runtime-wiring

      - name: Gateway and action lifecycle contracts
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: |
          npm run test:workpass95:receipt-integrity
          npm run test:workpass96:finalizer-boundary
          npm run test:workpass97:planner-route
          npm run test:workpass98:project-reconciliation-route
          npm run test:workpass318:operational-microcycle-finite-input

      - name: Organism runtime smoke
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: npm run test:smoke

      - name: HTTP server and security smoke
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: |
          npm run test:server-smoke
          npm run test:server-security-smoke

      - name: State persistence and restart smoke
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: runtime/neuro-kurisu
        run: npm run test:restart

      - name: Validate Compose configuration
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: docker compose config --quiet

      - name: Build and boot the containerized cognitive runtime
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          docker compose up --build -d --wait --wait-timeout 240
          node --input-type=module <<'NODE'
          const response = await fetch('http://127.0.0.1:8080/healthz');
          const gatewayHealth = await response.text();
          if (!response.ok || gatewayHealth.trim() !== 'ok') {
            throw new Error('reverse-proxy-healthcheck-failed');
          }
          const page = await fetch('http://127.0.0.1:8080/');
          const html = await page.text();
          if (!page.ok || !html.includes('Kurisu') || !html.includes('Neuro organism')) {
            throw new Error('react-organism-ui-not-served');
          }
          const runtimeResponse = await fetch('http://127.0.0.1:8080/api/health');
          const runtimeHealth = await runtimeResponse.json();
          if (!runtimeResponse.ok || runtimeHealth.ready !== true) {
            throw new Error('canonical-runtime-not-ready-through-same-origin-api: ' + JSON.stringify(runtimeHealth));
          }
          const architectureResponse = await fetch('http://127.0.0.1:8080/api/organism/cognitive-architecture');
          const architecture = await architectureResponse.json();
          if (!architectureResponse.ok || architecture.ok !== true || architecture.architecture?.validation?.ok !== true) {
            throw new Error('react-ui-to-runtime-cognitive-architecture-contract-failed');
          }
          console.log('COMPOSE_UNIFIED_STACK_SMOKE=PASS', JSON.stringify({ gateway: page.status, runtime: runtimeHealth.ready, architecture: architecture.architecture.validation.ok }));
          NODE

      - name: Audit source assets and release safety boundaries
        if: ${{ success() }}
        run: |
          npm run audit:assets
          npm run release:verify

      - name: Package validated source commit
        if: ${{ success() }}
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          test "$SHA" = "$GITHUB_SHA"
          SHORT_SHA="${SHA:0:12}"
          ROOT="Neuro_Kurisu_WORKPASS322_CANDIDATE_${SHORT_SHA}"
          ZIP_NAME="${ROOT}.zip"
          ZIP_PATH="$RUNNER_TEMP/$ZIP_NAME"
          CHECKSUM_NAME="${ZIP_NAME}.sha256"
          REPORT_NAME="${ROOT}_REPORT.md"
          git archive --format=zip --prefix="${ROOT}/" "$SHA" > "$ZIP_PATH"
          python3 - "$ZIP_PATH" "$ROOT" <<'PY'
          import pathlib, re, stat, sys, zipfile

          zip_path, root = sys.argv[1], sys.argv[2]
          required = [
              "README.md", ".env.example", "Caddyfile", "docker-compose.yml",
              "app/Dockerfile", "app/package-lock.json",
              "runtime/neuro-kurisu/Dockerfile", "runtime/neuro-kurisu/package-lock.json",
              "runtime/neuro-kurisu/src/organism/learning/P26TrustedHoldoutEvidenceAuthority.ts",
              "runtime/neuro-kurisu/tests/p26-signed-holdout-verifier.mjs",
              "contracts/inventory/canonical-public-assets-workpass42.json",
              "docs/QUICKSTART_NEURO_KURISU_RU.md", "tools/verify-final-release.mjs",
          ]
          errors = []
          with zipfile.ZipFile(zip_path) as z:
              names = set(z.namelist())
              prefix = root + "/"
              for name in names:
                  path = pathlib.PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts or "\\" in name:
                      errors.append("unsafe archive path: " + name)
                      continue
                  if not name.startswith(prefix):
                      errors.append("missing common archive root: " + name)
                      continue
                  rel = name[len(prefix):]
                  parts = pathlib.PurePosixPath(rel).parts
                  base = pathlib.PurePosixPath(rel).name.lower()
                  if any(x in {"node_modules", ".git", "__pycache__", ".super-state", ".verify-state"} for x in parts):
                      errors.append("generated/private directory in candidate: " + rel)
                  safe_env_example = base == ".env.example" or base.endswith(".redacted.example")
                  if base == ".env" or (base.startswith(".env.") and not safe_env_example):
                  if base == "gmail-credentials.json":
                      errors.append("credential file in candidate: " + rel)
                  info = z.getinfo(name)
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      target = z.read(name).decode("utf-8", "replace")
                      if pathlib.PurePosixPath(target).is_absolute() or ".." in pathlib.PurePosixPath(target).parts:
                          errors.append("escaping symlink in candidate: " + rel)
                  if not info.is_dir() and info.file_size <= 8 * 1024 * 1024 and pathlib.PurePosixPath(rel).suffix.lower() in {
                      ".env", ".json", ".js", ".mjs", ".ts", ".tsx", ".md", ".txt", ".yml", ".yaml", ".toml", ".sh", ".conf", ".xml", ".pem", ".key", ".pub", ".example", ".sample", ".properties"
                  }:
                      data = z.read(name)
                      begin, end = b"-----BEGIN ", b"-----"
                      markers = (
                          begin + b"PRIVATE KEY" + end,
                          begin + b"RSA PRIVATE KEY" + end,
                          begin + b"EC PRIVATE KEY" + end,
                          begin + b"OPENSSH PRIVATE KEY" + end,
                      )
                      for marker in markers:
                          if marker in data:
                              errors.append("private-key material in candidate: " + rel)
                              break
              for rel in required:
                  if prefix + rel not in names:
                      errors.append("required file missing: " + rel)
          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)
          print("CANDIDATE_ZIP_SAFETY=PASS", "requiredFiles=", len(required), "members=", len(names))
          PY
          sha256sum "$ZIP_PATH" | awk -v n="$ZIP_NAME" '{print $1 "  " n}' > "$RUNNER_TEMP/$CHECKSUM_NAME"
          cat > "$RUNNER_TEMP/$REPORT_NAME" <<EOF
          # Neuro Kurisu — verified source candidate (not an official release)

          - Commit: $SHA
          - Branch: $GITHUB_REF_NAME
          - Validation run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Candidate archive: $ZIP_NAME
          - SHA-256 file: $CHECKSUM_NAME

          This archive is packaged only after the workflow's locked-dependency checks, TypeScript checks, production build, cognitive/learning/action regressions, server/security/restart smoke, Compose build/boot, same-origin React UI → runtime test, asset audit and release-safety audit pass. The archive path/secret scan also passed.

          **Not published:** this is a candidate artifact for review. It does not replace the official GitHub Release ZIP, update release metadata, or change main. The existing WorkPass70 Release asset remains unchanged.
          EOF
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$CHECKSUM_NAME" >> "$GITHUB_OUTPUT"
          echo "report_name=$REPORT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload verified source candidate artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: Neuro-Kurisu-WORKPASS322-CANDIDATE-${{ github.sha }}
          path: |
            ${{ runner.temp }}/${{ steps.candidate.outputs.zip_name }}
            ${{ runner.temp }}/${{ steps.candidate.outputs.checksum_name }}
            ${{ runner.temp }}/${{ steps.candidate.outputs.report_name }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Dump runtime container logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color neuro-kurisu neuro-kurisu-app gateway

      - name: Remove test Compose container and volume
        if: ${{ always() }}
        run: docker compose down -v
