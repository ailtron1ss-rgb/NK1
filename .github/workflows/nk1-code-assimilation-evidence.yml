name: NK1 code assimilation signed evidence

on:
  pull_request:
    paths:
      - 'runtime/neuro-kurisu/src/organism/learning/CodeAssimilationContracts.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/CodeAssimilationEvidence.ts'
      - 'runtime/neuro-kurisu/tests/code-assimilation-evidence-workpass656.mjs'
      - '.github/workflows/nk1-code-assimilation-evidence.yml'

permissions:
  contents: read

concurrency:
  group: nk1-code-assimilation-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate signed source, SBOM, build and license evidence
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/code-assimilation-evidence-workpass656.mjs
