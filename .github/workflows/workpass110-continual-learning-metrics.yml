name: WorkPass110 continual learning metrics
on:
  pull_request:
    paths:
      - 'runtime/neuro-kurisu/src/organism/learning/ContinualLearningMetrics.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/ContinualOutcomeMatrix.ts'
      - 'runtime/neuro-kurisu/tests/p23-continual-learning-metrics.mjs'
      - 'runtime/neuro-kurisu/tests/p23-continual-outcome-matrix.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/ContinualBenchmarkComparison.ts'
      - 'runtime/neuro-kurisu/tests/p23-continual-benchmark-comparison.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/LearningExperimentPlan.ts'
      - 'runtime/neuro-kurisu/tests/p23-learning-execution-audit.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/LearningExecutionAudit.ts'
      - 'runtime/neuro-kurisu/tests/p23-learning-execution-evidence.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/LearningExecutionEvidence.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/LearningProcessSupervisor.ts'
      - 'runtime/neuro-kurisu/tests/p23-learning-process-supervisor.mjs'
      - 'runtime/neuro-kurisu/tests/p23-learning-experiment-plan.mjs'
      - 'runtime/neuro-kurisu/tests/p23-learning-experiment-plan-cli.mjs'
      - 'runtime/neuro-kurisu/scripts/create-learning-experiment-plan.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeLedger.ts'
      - 'runtime/neuro-kurisu/tests/p23-seed-clustered-outcome-comparison.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/ResetRetentionEvaluation.ts'
      - 'runtime/neuro-kurisu/tests/p23-reset-retention-evaluation.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedReplayAdmission.ts'
      - 'runtime/neuro-kurisu/tests/p23-verified-replay-admission.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/MultiSourceLearningMechanisms.ts'
      - 'runtime/neuro-kurisu/tests/p23-multi-source-learning-mechanisms.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/P23LearningEngine.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/SkillRetrievalAugmentation.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/OutcomeReflectionCurriculum.ts'
      - 'runtime/neuro-kurisu/tests/p23-skill-retrieval-reflection-curriculum.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/workpass110-continual-learning-metrics.yml'
  push:
    branches: [workpass79-cognitive-rebuild, workpass116-seed-clustered-learning-eval, workpass117-verified-replay-admission, workpass118-multi-source-learning-integration, workpass119-skill-retrieval-feedback-curriculum]
    paths:
      - 'runtime/neuro-kurisu/src/organism/learning/ContinualLearningMetrics.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/ContinualOutcomeMatrix.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/ContinualBenchmarkComparison.ts'
      - 'runtime/neuro-kurisu/tests/p23-continual-learning-metrics.mjs'
      - 'runtime/neuro-kurisu/tests/p23-continual-outcome-matrix.mjs'
      - 'runtime/neuro-kurisu/tests/p23-continual-benchmark-comparison.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/LearningExperimentPlan.ts'
      - 'runtime/neuro-kurisu/tests/p23-learning-execution-audit.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/LearningExecutionAudit.ts'
      - 'runtime/neuro-kurisu/tests/p23-learning-execution-evidence.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/LearningExecutionEvidence.ts'
      - 'runtime/neuro-kurisu/tests/p23-learning-experiment-plan.mjs'
      - 'runtime/neuro-kurisu/tests/p23-learning-experiment-plan-cli.mjs'
      - 'runtime/neuro-kurisu/scripts/create-learning-experiment-plan.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeLedger.ts'
      - 'runtime/neuro-kurisu/tests/p23-seed-clustered-outcome-comparison.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/ResetRetentionEvaluation.ts'
      - 'runtime/neuro-kurisu/tests/p23-reset-retention-evaluation.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedReplayAdmission.ts'
      - 'runtime/neuro-kurisu/tests/p23-verified-replay-admission.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/MultiSourceLearningMechanisms.ts'
      - 'runtime/neuro-kurisu/tests/p23-multi-source-learning-mechanisms.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/P23LearningEngine.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/SkillRetrievalAugmentation.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/OutcomeReflectionCurriculum.ts'
      - 'runtime/neuro-kurisu/tests/p23-skill-retrieval-reflection-curriculum.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/workpass110-continual-learning-metrics.yml'
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run continual-learning metric regressions
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:continual-metrics
      - name: Run seed-clustered verified outcome comparison regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:seed-clustered-outcomes
      - name: Run evidence-gated replay admission regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-verified-replay-admission.mjs
      - name: Run multi-source learning mechanisms regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-multi-source-learning-mechanisms.mjs
      - name: Run skill retrieval, reflection and curriculum regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:skill-retrieval-reflection-curriculum
      - name: Run reset-retention evaluation regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-reset-retention-evaluation.mjs
      - name: Run reproducible learning experiment plan regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:learning-experiment-plan
      - name: Run execution coverage audit
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:learning-execution-audit
      - name: Run execution-backed outcome evidence regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:learning-execution-evidence
      - name: Run bounded learning process supervisor regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:learning-process-supervisor
      - name: Typecheck runtime
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
