concurrency:
  group: nk1-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned TypeScript compiler from app lockfile
        run: npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: Install locked runtime dependencies (including Node types)
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Run causal experience identity, replay diversity and restore regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:big-pass-90:causal-stream
      - name: Run Legacy avatar rendering lifecycle regression
        run: node --test app/scripts/legacy-sprite-deck-runtime.test.mjs
      - name: Run Live2D runtime and asset integrity regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/live2d-integrity.mjs
      - name: Run continual-learning metric regressions
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:continual-metrics
      - name: Run seed-clustered verified outcome comparison regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:seed-clustered-outcomes
      - name: Run evidence-gated replay admission regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-verified-replay-admission.mjs
      - name: Run multi-source learning mechanisms regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-multi-source-learning-mechanisms.mjs
      - name: Run skill retrieval, reflection and curriculum regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:skill-retrieval-reflection-curriculum
      - name: Run verified skill revision gate regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:verified-skill-revision-gate
      - name: Run ledger-bound verified skill promotion proposal regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:verified-skill-promotion-proposal
      - name: Run signed outcome artifact authentication regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-verified-outcome-artifact-authentication.mjs
      - name: Run signed shadow execution evidence regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:verified-skill-shadow-evidence
      - name: Run trusted shadow-run registry regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:trusted-skill-shadow-run-registry
      - name: Run verified skill lifecycle bootstrap regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:verified-skill-lifecycle-bootstrap
      - name: Run trusted shadow registration before process spawn regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:trusted-shadow-supervisor-registration
      - name: Run canonical trusted shadow run coordinator regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:trusted-shadow-run-coordinator
      - name: Run versioned skill candidate lifecycle regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-versioned-skill-candidate-store.mjs
      - name: Run runtime resolver verified skill lifecycle regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-learning-engine-verified-skill-lifecycle.mjs
      - name: Run three-level skill evaluation report regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-skill-evaluation-report.mjs
      - name: Run durable skill-store failure-boundary regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:skill-store-failure-boundaries
      - name: Run reset-retention evaluation regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-reset-retention-evaluation.mjs
      - name: Run reproducible learning experiment plan regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:learning-experiment-plan
      - name: Run execution coverage audit
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:learning-execution-audit
      - name: Run execution-backed outcome evidence regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:learning-execution-evidence
      - name: Run bounded learning process supervisor regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:learning-process-supervisor
      - name: Run production runtime trusted shadow scheduler integration
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:runtime-trusted-shadow-scheduler
      - name: Run production trusted shadow config validation
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:trusted-shadow-runtime-config
      - name: Run signed shadow observation end-to-end integration
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:runtime-signed-shadow-observation
      - name: Run authenticated verified-skill candidate staging regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:stage-verified-skill-candidate
      - name: Run candidate-bound promotion approval request regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:create-skill-promotion-approval-request
      - name: Run independent candidate execution and experiment-ledger regressions
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass203:independent-candidate-evaluator
      - name: Run independent evaluation provider wiring regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass206:independent-evaluation-provider
      - name: Require independent evaluation authorities for production revision wiring
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass224:production-independent-evaluation-required
      - name: Run matched independent baseline/candidate evaluation regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass225:matched-independent-evaluation
      - name: Run bounded independent evaluation service regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass227:bounded-independent-evaluation
      - name: Run host-owned independent evaluation subprocess integration regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass243:host-owned-independent-evaluation-services
      - name: Run P23 to Hermes signed-evidence binding regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:hermes-verified-evidence-binding
      - name: Require matched evidence envelopes before promotion
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:hermes-production-promotion-gate
      - name: Run durable signed promotion restart and replay regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass239:durable-signed-promotion-e2e
      - name: Validate P23 persisted learning restore integrity
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass310:p23-restore-integrity
      - name: Typecheck runtime
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
