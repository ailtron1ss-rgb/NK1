jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run continual-learning metric regressions
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:continual-metrics
      - name: Run seed-clustered verified outcome comparison regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:seed-clustered-outcomes
      - name: Run evidence-gated replay admission regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-verified-replay-admission.mjs
      - name: Run multi-source learning mechanisms regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-multi-source-learning-mechanisms.mjs
      - name: Run skill retrieval, reflection and curriculum regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:skill-retrieval-reflection-curriculum
      - name: Run verified skill revision gate regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:verified-skill-revision-gate
      - name: Run ledger-bound verified skill promotion proposal regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:verified-skill-promotion-proposal
      - name: Run signed outcome artifact authentication regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-verified-outcome-artifact-authentication.mjs
      - name: Run signed shadow execution evidence regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:verified-skill-shadow-evidence
      - name: Run trusted shadow-run registry regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:trusted-skill-shadow-run-registry
      - name: Run verified skill lifecycle bootstrap regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:verified-skill-lifecycle-bootstrap
      - name: Run versioned skill candidate lifecycle regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-versioned-skill-candidate-store.mjs
      - name: Run runtime resolver verified skill lifecycle regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-learning-engine-verified-skill-lifecycle.mjs
      - name: Run three-level skill evaluation report regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-skill-evaluation-report.mjs
      - name: Run durable skill-store failure-boundary regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:skill-store-failure-boundaries
      - name: Run reset-retention evaluation regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-reset-retention-evaluation.mjs
      - name: Run reproducible learning experiment plan regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:learning-experiment-plan
      - name: Run execution coverage audit
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:learning-execution-audit
      - name: Run execution-backed outcome evidence regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:learning-execution-evidence
      - name: Run bounded learning process supervisor regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:p23:learning-process-supervisor
      - name: Typecheck runtime
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
