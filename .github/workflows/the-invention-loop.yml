name: The Invention Loop focused validation

on:
  pull_request:
    paths:
      - 'runtime/neuro-kurisu/src/organism/research/**'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeArtifact.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeLedger.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/LearningTrustBoundary.ts'
      - 'runtime/neuro-kurisu/src/organism/cognition/IntrinsicExperimentGenerator.ts'
      - 'runtime/neuro-kurisu/src/organism/core/EvidenceResearchSubsystemRuntime.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismSystemFabric.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismCore.ts'
      - 'runtime/neuro-kurisu/tests/the-invention-loop.mjs'
      - 'runtime/neuro-kurisu/tests/p23-signed-outcome-artifact.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - 'runtime/neuro-kurisu/package-lock.json'
      - '.github/workflows/the-invention-loop.yml'
  push:
    branches:
      - aspect/the-invention-loop-20261117
    paths:
      - 'runtime/neuro-kurisu/src/organism/research/**'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeArtifact.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeLedger.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/LearningTrustBoundary.ts'
      - 'runtime/neuro-kurisu/src/organism/cognition/IntrinsicExperimentGenerator.ts'
      - 'runtime/neuro-kurisu/src/organism/core/EvidenceResearchSubsystemRuntime.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismSystemFabric.ts'
      - 'runtime/neuro-kurisu/tests/the-invention-loop.mjs'
      - 'runtime/neuro-kurisu/tests/p23-signed-outcome-artifact.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - 'runtime/neuro-kurisu/package-lock.json'
      - '.github/workflows/the-invention-loop.yml'

permissions:
  contents: read

concurrency:
  group: invention-loop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: runtime/neuro-kurisu
      - name: Verify signed verifier artifact boundary
        run: node --experimental-strip-types tests/p23-signed-outcome-artifact.mjs
        working-directory: runtime/neuro-kurisu
      - name: Exercise signed invention, cohort, persistence and runtime integration
        run: node --experimental-strip-types tests/the-invention-loop.mjs
        working-directory: runtime/neuro-kurisu
      - name: Type-check the integrated organism runtime
        run: npm run typecheck
        working-directory: runtime/neuro-kurisu
