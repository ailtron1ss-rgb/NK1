name: Cognitive integration suite

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/core/**"
      - "runtime/neuro-kurisu/src/organism/system/EmotionAppraisalEngine.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/P66InteroceptiveHomeostasis.ts"
      - "runtime/neuro-kurisu/tests/big-pass-172-emotion-interoceptive-mind.mjs"
      - "runtime/neuro-kurisu/tests/big-pass-190-p66-regression.mjs"
      - "runtime/neuro-kurisu/tests/affect-ui-snapshot-contract.mjs"
      - "app/src/components/AvatarStage.tsx"
      - "app/src/components/avatar/embodimentTimeline.ts"
      - "app/src/neuro-kurisu/normalize.ts"
      - "app/src/neuro-kurisu/types.ts"
      - "app/src/organism/types.ts"
      - "app/scripts/affective-embodiment.test.mjs"
      - "app/package.json"
      - "app/package-lock.json"
      - "runtime/neuro-kurisu/tests/cognitive-*.mjs"
      - "runtime/neuro-kurisu/tests/memory-budget-restore-integrity.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - "runtime/neuro-kurisu/scripts/typecheck-runtime.mjs"
      - ".github/workflows/cognitive-integration-suite.yml"
  push:
    branches:
      - "nk1-cognitive-cohesion-20261025"
      - "feature/memory-budget-restore-integrity-20261025"
      - "workpass70-source"
    paths:
      - "runtime/neuro-kurisu/src/organism/core/**"
      - "runtime/neuro-kurisu/src/organism/system/EmotionAppraisalEngine.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/P66InteroceptiveHomeostasis.ts"
      - "runtime/neuro-kurisu/tests/big-pass-172-emotion-interoceptive-mind.mjs"
      - "runtime/neuro-kurisu/tests/big-pass-190-p66-regression.mjs"
      - "runtime/neuro-kurisu/tests/affect-ui-snapshot-contract.mjs"
      - "app/src/components/AvatarStage.tsx"
      - "app/src/components/avatar/embodimentTimeline.ts"
      - "app/src/neuro-kurisu/normalize.ts"
      - "app/src/neuro-kurisu/types.ts"
      - "app/src/organism/types.ts"
      - "app/scripts/affective-embodiment.test.mjs"
      - "app/package.json"
      - "app/package-lock.json"
      - "runtime/neuro-kurisu/tests/cognitive-*.mjs"
      - "runtime/neuro-kurisu/tests/memory-budget-restore-integrity.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - "runtime/neuro-kurisu/scripts/typecheck-runtime.mjs"
      - ".github/workflows/cognitive-integration-suite.yml"

permissions:
  contents: read

jobs:
  cognitive-integration:
    name: Install and verify cognitive runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            runtime/neuro-kurisu/package-lock.json
      - name: Install locked application dependencies
        run: npm ci --prefix app --ignore-scripts
      - name: Verify affective UI wiring and application types
        run: npm --prefix app run typecheck && npm --prefix app run test:affective-embodiment
      - name: Report locked application dependency advisories
        if: always()
        shell: bash
        run: |
          npm audit --prefix app --json > "$RUNNER_TEMP/app-npm-audit.json" || true
          node --input-type=module - "$RUNNER_TEMP/app-npm-audit.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const vulnerabilities = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            isDirect: item.isDirect,
            range: item.range,
            via: (item.via ?? []).map((entry) => typeof entry === 'string'
              ? entry
              : { title: entry.title, url: entry.url, range: entry.range, cwe: entry.cwe }),
            fixAvailable: item.fixAvailable,
          }));
          console.log(JSON.stringify({ summary: report.metadata?.vulnerabilities ?? null, vulnerabilities }, null, 2));
          NODE
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu
      - name: Verify cognitive integration contracts
        run: npm --prefix runtime/neuro-kurisu run test:cognitive-integration-suite
