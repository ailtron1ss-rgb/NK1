      - ".github/workflows/cognitive-integration-suite.yml"

permissions:
  contents: read

jobs:
  cognitive-integration:
    name: Install and verify cognitive runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Set up Python 3.12 research runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU-only research dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu -r research/requirements-cpu.txt
          python -m pip check
      - name: Verify project runtime pin contract
        run: npm run test:runtime-pin-contract
      - name: Test canonical installer contract
        run: npm run test:super-install
      - name: Run environment doctor before installation
        run: npm run doctor
      - name: Validate and report weighted project progress
        run: |
          npm run test:progress-ledger
          npm run progress:report
      - name: Install both locked workspaces through the project installer
        run: npm run install:all
      - name: Test integration process supervisor
        run: npm run test:integration-supervisor
      - name: Typecheck, build and test app
        run: |
          npm --prefix app run typecheck
          npm --prefix app run build:dev
      - name: Verify supervised service contracts and fail-together shutdown
        run: |
          npm run test:supervised-service-specs
          npm run test:supervisor-exit-policy
          npm run test:supervisor-preflight
          npm run test:toolchain-contract
          npm run test:super-gateway-headers
      - name: Verify cognitive integration contracts
        run: npm --prefix runtime/neuro-kurisu run test:cognitive-integration-suite
      - name: Run governed approval gateway and bridge E2E
        run: npm --prefix runtime/neuro-kurisu run test:workpass53
      - name: Start every required service and verify the public gateway
        run: npm run test:supervisor-start-smoke
      - name: Run unified runtime and research bridge smoke
        run: npm run test:integration
