name: WorkPass79 cognitive runtime regression

on:
  push:
    branches:
      - workpass79-cognitive-rebuild
      - nk1-integration-workspace-2026-10-22
      - rebuild
  pull_request:
    branches:
      - main
      - workpass70-source
      - workpass203-independent-candidate-evaluator
      - nk1-integration-workspace-2026-10-22
      - rebuild
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk1-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  local-language-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Verify selected Node.js matches repository pin
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version | sed 's/^v//')"
          printf 'expected=%s actual=%s\n' "$expected" "$actual"
          case "$expected" in
            *.*.*) test "$actual" = "$expected" ;;
            *) case "$actual" in "$expected"|"$expected".*) ;; *) echo "Node version $actual does not match .nvmrc pin $expected" >&2; exit 1 ;; esac ;;
          esac
      - name: Audit CI Action/runtime compatibility contract
        run: npm run audit:ci-reliability
      - name: Test CI reliability audit regressions
        run: node --test tools/verify-ci-reliability.test.mjs
      - name: Install pinned TypeScript compiler from app lockfile
        run: npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: Verify signed verifier outcome artifacts and reject tampering
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-signed-outcome-artifact.mjs
      - name: Audit runtime npm script targets and local test files
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass84:script-integrity
      - name: Audit canonical cognitive subsystem ownership after runtime extraction
        working-directory: runtime/neuro-kurisu
        run: npm run audit:core-ownership
      - name: Verify autobiographical provenance, personality bridge, and live runtime wiring
        working-directory: runtime/neuro-kurisu
        run: npm run test:personality
      - name: Test cold-memory retrieval and residency invariants
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass80:memory-residency
      - name: Verify current retrieval suppresses superseded records with damaged validity metadata
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass87:superseded-memory
      - name: WorkPass88 benchmark label-truncation guard
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass88:label-truncation
      - name: Evaluate corrected memory to grounded sandbox action and restart replay
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/workpass91-memory-to-action.mjs
      - name: Test retrieval metrics, abstention, dataset hash/provenance and holdout leakage guards
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass83:retrieval-benchmark-truth
      - name: Test local backend circuit-breaker transitions
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass79:local-language-policy
      - name: Test local provider timeout, payload bounds and failure normalization
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass79:provider-boundary
      - name: Verify client disconnect cancels in-flight local inference end to end
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass82:server-cancellation
      - name: Exercise real server HTTP path with a controlled local provider
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass69:server-smoke
