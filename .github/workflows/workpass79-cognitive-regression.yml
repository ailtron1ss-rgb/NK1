name: WorkPass79 cognitive runtime regression

on:
  push:
    branches:
      - workpass79-cognitive-rebuild
  pull_request:
    branches:
      - main
      - workpass70-source
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workpass79-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-language-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test cold-memory retrieval and residency invariants
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass80:memory-residency
      - name: Test local backend circuit-breaker transitions
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass79:local-language-policy
      - name: Test local provider timeout, payload bounds and failure normalization
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass79:provider-boundary
      - name: Exercise real server HTTP path with a controlled local provider
        working-directory: runtime/neuro-kurisu
        run: npm run test:workpass69:server-smoke
