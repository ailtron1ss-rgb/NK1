name: NK1 runner startup diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/nk1-runner-startup-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm GitHub-hosted runner allocation
        run: |
          echo "RUNNER_STARTUP_DIAGNOSTIC=ok"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_name=${RUNNER_NAME}"
          test -n "${RUNNER_NAME}"
