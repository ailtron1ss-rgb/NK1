name: NK1 affect-state restore integrity
on:
  push:
    branches: [workpass70-source]
  pull_request:
    branches: [workpass70-source]
    paths:
      - runtime/neuro-kurisu/src/organism/system/EmotionAppraisalEngine.ts
      - runtime/neuro-kurisu/tests/big-pass-172-emotion-interoceptive-mind.mjs
      - .github/workflows/nk1-affect-state-restore-integrity.yml
permissions:
  contents: read
concurrency:
  group: nk1-affect-state-restore-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  affect-state-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked runtime dependencies
        working-directory: runtime/neuro-kurisu
        run: npm ci
      - name: Verify affect, interoception and persistence
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/big-pass-172-emotion-interoceptive-mind.mjs
      - name: Typecheck runtime
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
