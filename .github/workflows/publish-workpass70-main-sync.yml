name: Publish validated WorkPass70 source release

on:
  workflow_run:
    workflows: ["NeuroCore core regression validation"]
    branches: [workpass70-source]
    types: [completed]

permissions:
  contents: write
  checks: read
  actions: read

concurrency:
  group: nk1-validated-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  package-and-publish:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'workpass70-source' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact validated source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Checkout release manifest tooling from this publisher revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: |
            scripts/create_release_manifest.py
            scripts/test_create_release_manifest.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Test release manifest generator
        run: python3 -m unittest discover -s release-tools/scripts -p 'test_create_release_manifest.py' -v

      - name: Refuse stale source and existing release tag
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          LATEST_SHA="$(git ls-remote origin refs/heads/workpass70-source | cut -f1)"
          if [ -z "$LATEST_SHA" ]; then echo "Could not resolve current source branch"; exit 1; fi
          if [ "$LATEST_SHA" != "$VALIDATED_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale validation $VALIDATED_SHA; source tip is $LATEST_SHA"
            exit 0
          fi
          SHORT_SHA="$(printf '%s' "$VALIDATED_SHA" | cut -c1-12)"
          RELEASE_DATE="$(date -u +%Y-%m-%d)"
          TAG="workpass70-main-sync-$RELEASE_DATE-$SHORT_SHA"
          CHECK_FILE="$RUNNER_TEMP/release-tag-check.json"
          HTTP_CODE="$(curl --silent --show-error --output "$CHECK_FILE" --write-out '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          case "$HTTP_CODE" in
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already exists; safely skipping without overwriting it."
              exit 0
              ;;
            404)
              echo "Release tag $TAG is absent; safe to continue."
              ;;
            *)
              echo "Unable to verify release tag $TAG (HTTP $HTTP_CODE); refusing to publish."
              cat "$CHECK_FILE"
              exit 1
              ;;
          esac
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_date=$RELEASE_DATE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "validated_sha=$VALIDATED_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-source regression checks
        id: required_checks
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ steps.guard.outputs.validated_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            CHECKS_JSON="$(gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/commits/$VALIDATED_SHA/check-runs?per_page=100")"
            ALL_SUCCEEDED=true
            for REQUIRED_CHECK in targeted-and-regression source-lineage-contract; do
              CHECK_JSON="$(jq -c --arg name "$REQUIRED_CHECK" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at // .created_at) | last // {}' <<< "$CHECKS_JSON")"
              STATUS="$(jq -r '.status // "missing"' <<< "$CHECK_JSON")"
              CONCLUSION="$(jq -r '.conclusion // ""' <<< "$CHECK_JSON")"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" != "success" ]; then
                  echo "Required check $REQUIRED_CHECK completed with conclusion=$CONCLUSION for $VALIDATED_SHA"
                  exit 1
                fi
              else
                ALL_SUCCEEDED=false
              fi
            done
            if [ "$ALL_SUCCEEDED" = true ]; then
              CHECKS_SUMMARY="$(jq -c '[.check_runs[] | select(.name == "targeted-and-regression" or .name == "source-lineage-contract")] | group_by(.name) | map(max_by(.started_at // .created_at)) | map({id, name, status, conclusion, details_url, started_at, completed_at})' <<< "$CHECKS_JSON")"
              CHECKS_COUNT="$(jq 'length' <<< "$CHECKS_SUMMARY")"
              if [ "$CHECKS_COUNT" -ne 2 ]; then
                echo "Expected exactly two required check records, got $CHECKS_COUNT"
                exit 1
              fi
              printf '%s\n' "$CHECKS_SUMMARY" > "$RUNNER_TEMP/required-checks.json"
              echo "checks_json=$RUNNER_TEMP/required-checks.json" >> "$GITHUB_OUTPUT"
              echo "validated=true" >> "$GITHUB_OUTPUT"
              echo "Exact-SHA regression checks passed for $VALIDATED_SHA"
              exit 0
            fi
            echo "Waiting for targeted-and-regression and source-lineage-contract on $VALIDATED_SHA (attempt $attempt/120)"
            sleep 10
          done
          echo "Timed out waiting for required exact-SHA checks on $VALIDATED_SHA"
          exit 1

      - name: Recheck source freshness before packaging
        id: freshness
        if: steps.guard.outputs.publish == 'true' && steps.required_checks.outputs.validated == 'true'
        shell: bash
        env:
          VALIDATED_SHA: ${{ steps.guard.outputs.validated_sha }}
        run: |
          set -euo pipefail
          LATEST_SHA="$(git ls-remote origin refs/heads/workpass70-source | cut -f1)"
          if [ "$LATEST_SHA" != "$VALIDATED_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Source advanced to $LATEST_SHA; skip stale release $VALIDATED_SHA"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Node.js for release provenance audit
        if: steps.guard.outputs.publish == 'true' && steps.required_checks.outputs.validated == 'true' && steps.freshness.outputs.publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Run source provenance and release-license gates
        id: release_audit
        if: steps.guard.outputs.publish == 'true' && steps.required_checks.outputs.validated == 'true' && steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version | sed 's/^v//')"
          case "$expected" in
            *.*.*) test "$actual" = "$expected" ;;
            *) case "$actual" in "$expected" | "$expected".*) ;; *) echo "Node version $actual does not match .nvmrc pin $expected" >&2; exit 1 ;; esac ;;
          esac
          npm run test:provenance-current
          npm run audit:release-license-readiness
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Package exact source, build fresh report and verify ZIP
        id: package_artifacts
        if: steps.guard.outputs.publish == 'true' && steps.required_checks.outputs.validated == 'true' && steps.freshness.outputs.publish == 'true' && steps.release_audit.outputs.ready == 'true'
        shell: bash
        env:
          TAG: ${{ steps.guard.outputs.tag }}
          RELEASE_DATE: ${{ steps.guard.outputs.release_date }}
          SHORT_SHA: ${{ steps.guard.outputs.short_sha }}
          VALIDATED_SHA: ${{ steps.guard.outputs.validated_sha }}
          REQUIRED_CHECKS_JSON: ${{ steps.required_checks.outputs.checks_json }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
          VALIDATION_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          VALIDATION_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          VALIDATION_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          VALIDATION_EVENT: ${{ github.event.workflow_run.event }}
          VALIDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          VALIDATION_RUN_URL: ${{ github.event.workflow_run.html_url }}
          VALIDATION_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          ZIP="Neuro_Kurisu_WORKPASS70_MAIN_SYNC_${RELEASE_DATE}_${SHORT_SHA}.zip"
          REPORT="WORKPASS70_MAIN_SYNC_${RELEASE_DATE}_${SHORT_SHA}_REPORT_RU.md"
          MANIFEST="NK1_RELEASE_MANIFEST_${RELEASE_DATE}_${SHORT_SHA}.json"
          git archive --format=zip --prefix="Neuro_Kurisu_WORKPASS70_MAIN_SYNC_${RELEASE_DATE}_${SHORT_SHA}/" "$VALIDATED_SHA" > "$RUNNER_TEMP/$ZIP"
          WORKPASS="$(node -e 'const fs=require("node:fs"); const b=JSON.parse(fs.readFileSync("SUPER_VERSION.json","utf8")).build; const m=String(b??"").match(/WORKPASS(\d+)/i); if(!m) process.exit(2); console.log(m[1]);')"
          PROVENANCE="contracts/SOURCE_PROVENANCE_LICENSES_WORKPASS${WORKPASS}.json"
          test -s contracts/SBOM.final.json
          test -s "$PROVENANCE"
          python - "$RUNNER_TEMP/$ZIP" "$PWD/contracts/SBOM.final.json" "$PWD/$PROVENANCE" "Neuro_Kurisu_WORKPASS70_MAIN_SYNC_${RELEASE_DATE}_${SHORT_SHA}" <<'PY'
          import pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          inputs = [pathlib.Path(sys.argv[2]), pathlib.Path(sys.argv[3])]
          prefix = sys.argv[4]
          replacement = {f"{prefix}/contracts/{source.name}": source.read_bytes() for source in inputs}
          if any(not value for value in replacement.values()):
              raise SystemExit("Generated SBOM/provenance overlay must not be empty")
          temp = archive.with_name(archive.name + ".overlay.zip")
          with zipfile.ZipFile(archive, "r") as original:
              original_names = original.namelist()
              for name in replacement:
                  if original_names.count(name) > 1:
                      raise SystemExit(f"Duplicate pre-existing archive member: {name}")
              with zipfile.ZipFile(temp, "w", compression=zipfile.ZIP_DEFLATED) as output:
                  for info in original.infolist():
                      if info.filename in replacement:
                          continue
                      output.writestr(info, original.read(info.filename))
                  for name, contents in replacement.items():
                      output.writestr(name, contents, compress_type=zipfile.ZIP_DEFLATED)
          temp.replace(archive)
          with zipfile.ZipFile(archive, "r") as result:
              names = result.namelist()
              for name, contents in replacement.items():
                  if names.count(name) != 1:
                      raise SystemExit(f"Expected exactly one current provenance member: {name}")
                  if result.read(name) != contents:
                      raise SystemExit(f"Archive provenance content does not match audited output: {name}")
              print("CURRENT_SBOM_PROVENANCE_OVERLAY=verified")
          PY
          unzip -t "$RUNNER_TEMP/$ZIP" | tail -1
          python - "$RUNNER_TEMP/$ZIP" <<'PY'
          import pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Bad ZIP member: {bad}")
              names = z.namelist()
              if not names:
                  raise SystemExit("Empty source archive")
              unsafe = [n for n in names if n.startswith("/") or ".." in pathlib.PurePosixPath(n).parts]
              if unsafe:
                  raise SystemExit(f"Unsafe paths in source archive: {unsafe[:10]}")
              print(f"ZIP_MEMBERS={len(names)}")
          PY
          cat > "$RUNNER_TEMP/$REPORT" <<EOF
          # NK1 — отчёт о сборке проверенного Release source

          - Дата сборки (UTC): $RELEASE_DATE
          - Ветка исходников: workpass70-source
          - Точный исходный SHA: $VALIDATED_SHA
          - Targeted core regression: success
          - Source-lineage regression: success
          - SBOM provenance and release-license readiness: success
          - Код архива создан через git archive для точного проверенного SHA.
          - Свежие contracts/SBOM.final.json и SOURCE_PROVENANCE_LICENSES_WORKPASSN.json поверх архива заменены результатами provenance gate и проверены на совпадение байтов.
          - ZIP integrity и безопасные пути проверены после overlay в CI.
          - Машиночитаемый release-manifest.json фиксирует source SHA, validation run/check IDs, build run, toolchain, gate outcomes и SHA-256/размер ZIP, отчёта, SBOM и source-provenance evidence.\n          - SHA-256 для ZIP, отчёта и release-manifest.json включён в SHA256SUMS.txt.

          Это технический prerelease, не подтверждение production-ready. Положительный прирост качества recall на независимом RU/EN holdout здесь не заявляется; он требует отдельной оценки.
          EOF
          export NODE_VERSION="$(node --version)"
          export PYTHON_VERSION="$(python3 --version)"
          python3 - "$RUNNER_TEMP/release-manifest-metadata.json" <<'PYMETA'
          import json
          import os
          import pathlib
          import sys

          metadata = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "release": {
                  "tag": os.environ["TAG"],
                  "date": os.environ["RELEASE_DATE"],
                  "prerelease": True,
              },
              "source": {
                  "branch": "workpass70-source",
                  "commit_sha": os.environ["VALIDATED_SHA"],
              },
              "validation": {
                  "workflow_run": {
                      "id": int(os.environ["VALIDATION_RUN_ID"]),
                      "run_number": int(os.environ["VALIDATION_RUN_NUMBER"]),
                      "run_attempt": int(os.environ["VALIDATION_RUN_ATTEMPT"]),
                      "name": os.environ["VALIDATION_WORKFLOW_NAME"],
                      "event": os.environ["VALIDATION_EVENT"],
                      "conclusion": os.environ["VALIDATION_CONCLUSION"],
                      "url": os.environ["VALIDATION_RUN_URL"],
                      "head_sha": os.environ["VALIDATION_HEAD_SHA"],
                      "head_branch": os.environ["VALIDATION_HEAD_BRANCH"],
                  },
                  "required_checks": json.loads(
                      pathlib.Path(os.environ["REQUIRED_CHECKS_JSON"]).read_text(encoding="utf-8")
                  ),
              },
              "build": {
                  "workflow_name": os.environ["GITHUB_WORKFLOW"],
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "run_url": (
                      os.environ["GITHUB_SERVER_URL"]
                      + "/"
                      + os.environ["GITHUB_REPOSITORY"]
                      + "/actions/runs/"
                      + os.environ["GITHUB_RUN_ID"]
                  ),
                  "node_version": os.environ["NODE_VERSION"],
                  "python_version": os.environ["PYTHON_VERSION"],
              },
              "gates": {
                  "exact_source_checks": "passed",
                  "source_freshness": "passed",
                  "provenance_and_license": "passed",
                  "archive_integrity": "passed",
              },
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PYMETA
          python3 release-tools/scripts/create_release_manifest.py \
            --metadata "$RUNNER_TEMP/release-manifest-metadata.json" \
            --artifact "zip=$RUNNER_TEMP/$ZIP" \
            --artifact "report=$RUNNER_TEMP/$REPORT" \
            --embedded-evidence "contracts/SBOM.final.json=$PWD/contracts/SBOM.final.json" \
            --embedded-evidence "$PROVENANCE=$PWD/$PROVENANCE" \
            --output "$RUNNER_TEMP/$MANIFEST"
          sha256sum "$RUNNER_TEMP/$ZIP" "$RUNNER_TEMP/$REPORT" "$RUNNER_TEMP/$MANIFEST" > "$RUNNER_TEMP/SHA256SUMS.txt"
          cat "$RUNNER_TEMP/SHA256SUMS.txt"
          ls -lh "$RUNNER_TEMP/$ZIP" "$RUNNER_TEMP/$REPORT" "$RUNNER_TEMP/$MANIFEST" "$RUNNER_TEMP/SHA256SUMS.txt"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Final freshness check before release publication
        id: final_guard
        if: steps.guard.outputs.publish == 'true' && steps.required_checks.outputs.validated == 'true' && steps.freshness.outputs.publish == 'true' && steps.release_audit.outputs.ready == 'true' && steps.package_artifacts.outputs.publish == 'true'
        shell: bash
        env:
          VALIDATED_SHA: ${{ steps.guard.outputs.validated_sha }}
        run: |
          set -euo pipefail
          LATEST_SHA="$(git ls-remote origin refs/heads/workpass70-source | cut -f1)"
          if [ "$LATEST_SHA" != "$VALIDATED_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Source advanced after packaging; refuse to publish stale SHA $VALIDATED_SHA"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish a new verified prerelease without overwriting prior tags
        if: steps.guard.outputs.publish == 'true' && steps.required_checks.outputs.validated == 'true' && steps.freshness.outputs.publish == 'true' && steps.release_audit.outputs.ready == 'true' && steps.package_artifacts.outputs.publish == 'true' && steps.final_guard.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.guard.outputs.tag }}
          RELEASE_DATE: ${{ steps.guard.outputs.release_date }}
          SHORT_SHA: ${{ steps.guard.outputs.short_sha }}
          VALIDATED_SHA: ${{ steps.guard.outputs.validated_sha }}
        run: |
          set -euo pipefail
          ZIP="Neuro_Kurisu_WORKPASS70_MAIN_SYNC_${RELEASE_DATE}_${SHORT_SHA}.zip"
          REPORT="WORKPASS70_MAIN_SYNC_${RELEASE_DATE}_${SHORT_SHA}_REPORT_RU.md"
          MANIFEST="NK1_RELEASE_MANIFEST_${RELEASE_DATE}_${SHORT_SHA}.json"
          gh release create "$TAG" "$RUNNER_TEMP/$ZIP" "$RUNNER_TEMP/$REPORT" "$RUNNER_TEMP/$MANIFEST" "$RUNNER_TEMP/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --target "$VALIDATED_SHA" --title "NeuroCore WorkPass70 Main Sync ($RELEASE_DATE)" --notes "Validated source snapshot for $VALIDATED_SHA. Exact-SHA core regression and source-lineage checks passed; ZIP integrity verified; report, machine-readable release manifest and SHA-256 manifest attached. This prerelease is not production approval." --prerelease
