name: NK1 semantic runtime retrieval accounting

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/organism/memory/MemoryFabric.ts"
      - "runtime/neuro-kurisu/tests/memory-fabric-semantic-retrieval.mjs"
      - "runtime/neuro-kurisu/package.json"
      - ".github/workflows/workpass607-semantic-runtime-wiring.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-runtime-wiring-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Runtime typecheck and semantic runtime accounting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: Verify selected-result semantic/lexical accounting
        run: npm --prefix runtime/neuro-kurisu run test:memory-fabric-semantic-retrieval
