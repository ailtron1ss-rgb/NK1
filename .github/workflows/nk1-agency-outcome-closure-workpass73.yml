name: NK1 agency outcome closure integrity

on:
  push:
    branches:
      - aspect/autonomy-verified-agency-outcome-loop-20261124
    paths:
      - ".github/workflows/nk1-agency-outcome-closure-workpass73.yml"
      - "runtime/neuro-kurisu/src/organism/cognition/SelfAuthorship.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/system/CognitiveEventFabric.ts"
      - "runtime/neuro-kurisu/tests/**"
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/cognition/SelfAuthorship.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/system/CognitiveEventFabric.ts"
      - "runtime/neuro-kurisu/tests/**"

permissions:
  contents: read

jobs:
  agency-outcome-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Run verified agency and action recovery regressions
        working-directory: runtime/neuro-kurisu
        run: |
          node --experimental-strip-types tests/self-authorship-verified-execution-workpass70.mjs
          node --experimental-strip-types tests/self-authorship-spineonly-runtime-workpass71.mjs
          node --experimental-strip-types tests/action-receipt-selfauthorship-recovery-workpass72.mjs
          node --experimental-strip-types tests/cef-decision-reference-workpass72.mjs
          node --experimental-strip-types tests/self-motivation-autonomy-runtime.mjs
          node --experimental-strip-types tests/self-motivation-delivery-consent.mjs
          node --experimental-strip-types tests/big-pass-272-endogenous-goal-genesis.mjs
          node --experimental-strip-types tests/workpass288-intrinsic-motivation-contract.mjs
          node --experimental-strip-types tests/workpass97-autonomous-planner-gateway-route.mjs
          node --experimental-strip-types tests/cognitive-runtime-planner-execution-gate-workpass603.mjs
