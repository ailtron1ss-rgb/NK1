name: NK1 memory semantic resilience

on:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/memory/MemoryFabric.ts"
      - "runtime/neuro-kurisu/tests/memory-semantic-*.mjs"
      - "runtime/neuro-kurisu/tests/workpass502-live-cognitive-semantic-retrieval.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - ".github/workflows/nk1-memory-semantic-resilience.yml"
  push:
    paths:
      - "runtime/neuro-kurisu/src/organism/memory/MemoryFabric.ts"
      - "runtime/neuro-kurisu/tests/memory-semantic-*.mjs"
      - "runtime/neuro-kurisu/tests/workpass502-live-cognitive-semantic-retrieval.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - ".github/workflows/nk1-memory-semantic-resilience.yml"

permissions:
  contents: read

concurrency:
  group: nk1-memory-semantic-resilience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-semantic-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            runtime/neuro-kurisu/package-lock.json
      - name: Install pinned app compiler
        run: npm ci --prefix app
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu
      - name: Exercise provider failure and timeout fallback
        run: npm run test:memory-semantic-failure-fallback
        working-directory: runtime/neuro-kurisu
      - name: Verify selected-result accounting
        run: npm run test:memory-semantic-retrieval-accounting
        working-directory: runtime/neuro-kurisu
      - name: Guard live cognitive semantic route
        run: npm run test:workpass502:semantic-cognition-route
        working-directory: runtime/neuro-kurisu
      - name: Run retrieval evaluation contract
        run: npm run test:memory-retrieval-experiment
        working-directory: runtime/neuro-kurisu
      - name: Typecheck runtime
        run: npm run typecheck
        working-directory: runtime/neuro-kurisu
