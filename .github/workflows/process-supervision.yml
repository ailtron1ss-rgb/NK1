name: NK1 process supervision focused regression

on:
  push:
    branches: [optimization/process-supervision-20261024]
    paths:
      - "tools/process-supervisor.mjs"
      - "tools/process-supervisor.test.mjs"
      - "tools/super-dev.mjs"
      - "tools/super-start.mjs"
      - "tools/super-install.mjs"
      - "tools/super-install.test.mjs"
      - "tools/runtime-requirements.mjs"
      - "tools/runtime-requirements.test.mjs"
      - "tools/super-doctor.mjs"
      - "tools/verify-final-release.mjs"
      - "tools/verify-integration.mjs"
      - "package.json"
      - "CHANGELOG.md"
      - "docs/PROCESS_SUPERVISION_OPTIMIZATION_2026-10-24.md"
      - ".github/workflows/process-supervision.yml"
  pull_request:
    paths:
      - "tools/process-supervisor.mjs"
      - "tools/process-supervisor.test.mjs"
      - "tools/super-dev.mjs"
      - "tools/super-start.mjs"
      - "tools/super-install.mjs"
      - "tools/super-install.test.mjs"
      - "tools/runtime-requirements.mjs"
      - "tools/runtime-requirements.test.mjs"
      - "tools/super-doctor.mjs"
      - "tools/verify-final-release.mjs"
      - "tools/verify-integration.mjs"
      - "package.json"
      - "CHANGELOG.md"
      - "docs/PROCESS_SUPERVISION_OPTIMIZATION_2026-10-24.md"
      - ".github/workflows/process-supervision.yml"

permissions:
  contents: read

concurrency:
  group: nk1-process-supervision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process-supervision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - name: Verify Node.js major pin
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version | sed 's/^v//')"
          case "$expected" in
            *.*) test "$actual" = "$expected" ;;
            *) test "${actual%%.*}" = "$expected" ;;
          esac
      - name: Syntax-check orchestration and release scripts
        run: |
          node --check tools/process-supervisor.mjs
          node --check tools/super-dev.mjs
          node --check tools/super-start.mjs
          node --check tools/super-install.mjs
          node --check tools/super-doctor.mjs
          node --check tools/verify-final-release.mjs
          node --check tools/verify-integration.mjs
      - name: Environment doctor smoke
        run: npm run doctor
      - name: Runtime prerequisites and installer regressions
        run: npm run test:runtime-prerequisites
      - name: Process supervision and readiness regressions
        run: npm run test:process-supervisor
