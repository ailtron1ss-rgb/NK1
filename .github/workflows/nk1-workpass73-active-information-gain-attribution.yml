name: NK1 WorkPass73 Active Information Gain decision attribution

on:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/cognition/NeuralExperienceBranch.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/ActiveInformationGainController.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/ExternalGroundingAdaptiveController.ts"
      - "runtime/neuro-kurisu/tests/active-information-gain-neural-attribution-workpass73.mjs"
      - "runtime/neuro-kurisu/tests/p2675-active-information-outcome-attribution.mjs"
      - "runtime/neuro-kurisu/tests/p2675-active-information-gain-closed-loop.mjs"
      - "runtime/neuro-kurisu/package.json"
      - ".github/workflows/nk1-workpass73-active-information-gain-attribution.yml"

permissions:
  contents: read

jobs:
  active-information-gain-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prove A-to-B snapshot attribution regression fails on the current integration base (TDD red)
        run: |
          set -euo pipefail
          RED_WORKTREE="$RUNNER_TEMP/nk1-workpass73-tdd-red"
          git worktree add --detach "$RED_WORKTREE" "origin/$GITHUB_BASE_REF"
          mkdir -p "$RED_WORKTREE/runtime/neuro-kurisu/tests"
          cp "$GITHUB_WORKSPACE/runtime/neuro-kurisu/tests/active-information-gain-neural-attribution-workpass73.mjs" \
            "$RED_WORKTREE/runtime/neuro-kurisu/tests/active-information-gain-neural-attribution-workpass73.mjs"
          cd "$RED_WORKTREE/runtime/neuro-kurisu"
          output=""
          if output=$(node --experimental-strip-types tests/active-information-gain-neural-attribution-workpass73.mjs 2>&1); then
            echo "Expected A-to-B attribution regression on the current PR base, but the test passed."
            exit 1
          fi
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F "the motion experiment must learn from its own completed outcome" >/dev/null
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$RED_WORKTREE"
      - name: NeuralExperienceBranch A-to-B attribution after snapshot restore
        working-directory: runtime/neuro-kurisu
        run: npm run test:active-information-gain-neural-attribution-workpass73
      - name: Standalone Active Information Gain contract and 1800-cycle / 900-cycle closed loop
        working-directory: runtime/neuro-kurisu
        run: npm run test:p2675:information
      - name: Existing 600-cycle NeuralExperienceBranch integration and restore
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/big-pass-2522-neural-experience-branch.mjs
      - name: Runtime syntax/typecheck
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
