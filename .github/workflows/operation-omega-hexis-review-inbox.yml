name: Operation Omega — Hexis review inbox
on:
  pull_request:
    branches: [rebuild]
    paths:
      - '.github/workflows/operation-omega-hexis-review-inbox.yml'
      - 'runtime/neuro-kurisu/src/organism/learning/HexisSkillReviewInbox.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/AtomicFileSkillReviewInboxPersistence.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedSkillPromotion.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeArtifact.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeLedger.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedSessionDataset.ts'
      - 'runtime/neuro-kurisu/tests/operation-omega-hexis-review-inbox.mjs'
      - 'runtime/neuro-kurisu/package.json'
  push:
    branches: [rebuild]
    paths:
      - '.github/workflows/operation-omega-hexis-review-inbox.yml'
      - 'runtime/neuro-kurisu/src/organism/learning/HexisSkillReviewInbox.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/AtomicFileSkillReviewInboxPersistence.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedSkillPromotion.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeArtifact.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeLedger.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedSessionDataset.ts'
      - 'runtime/neuro-kurisu/tests/operation-omega-hexis-review-inbox.mjs'
      - 'runtime/neuro-kurisu/package.json'
permissions:
  contents: read
jobs:
  review-inbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/neuro-kurisu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Run Operation Omega review-inbox regression
        run: node --experimental-strip-types tests/operation-omega-hexis-review-inbox.mjs
