name: Operation Omega — Hexis review inbox
on:
  pull_request:
    branches: [rebuild, operation-omega-hexis-2026-10-24]
    paths:
      - '.github/workflows/operation-omega-hexis-review-inbox.yml'
      - 'runtime/neuro-kurisu/src/organism/integration/hexis/HexisAdaptationFabric.ts'
      - 'runtime/neuro-kurisu/tests/integration/hexis-adaptation.mjs'
      - 'runtime/neuro-kurisu/tests/integration/hexis-server-smoke.mjs'
      - 'docs/OPERATION_OMEGA_HEXIS_DEEP_PASS_2026-10-24.md'
      - 'runtime/neuro-kurisu/src/organism/learning/HexisSkillReviewInbox.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/AuthenticatedSkillReviewDecision.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/AtomicFileSkillReviewInboxPersistence.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedSkillPromotion.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeArtifact.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeLedger.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedSessionDataset.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/TrustedSkillShadowRunRegistry.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedSkillShadowEvidence.ts'
      - 'runtime/neuro-kurisu/tests/operation-omega-hexis-review-inbox.mjs'
      - 'runtime/neuro-kurisu/src/organism/memory/P65EpistemicLedger.ts'
      - 'runtime/neuro-kurisu/src/organism/memory/SourceMonitor.ts'
      - 'runtime/neuro-kurisu/tests/operation-omega-hexis-source-monitor.mjs'
      - 'runtime/neuro-kurisu/tests/operation-omega-hexis-memory-provenance.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - 'legacy/input-archives/hexis-selected-2026-10-24/**'
      - 'docs/OPERATION_OMEGA_HEXIS_INTEGRATION_2026-10-24.md'
      - 'CHANGELOG.md'
      - 'runtime/neuro-kurisu/scripts/create-skill-promotion-approval-request.mjs'
      - 'runtime/neuro-kurisu/scripts/create-skill-review-decision-signing-request.mjs'
      - 'runtime/neuro-kurisu/package.json'
  push:
    branches: [rebuild, operation-omega-hexis-2026-10-24]
    paths:
      - '.github/workflows/operation-omega-hexis-review-inbox.yml'
      - 'runtime/neuro-kurisu/src/organism/integration/hexis/HexisAdaptationFabric.ts'
      - 'runtime/neuro-kurisu/tests/integration/hexis-adaptation.mjs'
      - 'runtime/neuro-kurisu/tests/integration/hexis-server-smoke.mjs'
      - 'docs/OPERATION_OMEGA_HEXIS_DEEP_PASS_2026-10-24.md'
      - 'runtime/neuro-kurisu/src/organism/learning/HexisSkillReviewInbox.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/AuthenticatedSkillReviewDecision.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/AtomicFileSkillReviewInboxPersistence.mjs'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedSkillPromotion.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeArtifact.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeLedger.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedSessionDataset.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/TrustedSkillShadowRunRegistry.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/VerifiedSkillShadowEvidence.ts'
      - 'runtime/neuro-kurisu/tests/operation-omega-hexis-review-inbox.mjs'
      - 'runtime/neuro-kurisu/src/organism/memory/P65EpistemicLedger.ts'
      - 'runtime/neuro-kurisu/src/organism/memory/SourceMonitor.ts'
      - 'runtime/neuro-kurisu/tests/operation-omega-hexis-source-monitor.mjs'
      - 'runtime/neuro-kurisu/tests/operation-omega-hexis-memory-provenance.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - 'legacy/input-archives/hexis-selected-2026-10-24/**'
      - 'docs/OPERATION_OMEGA_HEXIS_INTEGRATION_2026-10-24.md'
      - 'CHANGELOG.md'
      - 'runtime/neuro-kurisu/scripts/create-skill-promotion-approval-request.mjs'
      - 'runtime/neuro-kurisu/scripts/create-skill-review-decision-signing-request.mjs'
      - 'runtime/neuro-kurisu/package.json'
permissions:
  contents: read
jobs:
  review-inbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/neuro-kurisu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Run Operation Omega review-inbox regression
        run: node --experimental-strip-types tests/operation-omega-hexis-review-inbox.mjs
      - name: Run Hexis-inspired epistemic provenance regression
        run: node --experimental-strip-types tests/operation-omega-hexis-memory-provenance.mjs
      - name: Run Hexis-inspired source-monitor lineage regression
        run: node --experimental-strip-types tests/operation-omega-hexis-source-monitor.mjs
      - name: Run Hexis HMX staging and import-boundary regression
        run: node --experimental-strip-types tests/integration/hexis-adaptation.mjs
      - name: Run Hexis server integration smoke
        run: node --experimental-strip-types tests/integration/hexis-server-smoke.mjs
