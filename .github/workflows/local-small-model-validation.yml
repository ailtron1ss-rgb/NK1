name: NK1 local small-model validation

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/server/LocalSmallModelHub.mjs"
      - "runtime/neuro-kurisu/src/server/LocalInferenceScheduler.mjs"
      - "runtime/neuro-kurisu/src/server/server.mjs"
      - "runtime/neuro-kurisu/tests/server-language-http-fake-provider.mjs"
      - "runtime/neuro-kurisu/scripts/register-typescript-loader.mjs"
      - "runtime/neuro-kurisu/scripts/typescript-transpile-loader.mjs"
      - "runtime/neuro-kurisu/src/organism/body/LocalOpenAICompatibleVisionBackend.ts"
      - "runtime/neuro-kurisu/src/organism/body/VisionSemanticBackend.ts"
      - "runtime/neuro-kurisu/src/organism/developmental/LocalEmbeddingProvider.ts"
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/organism/core/MemorySubsystemRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/system/EmotionAppraisalEngine.ts"
      - "runtime/neuro-kurisu/tests/local-small-model-hub-workpass.mjs"
      - "runtime/neuro-kurisu/tests/local-inference-scheduler-workpass.mjs"
      - "runtime/neuro-kurisu/tests/local-affect-appraisal-bridge-workpass.mjs"
      - "runtime/neuro-kurisu/tests/local-vision-backend-workpass.mjs"
      - "runtime/neuro-kurisu/tests/local-embedding-privacy-workpass56.mjs"
      - "runtime/neuro-kurisu/tests/local-llm-selection-workpass74.mjs"
      - "runtime/neuro-kurisu/tests/local-chat-provider-workpass40.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "app/package-lock.json"
      - ".nvmrc"
      - ".github/workflows/local-small-model-validation.yml"
  push:
    branches: [local-small-model-integration-2026-10-24]
    paths:
      - "runtime/neuro-kurisu/src/server/LocalSmallModelHub.mjs"
      - "runtime/neuro-kurisu/src/server/LocalInferenceScheduler.mjs"
      - "runtime/neuro-kurisu/src/server/server.mjs"
      - "runtime/neuro-kurisu/tests/server-language-http-fake-provider.mjs"
      - "runtime/neuro-kurisu/scripts/register-typescript-loader.mjs"
      - "runtime/neuro-kurisu/scripts/typescript-transpile-loader.mjs"
      - "runtime/neuro-kurisu/src/organism/body/LocalOpenAICompatibleVisionBackend.ts"
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/organism/core/MemorySubsystemRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/system/EmotionAppraisalEngine.ts"
      - "runtime/neuro-kurisu/tests/local-small-model-hub-workpass.mjs"
      - "runtime/neuro-kurisu/tests/local-inference-scheduler-workpass.mjs"
      - "runtime/neuro-kurisu/tests/local-affect-appraisal-bridge-workpass.mjs"
      - "runtime/neuro-kurisu/tests/local-vision-backend-workpass.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "app/package-lock.json"
      - ".nvmrc"
      - ".github/workflows/local-small-model-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk1-local-small-models-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-small-model-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned TypeScript and Node typings
        run: npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: Typecheck local visual backend contract
        run: >-
          node app/node_modules/typescript/bin/tsc
          --noEmit --skipLibCheck --strict
          --target ES2022 --module ESNext --moduleResolution bundler
          --types node --typeRoots app/node_modules/@types
          --allowImportingTsExtensions
          runtime/neuro-kurisu/src/organism/body/VisionSemanticBackend.ts
          runtime/neuro-kurisu/src/organism/body/LocalOpenAICompatibleVisionBackend.ts
          runtime/neuro-kurisu/src/organism/system/EmotionAppraisalEngine.ts
      - name: Local small-model hub regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/local-small-model-hub-workpass.mjs
      - name: Local affect-to-appraisal bridge regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/local-affect-appraisal-bridge-workpass.mjs
      - name: Local inference scheduler and backpressure regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/local-inference-scheduler-workpass.mjs
      - name: Local vision HTTP and output-boundary regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/local-vision-backend-workpass.mjs
      - name: Local embedding privacy regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/local-embedding-privacy-workpass56.mjs
      - name: Local language backend selection regression
        run: node runtime/neuro-kurisu/tests/local-llm-selection-workpass74.mjs
      - name: Local chat provider response-boundary regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/local-chat-provider-workpass40.mjs
      - name: Full server smoke for integrated local models
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/server-language-http-fake-provider.mjs
