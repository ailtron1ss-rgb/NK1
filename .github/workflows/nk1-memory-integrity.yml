name: NK1 Memory integrity and retrieval gates

on:
  push:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/organism/memory/**"
      - "runtime/neuro-kurisu/src/organism/core/MemorySubsystemRuntime.ts"
      - "runtime/neuro-kurisu/tests/**memory*"
      - "runtime/neuro-kurisu/tests/**retrieval*"
      - "runtime/neuro-kurisu/tests/**restore*"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - ".github/workflows/nk1-memory-integrity.yml"
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/organism/memory/**"
      - "runtime/neuro-kurisu/src/organism/core/MemorySubsystemRuntime.ts"
      - "runtime/neuro-kurisu/tests/**memory*"
      - "runtime/neuro-kurisu/tests/**retrieval*"
      - "runtime/neuro-kurisu/tests/**restore*"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - ".github/workflows/nk1-memory-integrity.yml"

permissions:
  contents: read

concurrency:
  group: nk1-memory-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  memory-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: Snapshot restore integrity and lineage
        run: npm --prefix runtime/neuro-kurisu run test:memory-restore-integrity && npm --prefix runtime/neuro-kurisu run test:workpass76:memory-lineage-integrity && npm --prefix runtime/neuro-kurisu run test:memory-provenance-lineage-workpass30 && npm --prefix runtime/neuro-kurisu run test:memory-byte-estimate-idempotency && npm --prefix runtime/neuro-kurisu run test:memory-byte-budget-consistency
      - name: Memory lifecycle persistence
        run: npm --prefix runtime/neuro-kurisu run test:memory-subsystem-state-roundtrip && npm --prefix runtime/neuro-kurisu run test:memory-semantic-vector-integrity && npm --prefix runtime/neuro-kurisu run test:memory-conflict-revision-graph && npm --prefix runtime/neuro-kurisu run test:memory-temporal-validity-write-guard && npm --prefix runtime/neuro-kurisu run test:memory-capacity-protection && npm --prefix runtime/neuro-kurisu run test:memory-duplicate-id-write-guard && npm --prefix runtime/neuro-kurisu run test:memory-write-defaults-integrity && npm --prefix runtime/neuro-kurisu run test:memory-revision-tip-reachability && npm --prefix runtime/neuro-kurisu run test:memory-evidence-lineage-bytes
      - name: Retrieval safety and metadata contracts
        run: npm --prefix runtime/neuro-kurisu run test:memory-retrieval-grounded-abstention-workpass574 && npm --prefix runtime/neuro-kurisu run test:memory-answerability-word-root && npm --prefix runtime/neuro-kurisu run test:memoryos2-metadata-retrieval && npm --prefix runtime/neuro-kurisu run test:memory-metadata-index-consistency && npm --prefix runtime/neuro-kurisu run test:memory-tip-of-tongue-partial-activation && npm --prefix runtime/neuro-kurisu run test:memory-fabric-semantic-retrieval
      - name: Retrieval benchmark and seed sensitivity
        run: npm --prefix runtime/neuro-kurisu run test:memory-retrieval-benchmark && npm --prefix runtime/neuro-kurisu run test:memory-retrieval-experiment
