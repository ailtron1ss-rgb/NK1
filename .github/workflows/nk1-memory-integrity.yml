name: NK1 Memory integrity and retrieval gates

on:
  push:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/organism/memory/**"
      - "runtime/neuro-kurisu/src/organism/core/MemorySubsystemRuntime.ts"
      - "runtime/neuro-kurisu/tests/**memory*"
      - "runtime/neuro-kurisu/tests/**retrieval*"
      - "runtime/neuro-kurisu/tests/**restore*"
      - "runtime/neuro-kurisu/tests/p2887-implicit-stale-conflict-closure.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - ".github/workflows/nk1-memory-integrity.yml"
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/organism/memory/**"
      - "runtime/neuro-kurisu/src/organism/core/MemorySubsystemRuntime.ts"
      - "runtime/neuro-kurisu/tests/**memory*"
      - "runtime/neuro-kurisu/tests/**retrieval*"
      - "runtime/neuro-kurisu/tests/**restore*"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - ".github/workflows/nk1-memory-integrity.yml"

permissions:
  contents: read

concurrency:
  group: nk1-memory-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  memory-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: Snapshot restore integrity and lineage
        run: npm --prefix runtime/neuro-kurisu run test:memory-restore-integrity && npm --prefix runtime/neuro-kurisu run test:workpass76:memory-lineage-integrity
      - name: Memory lifecycle persistence
        run: npm --prefix runtime/neuro-kurisu run test:memory-subsystem-state-roundtrip && npm --prefix runtime/neuro-kurisu run test:memory-semantic-vector-integrity
      - name: MemoryFabric current revision tip bridge
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/memory-fabric-revision-tip-bridge.mjs
      - name: Memory byte budget and write invariants (TDD port)
        working-directory: runtime/neuro-kurisu
        run: |
          node --experimental-strip-types tests/memory-byte-budget-consistency.mjs
          node --experimental-strip-types tests/memory-byte-estimate-idempotency.mjs
          node --experimental-strip-types tests/memory-capacity-protection.mjs
          node --experimental-strip-types tests/memory-duplicate-id-write-guard.mjs
          node --experimental-strip-types tests/memory-write-defaults-integrity.mjs
          node --experimental-strip-types tests/memoryos2-byte-accounting-workpass70.mjs
          node --experimental-strip-types tests/memoryos2-byte-roundtrip-workpass70.mjs
      - name: Memory revision and evidence lineage invariants (TDD port)
        working-directory: runtime/neuro-kurisu
        run: |
          node --experimental-strip-types tests/memory-conflict-revision-graph.mjs
          node --experimental-strip-types tests/memory-evidence-lineage-bytes.mjs
          node --experimental-strip-types tests/memory-revision-tip-reachability.mjs
          node --experimental-strip-types tests/memory-temporal-validity-write-guard.mjs
      - name: Memory answerability, restore oracle and index regressions (TDD port)
        working-directory: runtime/neuro-kurisu
        run: |
          node --experimental-strip-types tests/memory-answerability-word-root.mjs
          node --experimental-strip-types tests/memory-live-restore-oracle-fuzz.mjs
          node --experimental-strip-types tests/memory-metadata-index-consistency.mjs
          node --experimental-strip-types tests/memory-tip-of-tongue-partial-activation.mjs
      - name: Preserve unverified HMX hypotheses during implicit conflict scans
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p2887-implicit-stale-conflict-closure.mjs
      - name: Consolidation and canonical lifecycle restore integrity
        run: npm --prefix runtime/neuro-kurisu run test:r5:memory-lifecycle
      - name: Retrieval safety and metadata contracts
        run: npm --prefix runtime/neuro-kurisu run test:memory-retrieval-grounded-abstention-workpass574 && npm --prefix runtime/neuro-kurisu run test:memoryos2-metadata-retrieval && npm --prefix runtime/neuro-kurisu run test:memory-fabric-semantic-retrieval && npm --prefix runtime/neuro-kurisu run test:memory-retrieval-cross-lingual-bridge
      - name: Retrieval benchmark and seed sensitivity
        run: npm --prefix runtime/neuro-kurisu run test:memory-retrieval-benchmark && npm --prefix runtime/neuro-kurisu run test:memory-retrieval-experiment
