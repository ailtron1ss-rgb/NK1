name: NK1 Memory Evidence Freshness and Context Reranking
on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/organism/developmental/MemorySignalFusion.ts"
      - "runtime/neuro-kurisu/src/organism/developmental/MemorySemanticReranker.ts"
      - "runtime/neuro-kurisu/tests/memoryos2-evidence-freshness.mjs"
      - "runtime/neuro-kurisu/tests/memory-semantic-affect-reranking.mjs"
      - "runtime/neuro-kurisu/tests/memory-semantic-affect-reranker-benchmark.mjs"
      - ".github/workflows/nk1-memory-freshness-context-reranking.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nk1-memory-freshness-context-reranking-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate-memory-freshness-and-reranking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: Evidence freshness lifecycle and restore regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/memoryos2-evidence-freshness.mjs
      - name: Bounded affect-aware semantic reranking regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/memory-semantic-affect-reranking.mjs
      - name: 10k-candidate reranker component benchmark
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/memory-semantic-affect-reranker-benchmark.mjs
      - name: Existing MemoryOS2 capacity and lifecycle regression
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/memoryos2-capacity-lifecycle-integrity.mjs
