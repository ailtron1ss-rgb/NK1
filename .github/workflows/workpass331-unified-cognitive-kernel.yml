name: WorkPass331 unified cognitive kernel

on:
  push:
    paths:
      - "runtime/neuro-kurisu/src/organism/core/CanonicalCognitiveKernel.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/tests/canonical-cognitive-kernel-runtime-wiring.mjs"
      - "runtime/neuro-kurisu/tests/organism-smoke.mjs"
      - "runtime/neuro-kurisu/tests/organism-autonomy.mjs"
      - "runtime/neuro-kurisu/tests/workpass50-autonomous-background-clock.mjs"
      - "runtime/neuro-kurisu/tests/workpass50-autonomous-runtime-loop.mjs"
      - "runtime/neuro-kurisu/tests/restart-persistence.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/B272EndogenousGoalGenesis.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/B273AutonomousGoalLifecycle.ts"
      - "runtime/neuro-kurisu/tests/big-pass-272-endogenous-goal-genesis.mjs"
      - "runtime/neuro-kurisu/tests/big-pass-272-core-endogenous-goals.mjs"
      - "runtime/neuro-kurisu/tests/big-pass-273-autonomous-goal-lifecycle.mjs"
      - "runtime/neuro-kurisu/src/organism/system/CognitiveEventFabric.ts"
      - "runtime/neuro-kurisu/src/organism/system/UnifiedCognitiveCycle.ts"
      - "runtime/neuro-kurisu/tests/canonical-cognitive-kernel.mjs"
      - ".nvmrc"
      - "package.json"
      - "tools/runtime-requirements.mjs"
      - "tools/runtime-requirements.test.mjs"
      - "tools/super-doctor.mjs"
      - "tools/super-install.mjs"
      - "tools/super-install.test.mjs"
      - ".github/workflows/workpass331-unified-cognitive-kernel.yml"
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/core/CanonicalCognitiveKernel.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/tests/canonical-cognitive-kernel-runtime-wiring.mjs"
      - "runtime/neuro-kurisu/tests/organism-smoke.mjs"
      - "runtime/neuro-kurisu/tests/organism-autonomy.mjs"
      - "runtime/neuro-kurisu/tests/workpass50-autonomous-background-clock.mjs"
      - "runtime/neuro-kurisu/tests/workpass50-autonomous-runtime-loop.mjs"
      - "runtime/neuro-kurisu/tests/restart-persistence.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/B272EndogenousGoalGenesis.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/B273AutonomousGoalLifecycle.ts"
      - "runtime/neuro-kurisu/tests/big-pass-272-endogenous-goal-genesis.mjs"
      - "runtime/neuro-kurisu/tests/big-pass-272-core-endogenous-goals.mjs"
      - "runtime/neuro-kurisu/tests/big-pass-273-autonomous-goal-lifecycle.mjs"
      - "runtime/neuro-kurisu/src/organism/system/CognitiveEventFabric.ts"
      - "runtime/neuro-kurisu/src/organism/system/UnifiedCognitiveCycle.ts"
      - "runtime/neuro-kurisu/tests/canonical-cognitive-kernel.mjs"
      - ".nvmrc"
      - "package.json"
      - "tools/runtime-requirements.mjs"
      - "tools/runtime-requirements.test.mjs"
      - "tools/super-doctor.mjs"
      - "tools/super-install.mjs"
      - "tools/super-install.test.mjs"
      - ".github/workflows/workpass331-unified-cognitive-kernel.yml"

permissions:
  contents: read

concurrency:
  group: nk1-workpass331-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  canonical-cognitive-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify Node/npm engine floor
        run: node --test tools/runtime-requirements.test.mjs
      - name: Verify clean-checkout startup preflight
        run: npm run doctor
      - name: Install the repository-pinned TypeScript compiler
        run: npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: Typecheck the full canonical runtime
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
      - name: Verify canonical decision-to-learning causal loop
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/canonical-cognitive-kernel.mjs
      - name: Verify intrinsic drive reaches B272 goal genesis and persists
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/big-pass-272-endogenous-goal-genesis.mjs && node --experimental-strip-types tests/big-pass-272-core-endogenous-goals.mjs
      - name: Verify B273 goal outcome replay is rejected
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/big-pass-273-autonomous-goal-lifecycle.mjs
      - name: Verify live runtime uses the canonical kernel
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/canonical-cognitive-kernel-runtime-wiring.mjs
      - name: Verify organism smoke startup
        working-directory: runtime/neuro-kurisu
        run: npm run test:smoke
      - name: Verify autonomous action selection is not stuck in wait
        working-directory: runtime/neuro-kurisu
        run: npm run test:autonomy
      - name: Verify spontaneous dialogue, feedback learning, and restore continuity
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/workpass50-autonomous-runtime-loop.mjs
      - name: Verify initiative on the background cognitive clock
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/workpass50-autonomous-background-clock.mjs
      - name: Verify state survives runtime restart
        working-directory: runtime/neuro-kurisu
        run: npm run test:restart
