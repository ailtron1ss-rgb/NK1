name: NK1 code assimilation contracts

on:
  pull_request:
    paths:
      - 'runtime/neuro-kurisu/src/organism/learning/CodeAssimilationContracts.ts'
      - 'runtime/neuro-kurisu/tests/code-assimilation-contracts-workpass655.mjs'
      - '.github/workflows/nk1-code-assimilation-contracts.yml'
  push:
    branches:
      - workpass70-source
    paths:
      - 'runtime/neuro-kurisu/src/organism/learning/CodeAssimilationContracts.ts'
      - 'runtime/neuro-kurisu/tests/code-assimilation-contracts-workpass655.mjs'
      - '.github/workflows/nk1-code-assimilation-contracts.yml'

permissions:
  contents: read

concurrency:
  group: nk1-code-assimilation-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  intake-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate code assimilation intake and lifecycle contracts
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/code-assimilation-contracts-workpass655.mjs
