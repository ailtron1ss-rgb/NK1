name: NK1 MemoryOS2 spatial retrieval
on:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/organism/developmental/MemorySpatialIndex.ts"
      - "runtime/neuro-kurisu/tests/memoryos2-spatial-retrieval-workpass.mjs"
      - ".github/workflows/memoryos2-spatial-retrieval.yml"
  push:
    branches:
      - "aspect/memory-spatial-recall-20261103"
    paths:
      - "runtime/neuro-kurisu/src/organism/developmental/MemoryOS2.ts"
      - "runtime/neuro-kurisu/src/organism/developmental/MemorySpatialIndex.ts"
      - "runtime/neuro-kurisu/tests/memoryos2-spatial-retrieval-workpass.mjs"
      - ".github/workflows/memoryos2-spatial-retrieval.yml"
permissions:
  contents: read
jobs:
  spatial-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts
        working-directory: runtime/neuro-kurisu
      - name: Run spatial-memory regressions
        run: node --experimental-strip-types tests/memoryos2-spatial-retrieval-workpass.mjs
        working-directory: runtime/neuro-kurisu
      - name: Typecheck runtime
        run: npm run typecheck
        working-directory: runtime/neuro-kurisu
