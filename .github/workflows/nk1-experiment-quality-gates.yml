name: NK1 Experiment Quality Gates

on:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomePromotionGate.ts"
      - "runtime/neuro-kurisu/src/organism/learning/ExperimentInference.ts"
      - "runtime/neuro-kurisu/src/organism/learning/ExperimentCampaignRegistry.ts"
      - "runtime/neuro-kurisu/src/organism/learning/ExperimentCampaignRegistryFileStore.ts"
      - "runtime/neuro-kurisu/tests/p23-experiment-campaign-file-store.mjs"
      - "runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeArtifact.ts"
      - "runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeLedger.ts"
      - "runtime/neuro-kurisu/src/organism/learning/LearningExperimentPlan.ts"
      - "runtime/neuro-kurisu/tests/p23-experiment-inference.mjs"
      - "runtime/neuro-kurisu/tests/p23-experiment-campaign-registry.mjs"
      - "runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeLedger.ts"
      - "runtime/neuro-kurisu/src/organism/learning/VerifiedOutcomeArtifact.ts"
      - "runtime/neuro-kurisu/src/organism/learning/LearningExperimentPlan.ts"
      - "runtime/neuro-kurisu/src/organism/learning/UnifiedLearningSubstrate.ts"
      - "runtime/neuro-kurisu/src/organism/memory/ExperienceContinuumFabric.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/IntrinsicExperimentGenerator.ts"
      - "runtime/neuro-kurisu/src/organism/cognition/B268CausalSelfExperimentLab.ts"
      - "runtime/neuro-kurisu/src/organism/system/CausalSelfExperimentLab.ts"
      - "runtime/neuro-kurisu/src/organism/system/P77RealityExperimentOS.ts"
      - "runtime/neuro-kurisu/tests/p23-*.mjs"
      - "runtime/neuro-kurisu/tests/p26-holdout-provenance.mjs"
      - "runtime/neuro-kurisu/tests/scientific-method-verification-gate-workpass595.mjs"
      - "runtime/neuro-kurisu/tests/workpass490-intrinsic-experiment-boundaries.mjs"
      - "runtime/neuro-kurisu/tests/big-pass-105-experimental-protocol.mjs"
      - "runtime/neuro-kurisu/tests/big-pass-103-memory-transfer.mjs"
      - "runtime/neuro-kurisu/tools/experimental-protocol-audit.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - ".github/workflows/nk1-experiment-quality-gates.yml"
      - "docs/EXPERIMENTS_EVALUATION_QUALITY_GATE_2026-10-29.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk1-experiment-quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  experiment-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
      - name: Use repository Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked dependencies
        working-directory: runtime/neuro-kurisu
        run: npm ci
      - name: Typecheck runtime
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
      - name: Verify exact paired inference and Holm correction
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-experiment-inference.mjs
      - name: Verify one-shot signed holdout campaign governance
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-experiment-campaign-registry.mjs
      - name: Verify durable holdout reservation across restarts and processes
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-experiment-campaign-file-store.mjs
      - name: Verify promotion gate and adversarial evidence cases
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-verified-outcome-promotion-gate.mjs
      - name: Verify outcome-to-promotion integration
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-outcome-promotion-integration.mjs
      - name: Verify seed-clustered paired comparison
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-seed-clustered-outcome-comparison.mjs
      - name: Verify deterministic experiment plan and ledger binding
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-learning-experiment-plan.mjs
      - name: Verify experiment-plan CLI
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p23-learning-experiment-plan-cli.mjs
      - name: Verify holdout provenance and self-report rejection
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/p26-holdout-provenance.mjs
      - name: Verify scientific method refuses unverified claims
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/scientific-method-verification-gate-workpass595.mjs
      - name: Verify intrinsic experiments remain hypotheses
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/workpass490-intrinsic-experiment-boundaries.mjs
      - name: Verify memory-transfer and replay evidence integrity
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/big-pass-103-memory-transfer.mjs
      - name: Verify matched replay/transfer protocol
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/big-pass-105-experimental-protocol.mjs
      - name: Audit protocol wiring
        working-directory: runtime/neuro-kurisu
        run: node tools/experimental-protocol-audit.mjs
