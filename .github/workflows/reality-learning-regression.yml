name: Reality-to-learning regression

on:
  push:
    branches: [feature/feedback]
    paths:
      - 'runtime/neuro-kurisu/src/organism/system/ExternalObserverFabric.ts'
      - 'runtime/neuro-kurisu/src/organism/system/RealityEvidenceLedger.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/P23LearningEngine.ts'
      - 'runtime/neuro-kurisu/src/organism/core/EvidenceResearchSubsystemRuntime.ts'
      - 'runtime/neuro-kurisu/src/organism/system/ActionGateway.ts'
      - 'runtime/neuro-kurisu/src/organism/system/EmotionAppraisalEngine.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismCore.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismSystemFabric.ts'
      - 'runtime/neuro-kurisu/tests/big-pass-64-external-observer.mjs'
      - 'runtime/neuro-kurisu/tests/workpass559-emotion-context-learning.mjs'
      - 'runtime/neuro-kurisu/tests/workpass521-observer-ledger-bridge.mjs'
      - 'runtime/neuro-kurisu/tests/workpass529-p23-reality-promotion-gate.mjs'
      - 'runtime/neuro-kurisu/tests/workpass548-observer-source-identity.mjs'
      - '.github/workflows/reality-learning-regression.yml'
  pull_request:
    branches: [integration]
    paths:
      - 'runtime/neuro-kurisu/src/organism/system/ExternalObserverFabric.ts'
      - 'runtime/neuro-kurisu/src/organism/system/RealityEvidenceLedger.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/P23LearningEngine.ts'
      - 'runtime/neuro-kurisu/src/organism/core/EvidenceResearchSubsystemRuntime.ts'
      - 'runtime/neuro-kurisu/src/organism/system/ActionGateway.ts'
      - 'runtime/neuro-kurisu/src/organism/system/EmotionAppraisalEngine.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismCore.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismSystemFabric.ts'
      - 'runtime/neuro-kurisu/tests/big-pass-64-external-observer.mjs'
      - 'runtime/neuro-kurisu/tests/workpass559-emotion-context-learning.mjs'
      - 'runtime/neuro-kurisu/tests/workpass521-observer-ledger-bridge.mjs'
      - 'runtime/neuro-kurisu/tests/workpass529-p23-reality-promotion-gate.mjs'
      - 'runtime/neuro-kurisu/tests/workpass548-observer-source-identity.mjs'
      - '.github/workflows/reality-learning-regression.yml'

permissions:
  contents: read

jobs:
  reality-to-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # Use the runner's cached Node 24 when available; this workflow does not install npm dependencies.
          package-manager-cache: false
      - name: Verify observer identity, ledger persistence, and promotion preconditions
        working-directory: runtime/neuro-kurisu
        run: |
          node --experimental-strip-types tests/workpass521-observer-ledger-bridge.mjs
          node --experimental-strip-types tests/workpass529-p23-reality-promotion-gate.mjs
          node --experimental-strip-types tests/workpass548-observer-source-identity.mjs
          node --experimental-strip-types tests/workpass559-emotion-context-learning.mjs
          node --experimental-strip-types --experimental-transform-types tests/big-pass-64-external-observer.mjs
