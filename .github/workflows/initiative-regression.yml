name: Initiative regression guard

on:
  push:
    branches: [integration]
    paths:
      - 'runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts'
      - 'runtime/neuro-kurisu/src/organism/extensions/motivation/InitiativePolicy.ts'
      - 'runtime/neuro-kurisu/tests/initiative-*.mjs'
      - '.github/workflows/initiative-regression.yml'
  pull_request:
    branches: [integration]
    paths:
      - 'runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts'
      - 'runtime/neuro-kurisu/src/organism/extensions/motivation/InitiativePolicy.ts'
      - 'runtime/neuro-kurisu/tests/initiative-*.mjs'
      - '.github/workflows/initiative-regression.yml'

permissions:
  contents: read

jobs:
  initiative-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard autonomous initiative wiring
        run: >-
          node --test
          runtime/neuro-kurisu/tests/initiative-runtime-wiring-workpass329.mjs
          runtime/neuro-kurisu/tests/initiative-autonomous-clock-workpass330.mjs
