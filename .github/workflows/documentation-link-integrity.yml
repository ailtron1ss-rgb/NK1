name: Documentation links and dependency boundaries

on:
  pull_request:
    branches:
      - workpass331-unified-cognitive-kernel-2026-10-24
      - operation-omega-hexis-2026-10-24
      - integration
      - main
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.markdown"
      - "package.json"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/scripts/audit-architecture.mjs"
      - "runtime/neuro-kurisu/scripts/audit-server-imports.mjs"
      - "runtime/neuro-kurisu/scripts/dependency-boundary-policy.mjs"
      - "runtime/neuro-kurisu/tests/architecture-dependency-boundaries.test.mjs"
      - "runtime/neuro-kurisu/tests/server-import-graph-audit.test.mjs"
      - "tools/audit-markdown-links.mjs"
      - "tools/audit-markdown-links.test.mjs"
      - "tools/audit-documentation-inventory.mjs"
      - "tools/audit-documentation-inventory.test.mjs"
      - ".github/workflows/documentation-link-integrity.yml"
  push:
    branches:
      - workpass331-project-ordering-unified-20261024
      - operation-omega-hexis-2026-10-24
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.markdown"
      - "tools/audit-markdown-links.mjs"
      - "tools/audit-markdown-links.test.mjs"
      - ".github/workflows/documentation-link-integrity.yml"

permissions:
  contents: read

concurrency:
  group: docs-link-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify Node.js matches repository pin
        run: |
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version | sed 's/^v//')"
          case "$expected" in
            *.*.*) test "$actual" = "$expected" ;;
            *) case "$actual" in "$expected"|"${expected}".*) ;; *) exit 1 ;; esac ;;
          esac
      - name: Run link-auditor regression tests
        run: node --test tools/audit-markdown-links.test.mjs
      - name: Test documentation inventory
        run: npm run test:doc-inventory
      - name: Inventory exact duplicates and inbound links
        run: npm run audit:doc-inventory
      - name: Verify dependency boundaries and transitive server imports
        run: |
          npm --prefix runtime/neuro-kurisu run audit:architecture
          npm --prefix runtime/neuro-kurisu run audit:server-imports
      - name: Check canonical navigation pages
        run: |
          node tools/audit-markdown-links.mjs --strict --files \
            README.md AGENTS.md NEUROCORE_START_HERE.md \
            docs/PROJECT_MAP_AND_ORDERING.md \
            docs/BRANCH_INVENTORY_2026-10-24.md \
            docs/architecture/module-dependency-contracts-ru.md \
            docs/DOCUMENTATION_INVENTORY_AND_ARCHIVE_POLICY_2026-10-24.md \
            docs/INTEGRATION_WORKSPACE.md docs/ARCHITECTURE.md \
            docs/RESEARCH_INTAKE_LEDGER.md
