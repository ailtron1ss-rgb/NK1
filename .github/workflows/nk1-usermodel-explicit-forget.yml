name: NK1 UserModel explicit-forget integrity

on:
  push:
    branches:
      - feature/usermodel-explicit-forget-2026-11-01
  pull_request:
    branches:
      - main
      - workpass70-source
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk1-usermodel-forget-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  explicit-forget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Install runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Verify explicit preference forgetting, restart persistence and replay protection
        working-directory: runtime/neuro-kurisu
        run: npm run test:user-model-explicit-forget
