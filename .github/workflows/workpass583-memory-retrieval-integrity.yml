name: NK1 memory retrieval integrity

on:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/memory/MemoryRetrievalBenchmark.ts"
      - "runtime/neuro-kurisu/src/organism/memory/MemoryRetrievalExperiment.ts"
      - "runtime/neuro-kurisu/tests/memory-retrieval-experiment.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - ".github/workflows/workpass583-memory-retrieval-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-retrieval-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and retrieval integrity regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        working-directory: runtime/neuro-kurisu
        run: npm ci
      - name: Typecheck runtime
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
      - name: Run retrieval dataset integrity regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:memory-retrieval-experiment
