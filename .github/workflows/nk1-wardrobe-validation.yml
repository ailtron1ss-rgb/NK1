name: NK1 modular wardrobe validation

on:
  pull_request:
    paths:
      - "app/src/components/avatar/wardrobe*.ts"
      - "app/src/components/avatar/vrmWardrobeAdapter.ts"
      - "app/src/components/avatar/live2dWardrobeCapability.ts"
      - "app/scripts/wardrobe-*.test.mjs"
      - "app/scripts/live2d-wardrobe-capability.test.mjs"
      - "app/scripts/vrm-wardrobe-adapter.test.mjs"
      - "app/scripts/vrm-wardrobe-pack-loader.test.mjs"
      - "app/package.json"
      - "app/package-lock.json"
      - "CHANGELOG.md"
      - "docs/ASPECT08_MODULAR_WARDROBE_PLAN_RU.md"
      - ".github/workflows/nk1-wardrobe-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk1-wardrobe-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Run wardrobe integrity and renderer adapter tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked app dependencies
        working-directory: app
        run: npm ci
      - name: Run wardrobe contract and renderer tests
        working-directory: app
        run: npm run test:wardrobe
