  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nk1-core-restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-restore-integrity:
    name: WorkPass72 restore and self-improvement boundary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/neuro-kurisu
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts
      - name: Run WorkPass72 restore and guard regressions
        run: npm run test:workpass72:core-integrity
      - name: Run owning subsystem regressions
        run: |
          node --experimental-strip-types tests/big-pass-75-temporal-resolution.mjs
          node --experimental-strip-types tests/canonical-self-agency-authority.mjs
          node --experimental-strip-types tests/p32-causal-self-model.mjs
          node --experimental-strip-types tests/p10-world-model.mjs
          node --experimental-strip-types tests/self-model-evidence-write-gate-workpass315.mjs
      - name: Run live-policy and handoff regressions through the new accessors
        run: |
          node --experimental-strip-types tests/big-pass-308-temporal-policy-closure.mjs
          node --experimental-strip-types tests/big-pass-309-arbitration-consolidation.mjs
          node --experimental-strip-types tests/big-pass-313-longitudinal-divergence.mjs
      - name: Run identity-owner consumers
        run: |
          node --experimental-strip-types tests/big-pass-80-developmental-identity.mjs
          node --experimental-strip-types tests/big-pass-85-self-change-lineage.mjs
          node --experimental-strip-types tests/big-pass-88-value-attribution.mjs
          node --experimental-strip-types tests/big-pass-96-value-evidence-gate.mjs
          node --experimental-strip-types tests/big-pass-163-reality-memory-influence.mjs
          node --experimental-strip-types tests/big-pass-225-228-autonomous-personhood-expansion.mjs
      - name: Run world and temporal-memory owner consumers
        run: |
          node --experimental-strip-types tests/p26-contextual-world.mjs
          node --experimental-strip-types tests/p47-temporal-memory.mjs
          node --experimental-strip-types tests/action-cost-unification-workpass36.mjs
      - name: Run world-model and cadence owner consumers
        run: |
          node --experimental-strip-types tests/big-pass-174-function-reality-and-world-tickets.mjs
          node --experimental-strip-types tests/big-pass-39-cognitive-spine.mjs
          node --experimental-strip-types tests/big-pass-2504-2508-neural-stack.mjs
          node --experimental-strip-types tests/big-pass-265-independent-evaluator.mjs
          node --experimental-strip-types tests/big-pass-266-hidden-generalization.mjs
          node --experimental-strip-types tests/p2906-bounded-recurrent-ablation.mjs
          node --experimental-strip-types tests/big-pass-50-cognitive-execution.mjs
          node --experimental-strip-types tests/big-pass-89-cognitive-substrate.mjs
      - name: Run developmental/social owner consumers
        run: |
          node --experimental-strip-types tests/big-pass-288-social-consolidation.mjs
          node --experimental-strip-types tests/big-pass-336-project-causal-ownership.mjs
          node --experimental-strip-types tests/big-pass-36-budget-evidence.mjs
          node --experimental-strip-types tests/big-pass-37-spine.mjs
          node --experimental-strip-types tests/p2898-correction-aware-capsules.mjs
          node --experimental-strip-types tests/p54-long-horizon-evidence.mjs
          node --experimental-strip-types tests/p67-attractor-synergy.mjs
          node --experimental-strip-types tests/p67-value-self-change-loop.mjs
          node --experimental-strip-types tests/micro-dream-associations-workpass317.mjs
          node --experimental-strip-types tests/p56-integrated-developmental-mind.mjs
          node --experimental-strip-types tests/big-pass-126-integrated-life-trajectory.mjs
          node --experimental-strip-types tests/big-pass-155-verified-autonomous-life.mjs
          node --experimental-strip-types tests/big-pass-364-device-evidence-boundary.mjs
          node --experimental-strip-types tests/p37-semantic-sensorium.mjs
          node --experimental-strip-types tests/p58-p60-integrated-kernel.mjs
          node --experimental-strip-types tests/p66-p68-integration.mjs
          node --experimental-strip-types tests/big-pass-52-memory-fabric.mjs
          node --experimental-strip-types tests/p46-prediction-ledger.mjs
          node --experimental-strip-types tests/p2870-verified-synthetic-trajectory-gate.mjs
          node --experimental-strip-types tests/big-pass-46-multi-project-models.mjs
          node --experimental-strip-types tests/big-pass-40-cognitive-spine.mjs
          node --experimental-strip-types tests/big-pass-380-evidence-and-retired-receipts.mjs
          node --experimental-strip-types tests/evidence-hash-unification-workpass39.mjs
          node --experimental-strip-types tests/big-pass-38-autonomous-spine.mjs
          node --experimental-strip-types tests/big-pass-179-consciousness-battery.mjs
          node --experimental-strip-types tests/big-pass-178-compound-adversarial.mjs
          node --experimental-strip-types tests/cognitive-integrity-gate.mjs
      - name: Run decision/learning owner consumers
        run: |
          node --experimental-strip-types tests/big-pass-49-subsystem-extraction.mjs
          node --experimental-strip-types tests/big-pass-206-world-agency-learning.mjs
          node --experimental-strip-types tests/big-pass-38-autonomous-spine.mjs
      - name: Run remaining pure-spread owner consumers
        run: |
          node --experimental-strip-types tests/big-pass-250-258-neuro-digital-superupdate.mjs
          node --experimental-strip-types tests/persistence-projection-governor.mjs
      - name: Run learning/persistence/continuity owner consumers
        run: |
          node --experimental-strip-types tests/p20-temporal-continuity.mjs
          node --experimental-strip-types tests/p29-learning-governance.mjs
          node --experimental-strip-types tests/p29-integration.mjs
          node --experimental-strip-types tests/scientific-method-verification-gate-workpass595.mjs
      - name: Typecheck runtime
        run: npm run typecheck
