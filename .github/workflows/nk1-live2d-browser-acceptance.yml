name: NK1 Live2D browser visual acceptance

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "app/src/components/AvatarStage.tsx"
      - "app/src/components/avatar/**"
      - "app/public/live2d/**"
      - "app/scripts/live2d-browser-acceptance.mjs"
      - "app/scripts/sync-canonical-public-assets.mjs"
      - "app/package.json"
      - "app/package-lock.json"
      - "runtime/neuro-kurisu/public/live2d/**"
      - ".github/workflows/nk1-live2d-browser-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: nk1-live2d-browser-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  live2d-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked app dependencies
        run: npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: Install headless Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Build app and hydrate canonical Live2D assets
        run: npm --prefix app run build:dev
      - name: Start production preview server
        working-directory: app
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 8081 > "$RUNNER_TEMP/live2d-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/live2d-preview.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:8081/live2d/viewer.html?profile=quality" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/live2d-preview.log"
          exit 1
      - name: Run WebGL Live2D, expression, motion, stale/cancel and disposal acceptance
        working-directory: app
        env:
          LIVE2D_BROWSER_TIMEOUT_MS: "60000"
        run: node scripts/live2d-browser-acceptance.mjs http://127.0.0.1:8081 "$RUNNER_TEMP/nk1-live2d"
      - name: Upload screenshots and browser acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nk1-live2d-browser-acceptance
          path: |
            ${{ runner.temp }}/nk1-live2d/
            ${{ runner.temp }}/live2d-preview.log
          if-no-files-found: warn
          retention-days: 14
