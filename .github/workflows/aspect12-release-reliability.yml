name: NK1 Aspect 12 release reliability

on:
  push:
    branches: [aspect12-release-reliability-2026-10-30]
    paths:
      - "tools/aspect12-release-readiness.mjs"
      - "tools/aspect12-release-readiness.test.mjs"
      - "app/scripts/aspect12-browser-smoke.mjs"
      - "app/scripts/aspect12-browser-smoke.test.mjs"
      - "app/scripts/aspect12-research-status-fixture.mjs"
      - "CHANGELOG.md"
      - "docs/ASPECT12_RELEASE_RELIABILITY_PLAN_RU.md"
      - ".github/workflows/aspect12-release-reliability.yml"
      - "package.json"
      - "app/package.json"
      - "app/package-lock.json"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - "contracts/RELEASE_LICENSE_REVIEW.json"
      - "SUPER_VERSION.json"
      - ".nvmrc"
  pull_request:
    branches: [main, rebuild, workpass70-source, work/nk1-autonomous-motor-control-2026-10-30]
    paths:
      - "tools/aspect12-release-readiness.mjs"
      - "tools/aspect12-release-readiness.test.mjs"
      - "app/scripts/aspect12-browser-smoke.mjs"
      - "app/scripts/aspect12-browser-smoke.test.mjs"
      - "docs/ASPECT12_RELEASE_RELIABILITY_PLAN_RU.md"
      - ".github/workflows/aspect12-release-reliability.yml"
      - "package.json"
      - "app/package.json"
      - "app/package-lock.json"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - "contracts/RELEASE_LICENSE_REVIEW.json"
      - "SUPER_VERSION.json"
      - ".nvmrc"
  workflow_dispatch:
    inputs:
      require_release_ready:
        description: "Fail unless all human license reviews are explicitly approved"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nk1-aspect12-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  structural-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Assert exact Node runtime pin
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version | sed 's/^v//')"
          case "$expected" in
            *.*.*) test "$actual" = "$expected" ;;
            *) case "$actual" in "$expected"|"$expected".*) ;; *) echo "Node mismatch: expected $expected, got $actual" >&2; exit 1 ;; esac ;;
          esac
      - name: Run Aspect 12 readiness audit
        run: node tools/aspect12-release-readiness.mjs
      - name: Test Aspect 12 readiness contract
        run: node --test tools/aspect12-release-readiness.test.mjs
      - name: Run existing CI configuration audit
        run: npm run audit:ci-reliability
      - name: Run existing release metadata contract
        run: npm run test:release-metadata-contract

  app-runtime-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies reproducibly
        run: npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: Install runtime dependencies reproducibly
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: App script and UI regressions
        run: npm --prefix app test
      - name: App typecheck
        run: npm --prefix app run typecheck
      - name: App production-like development build
        run: npm --prefix app run build:dev
      - name: Install Chromium for browser E2E smoke
        run: npx --prefix app playwright install --with-deps chromium
      - name: Start real NK1 runtime for browser smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nk1-aspect12-state"
          PORT=3310 HOST=127.0.0.1 STATE_DIR="$RUNNER_TEMP/nk1-aspect12-state" \
            node --experimental-strip-types runtime/neuro-kurisu/src/server/server.mjs \
            > "$RUNNER_TEMP/nk1-runtime.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/nk1-runtime.pid"
          for attempt in $(seq 1 180); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/nk1-runtime.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/nk1-runtime.log"
              exit 1
            fi
            if curl --silent --show-error --fail http://127.0.0.1:3310/health > "$RUNNER_TEMP/nk1-health.json"; then
              if node -e 'const h=require(process.argv[1]); process.exit(h.ok && h.ready ? 0 : 1)' "$RUNNER_TEMP/nk1-health.json"; then
                echo "NK1 runtime ready on 3310"
                exit 0
              fi
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/nk1-runtime.log"
          echo "NK1 runtime did not become ready" >&2
          exit 1
      - name: Start isolated Research Bridge status fixture
        shell: bash
        run: |
          set -euo pipefail
          PORT=8765 HOST=127.0.0.1 node app/scripts/aspect12-research-status-fixture.mjs \
            > "$RUNNER_TEMP/nk1-research-fixture.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/nk1-research-fixture.pid"
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8765/api/research/status >/dev/null; then
              echo "Research status fixture ready on 8765 (no probes enabled)"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/nk1-research-fixture.log"
          exit 1
      - name: Desktop/mobile browser smoke and performance capture
        run: node app/scripts/aspect12-browser-smoke.mjs
      - name: Upload browser smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nk1-aspect12-browser-smoke-${{ github.sha }}
          path: artifacts/aspect12-browser-smoke.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Stop browser smoke services
        if: always()
        shell: bash
        run: |
          for pid_file in "$RUNNER_TEMP/nk1-research-fixture.pid" "$RUNNER_TEMP/nk1-runtime.pid"; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
          if [ -f "$RUNNER_TEMP/nk1-runtime.log" ]; then cat "$RUNNER_TEMP/nk1-runtime.log"; fi
          if [ -f "$RUNNER_TEMP/nk1-research-fixture.log" ]; then cat "$RUNNER_TEMP/nk1-research-fixture.log"; fi
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: Runtime organism smoke
        run: npm --prefix runtime/neuro-kurisu run test:smoke
      - name: Avatar and speech regressions
        run: npm --prefix app run test:embodiment-timeline && npm --prefix app run test:avatar-motor-intent

  release-clearance:
    if: always()
    needs: [structural-and-contract, app-runtime-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Report exact-SHA release clearance
        id: report
        shell: bash
        run: |
          set -euo pipefail
          node tools/aspect12-release-readiness.mjs > aspect12-readiness.json
          node -e 'const r=require("./aspect12-readiness.json"); console.log("source SHA:", process.env.GITHUB_SHA); console.log("status:",r.status); console.log("release clearance:",r.releaseClearance); console.log("pending human reviews:",r.summary.pendingLicenseReviews);'
          if [ "${{ inputs.require_release_ready }}" = "true" ]; then
            node tools/aspect12-release-readiness.mjs --require-release-ready
          fi
          if [ "${{ needs.structural-and-contract.result }}" != "success" ] || [ "${{ needs.app-runtime-validation.result }}" != "success" ]; then
            echo "Validation jobs did not both succeed." >&2
            exit 1
          fi
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nk1-aspect12-readiness-${{ github.sha }}
          path: aspect12-readiness.json
          if-no-files-found: ignore
          retention-days: 30
