name: WorkPass72 Inspect AI evidence evaluation

on:
  push:
    paths:
      - "runtime/neuro-kurisu/src/organism/system/IndependentEvaluationEvidence.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/src/server/server.mjs"
      - "runtime/neuro-kurisu/tests/workpass72-*.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "evaluation/inspect_ai/**"
      - ".github/workflows/workpass72-inspect-ai-evidence.yml"
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/system/IndependentEvaluationEvidence.ts"
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/src/server/server.mjs"
      - "runtime/neuro-kurisu/tests/workpass72-*.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "evaluation/inspect_ai/**"
      - ".github/workflows/workpass72-inspect-ai-evidence.yml"

permissions:
  contents: read

concurrency:
  group: nk1-workpass72
  cancel-in-progress: true

jobs:
  independent-evidence-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: evaluation/inspect_ai/requirements.txt
      - name: Check sanitized NK1 evidence export
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/workpass72-independent-evaluation-export.mjs evaluation/inspect_ai/evidence.ci.json
      - name: Verify bundle digest and export Inspect dataset
        run: python evaluation/inspect_ai/nk1_evidence.py evaluation/inspect_ai/evidence.ci.json --output evaluation/inspect_ai/samples.ci.jsonl
      - name: Test independent scorer and tamper rejection
        run: python -m unittest discover -s evaluation/inspect_ai/tests -v
      - name: Install pinned Inspect AI
        run: python -m pip install --disable-pip-version-check --no-input -r evaluation/inspect_ai/requirements.txt
      - name: Run Inspect AI task without external model calls
        env:
          NK1_INSPECT_SAMPLES: evaluation/inspect_ai/samples.ci.jsonl
        run: inspect eval evaluation/inspect_ai/nk1_inspect_task.py --model mockllm/model
      - name: Check runtime route contract
        working-directory: runtime/neuro-kurisu
        run: node tests/workpass72-inspect-evidence-route.mjs
      - name: Typecheck canonical runtime
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
