name: Publish WorkPass70 hotfix release

on:
  workflow_run:
    workflows: ["WorkPass71 validation"]
    branches: [workpass70-source]
    types: [completed]

permissions:
  contents: write

jobs:
  package-and-publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated source branch
        uses: actions/checkout@v7
        with:
          ref: workpass70-source
          fetch-depth: 0
      - name: Guard against publishing a stale validation run
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          LATEST_SHA="$(git ls-remote origin refs/heads/workpass70-source | cut -f1)"
          if [ -z "$LATEST_SHA" ]; then echo "Could not resolve current source branch"; exit 1; fi
          if [ "$LATEST_SHA" = "$VALIDATED_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Validated commit is the current source branch tip: $LATEST_SHA"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale run $VALIDATED_SHA; current source tip is $LATEST_SHA"
          fi
      - name: Set up pinned Node.js for release provenance audit
        if: steps.guard.outputs.publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify selected Node.js matches repository pin
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version | sed 's/^v//')"
          case "$expected" in
            *.*.*) test "$actual" = "$expected" ;;
            *) case "$actual" in "$expected" | "$expected".*) ;; *) echo "Node version $actual does not match .nvmrc pin $expected" >&2; exit 1 ;; esac ;;
          esac
      - name: Regenerate SBOM and require human license approval before packaging
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run test:provenance-current
          npm run audit:release-license-readiness
      - name: Package tracked source and verify archive
        id: package_artifacts
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="workpass70-hotfix1-2026-10-19"
          ZIP="Neuro_Kurisu_WORKPASS70_HOTFIX1_2026-10-19.zip"
          REPORT="WORKPASS70_HOTFIX_1_REPORT_RU.md"
          if [ ! -f "$REPORT" ]; then echo "Missing report: $REPORT"; exit 1; fi
          API_URL="${GITHUB_API_URL:-https://api.github.com}"
          CHECK_FILE="$RUNNER_TEMP/release-tag-check.json"
          HTTP_CODE="$(curl --silent --show-error --output "$CHECK_FILE" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/ailtron1ss-rgb/NK1/releases/tags/$TAG")"
          case "$HTTP_CODE" in
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already exists; safely skipping without overwriting it."
              exit 0
              ;;
            404)
              echo "Release tag $TAG does not exist; safe to continue."
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unable to verify release tag $TAG (HTTP $HTTP_CODE); refusing to publish."
              cat "$CHECK_FILE"
              exit 1
              ;;
          esac
          git archive --format=zip --prefix="Neuro_Kurisu_WORKPASS70_HOTFIX1_2026-10-19/" HEAD > "$RUNNER_TEMP/$ZIP"
          unzip -t "$RUNNER_TEMP/$ZIP" | tail -1
          cp "$REPORT" "$RUNNER_TEMP/$REPORT"
          cd "$RUNNER_TEMP"
          sha256sum "$ZIP" "$REPORT" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh "$ZIP" "$REPORT" SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create release and upload verified artifacts
        if: steps.guard.outputs.publish == 'true' && steps.package_artifacts.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="workpass70-hotfix1-2026-10-19"
          gh release create "$TAG" \
            "$RUNNER_TEMP/Neuro_Kurisu_WORKPASS70_HOTFIX1_2026-10-19.zip" \
            "$RUNNER_TEMP/WORKPASS70_HOTFIX_1_REPORT_RU.md" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --repo ailtron1ss-rgb/NK1 \
            --title "NeuroCore WorkPass70 Hotfix 1 (2026-10-19)" \
            --notes "Validated implementation hotfix. Fixes UTF-16/grapheme speech timeline offsets and a continuum-memory timescale precedence defect. This is not a production-approved release; see attached report for test evidence and remaining gates." \
            --prerelease
