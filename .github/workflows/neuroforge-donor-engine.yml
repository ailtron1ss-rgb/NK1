name: NeuroForge donor capability engine

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - ".github/workflows/neuroforge-donor-engine.yml"
      - "runtime/neuro-kurisu/src/organism/research/neuroforge/**"
      - "runtime/neuro-kurisu/scripts/neuroforge.mjs"
      - "runtime/neuro-kurisu/tests/neuroforge-engine.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/docs/NEUROFORGE_DONOR_INTAKE_RU.md"
      - "runtime/neuro-kurisu/docs/NEUROFORGE_COLLECTION_REVIEW_2026-11-17_RU.md"
  push:
    branches:
      - workpass70-source
      - aspect/neuroforge-donor-capability-engine-20261116
    paths:
      - ".github/workflows/neuroforge-donor-engine.yml"
      - "runtime/neuro-kurisu/src/organism/research/neuroforge/**"
      - "runtime/neuro-kurisu/scripts/neuroforge.mjs"
      - "runtime/neuro-kurisu/tests/neuroforge-engine.mjs"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/docs/NEUROFORGE_DONOR_INTAKE_RU.md"
      - "runtime/neuro-kurisu/docs/NEUROFORGE_COLLECTION_REVIEW_2026-11-17_RU.md"

permissions:
  contents: read

concurrency:
  group: neuroforge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  donor-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: NeuroForge behavior tests
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/neuroforge-engine.mjs
