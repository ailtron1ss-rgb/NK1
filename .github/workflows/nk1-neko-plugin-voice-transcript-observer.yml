name: NK1 N.E.K.O. final ASR transcript observer

on:
  push:
    branches:
      - "aspect/neko-voice-transcript-observer-rebased-20261104"
    paths:
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/integration/neko/NekoPluginVoiceTranscriptBridge.ts"
      - "runtime/neuro-kurisu/tests/neko-plugin-voice-*.mjs"
      - "runtime/neuro-kurisu/package.json"
      - ".github/workflows/nk1-neko-plugin-voice-transcript-observer.yml"
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts"
      - "runtime/neuro-kurisu/src/organism/integration/neko/NekoPluginVoiceTranscriptBridge.ts"
      - "runtime/neuro-kurisu/tests/neko-plugin-voice-*.mjs"
      - "runtime/neuro-kurisu/package.json"
      - ".github/workflows/nk1-neko-plugin-voice-transcript-observer.yml"

permissions:
  contents: read

concurrency:
  group: nk1-neko-plugin-voice-transcript-observer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  voice-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked runtime dependencies
        working-directory: runtime/neuro-kurisu
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Consent-gated voice observer contract
        working-directory: runtime/neuro-kurisu
        run: npm run test:neko-plugin-voice-transcript-bridge
      - name: Actual ASR call-site wiring
        working-directory: runtime/neuro-kurisu
        run: npm run test:neko-plugin-voice-runtime-wiring
      - name: Existing plugin gateway contract
        working-directory: runtime/neuro-kurisu
        run: npm run test:neko-plugin-gateway-adapter
      - name: Existing N.E.K.O. event bridge contract
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/neko-plugin-event-bridge.mjs
      - name: Real ActionGateway integration
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/neko-plugin-gateway-real-action-gateway.mjs
      - name: Tool-input contract regression
        working-directory: runtime/neuro-kurisu
        run: npm run test:tool-input-contracts-workpass624
      - name: Runtime typecheck
        if: always()
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
