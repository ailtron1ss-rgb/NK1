name: NK1 WorkPass82 LongMemEval adapter

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/memory/LongMemEvalAdapter.ts"
      - "runtime/neuro-kurisu/tests/longmemeval-memory-adapter.mjs"
      - ".github/workflows/workpass82-longmemeval-adapter.yml"

permissions:
  contents: read

concurrency:
  group: nk1-longmemeval-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  longmemeval-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: LongMemEval adapter regression
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/longmemeval-memory-adapter.mjs
