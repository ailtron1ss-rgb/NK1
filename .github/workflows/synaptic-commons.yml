name: NK1 Synaptic Commons

on:
  push:
    branches: [aspect/synaptic-commons-independent-20261117]
    paths:
      - 'runtime/neuro-kurisu/src/organism/learning/SynapticCommons.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts'
      - 'runtime/neuro-kurisu/src/server/server.mjs'
      - 'runtime/neuro-kurisu/tests/synaptic-commons-*.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/synaptic-commons.yml'
  pull_request:
    branches: [workpass70-source]
    paths:
      - 'runtime/neuro-kurisu/src/organism/learning/SynapticCommons.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts'
      - 'runtime/neuro-kurisu/src/server/server.mjs'
      - 'runtime/neuro-kurisu/tests/synaptic-commons-*.mjs'
      - 'runtime/neuro-kurisu/package.json'
      - '.github/workflows/synaptic-commons.yml'

permissions:
  contents: read

concurrency:
  group: nk1-synaptic-commons-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  synaptic-commons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install runtime lockfile
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Synaptic Commons contract and privacy gates
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/synaptic-commons-contract.mjs
      - name: Synaptic Commons durable runtime integration
        working-directory: runtime/neuro-kurisu
        run: node --experimental-strip-types tests/synaptic-commons-runtime-integration.mjs
      - name: Synaptic Commons authenticated HTTP routes
        working-directory: runtime/neuro-kurisu
        run: node tests/synaptic-commons-http-route.mjs
      - name: Full runtime typecheck
        working-directory: runtime/neuro-kurisu
        run: npm run typecheck
