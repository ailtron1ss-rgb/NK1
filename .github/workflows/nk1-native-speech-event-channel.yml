name: NK1 native speech provider event channel

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/body/NativeSpeechEventChannel.ts"
      - "runtime/neuro-kurisu/tests/native-speech-event-channel-workpass628.mjs"
      - "runtime/neuro-kurisu/tests/native-speech-host-router-workpass629.mjs"
      - "runtime/neuro-kurisu/package.json"
      - ".github/workflows/nk1-native-speech-event-channel.yml"
      - "README.md"
      - "NEUROCORE_START_HERE.md"
      - "docs/NK1_DAILY_ENGINEERING_CYCLE_2026-11-23.md"

permissions:
  contents: read

concurrency:
  group: nk1-native-speech-event-channel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-speech-event-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: Native provider event channel contract
        run: npm --prefix runtime/neuro-kurisu run test:workpass628:native-speech-events
      - name: Native speech host router contract
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/native-speech-host-router-workpass629.mjs
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
