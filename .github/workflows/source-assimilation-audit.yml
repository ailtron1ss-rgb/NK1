name: NK1 source assimilation contracts

on:
  push:
    branches:
      - workpass70-source
      - research/source-assimilation-20261113
    paths:
      - '.github/workflows/source-assimilation-audit.yml'
      - 'engineering-os/source-assimilation.v1.json.gz'
      - 'engineering-os/source-assimilation-stage-overrides.v1.json'
      - 'tools/source-assimilation-audit.*'
      - 'package.json'
      - 'docs/SOURCE_ASSIMILATION_REGISTER_2026-11-13_RU.md'
      - 'runtime/neuro-kurisu/package.json'
      - 'runtime/neuro-kurisu/scripts/audit-source-assimilation.mjs'
      - 'runtime/neuro-kurisu/src/organism/integration/local/OpenAICompatibleLocalChatProvider.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/P23LocalModelSkillRevisionGenerator.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/P23LearningEngine.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/SkillRevisionPlan.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/GepaReflectiveCandidateGenerator.ts'
      - 'runtime/neuro-kurisu/tests/p23-revision-plan-holdout-isolation.mjs'
      - 'runtime/neuro-kurisu/tests/gepa-reflective-candidate-generator.mjs'
      - 'runtime/neuro-kurisu/tests/local-chat-provider-workpass40.mjs'
      - 'runtime/neuro-kurisu/tests/p23-local-model-skill-revision-generator.mjs'
      - 'runtime/neuro-kurisu/tests/p23-local-model-skill-revision-integration.mjs'
      - 'runtime/neuro-kurisu/tests/source-assimilation-audit.mjs'
      - 'runtime/neuro-kurisu/src/organism/integration/**'
      - 'runtime/neuro-kurisu/tests/integration/**'
      - 'runtime/neuro-kurisu/tests/mem0-*.mjs'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismCore.ts'
      - 'runtime/neuro-kurisu/src/organism/core/MemorySubsystemRuntime.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismSystemFabric.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts'
  pull_request:
    branches:
      - workpass70-source
    paths:
      - '.github/workflows/source-assimilation-audit.yml'
      - 'engineering-os/source-assimilation.v1.json.gz'
      - 'engineering-os/source-assimilation-stage-overrides.v1.json'
      - 'engineering-os/source-assimilation-stage-overrides.v1.json'
      - 'tools/source-assimilation-audit.*'
      - 'package.json'
      - 'docs/SOURCE_ASSIMILATION_REGISTER_2026-11-13_RU.md'
      - 'runtime/neuro-kurisu/package.json'
      - 'runtime/neuro-kurisu/scripts/audit-source-assimilation.mjs'
      - 'runtime/neuro-kurisu/src/organism/integration/local/OpenAICompatibleLocalChatProvider.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/P23LocalModelSkillRevisionGenerator.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/P23LearningEngine.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/SkillRevisionPlan.ts'
      - 'runtime/neuro-kurisu/src/organism/learning/GepaReflectiveCandidateGenerator.ts'
      - 'runtime/neuro-kurisu/tests/p23-revision-plan-holdout-isolation.mjs'
      - 'runtime/neuro-kurisu/tests/gepa-reflective-candidate-generator.mjs'
      - 'runtime/neuro-kurisu/tests/local-chat-provider-workpass40.mjs'
      - 'runtime/neuro-kurisu/tests/p23-local-model-skill-revision-generator.mjs'
      - 'runtime/neuro-kurisu/tests/p23-local-model-skill-revision-integration.mjs'
      - 'runtime/neuro-kurisu/tests/source-assimilation-audit.mjs'
      - 'runtime/neuro-kurisu/src/organism/integration/**'
      - 'runtime/neuro-kurisu/tests/integration/**'
      - 'runtime/neuro-kurisu/tests/mem0-*.mjs'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismCore.ts'
      - 'runtime/neuro-kurisu/src/organism/core/MemorySubsystemRuntime.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismSystemFabric.ts'
      - 'runtime/neuro-kurisu/src/organism/core/OrganismRuntime.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-assimilation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate the evidence-tracked external source register
        run: |
          npm run sources:validate
          npm run sources:report
          npm run test:sources:registry
      - name: Run static source-to-runtime assimilation audit
        working-directory: runtime/neuro-kurisu
        run: node scripts/audit-source-assimilation.mjs
      - name: Test the audit detects disconnected adapters and incomplete source registers
        working-directory: runtime/neuro-kurisu
        run: node tests/source-assimilation-audit.mjs
      - name: Run llama.cpp provider and P23 constrained-revision contracts
        working-directory: runtime/neuro-kurisu
        run: |
          node --experimental-strip-types tests/local-chat-provider-workpass40.mjs
          node --experimental-strip-types tests/p23-local-model-skill-revision-generator.mjs
          node --experimental-strip-types tests/p23-local-model-skill-revision-integration.mjs
      - name: Run holdout-isolation and optional GEPA adapter contracts
        working-directory: runtime/neuro-kurisu
        run: |
          node --experimental-strip-types tests/p23-revision-plan-holdout-isolation.mjs
          node --experimental-strip-types tests/gepa-reflective-candidate-generator.mjs
      - name: Run Hexis belief and canonical provenance contracts
        working-directory: runtime/neuro-kurisu
        run: |
          node --experimental-strip-types tests/integration/hexis-adaptation.mjs
          node --experimental-strip-types tests/integration/hexis-canonical-evidence-bridge.mjs
      - name: Run Letta, Lumina and Will adaptation contracts
        working-directory: runtime/neuro-kurisu
        run: |
          node --experimental-strip-types tests/integration/letta-governance-adaptation.mjs
          node --experimental-strip-types tests/integration/lumina-adaptation.mjs
          node --experimental-strip-types tests/integration/will-integration-bridge.mjs
      - name: Run Mem0 opt-in, platform and OSS contracts
        working-directory: runtime/neuro-kurisu
        run: |
          node --experimental-strip-types tests/mem0-runtime-wiring.mjs
          node --experimental-strip-types tests/mem0-platform-adapter-workpass1.mjs
          node --experimental-strip-types tests/mem0-oss-adapter-workpass2.mjs
