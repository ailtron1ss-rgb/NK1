name: NK1 autonomous social initiative integrity
on:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/system/AutonomousSocialInitiativeEngine.ts"
      - "runtime/neuro-kurisu/tests/autonomous-dialogue-workpass48.mjs"
      - "runtime/neuro-kurisu/tests/autonomous-social-initiative-integrity.mjs"
      - "runtime/neuro-kurisu/scripts/typecheck-runtime.mjs"
      - ".github/workflows/autonomous-social-initiative-integrity.yml"
  push:
    branches:
      - "aspect/proactive-initiative-integrity-20261104"
    paths:
      - "runtime/neuro-kurisu/src/organism/system/AutonomousSocialInitiativeEngine.ts"
      - "runtime/neuro-kurisu/tests/autonomous-dialogue-workpass48.mjs"
      - "runtime/neuro-kurisu/tests/autonomous-social-initiative-integrity.mjs"
      - ".github/workflows/autonomous-social-initiative-integrity.yml"
permissions:
  contents: read
jobs:
  social-initiative-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Record exact tested commit
        run: echo "TESTED_COMMIT=$(git rev-parse HEAD)"
      - name: Run existing two-phase initiative and privacy regressions
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/autonomous-dialogue-workpass48.mjs
      - name: Run hostile restore and pending TTL regressions
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/autonomous-social-initiative-integrity.mjs
      - name: Run runtime typecheck
        run: npm run typecheck --prefix runtime/neuro-kurisu
