name: Clean install, build and start

on:
  push:
    branches:
      - fix/unified-substrate-runtime-wiring-rebased-2026-10-25
    paths:
      - '.nvmrc'
      - '.python-version'
      - 'package.json'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'app/**'
      - 'runtime/neuro-kurisu/package.json'
      - 'runtime/neuro-kurisu/package-lock.json'
      - 'runtime/neuro-kurisu/src/server/**'
      - 'runtime/neuro-kurisu/src/organism/**'
      - 'tools/super-install.mjs'
      - 'tools/node-runtime-contract.mjs'
      - 'tools/super-start.mjs'
      - 'tools/super-dev.mjs'
      - 'tools/super-gateway.mjs'
      - 'tools/super-start.test.mjs'
      - 'tools/super-gateway.test.mjs'
      - '.github/workflows/clean-install-build-start.yml'
  pull_request:
    paths:
      - '.nvmrc'
      - '.python-version'
      - 'package.json'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'app/**'
      - 'runtime/neuro-kurisu/package.json'
      - 'runtime/neuro-kurisu/package-lock.json'
      - 'runtime/neuro-kurisu/src/server/**'
      - 'runtime/neuro-kurisu/src/organism/**'
      - 'tools/super-install.mjs'
      - 'tools/node-runtime-contract.mjs'
      - 'tools/super-start.mjs'
      - 'tools/super-dev.mjs'
      - 'tools/super-gateway.mjs'
      - 'tools/super-start.test.mjs'
      - 'tools/super-gateway.test.mjs'
      - '.github/workflows/clean-install-build-start.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install-build-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Use pinned Node runtime
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Use pinned Python runtime
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Validate installer, gateway and launcher contracts
        run: npm run test:super-install && npm run test:super-gateway && npm run test:super-start

      - name: Install app and runtime dependencies from lockfiles
        run: npm run install:all

      - name: Build production UI
        run: npm --prefix app run build

      - name: Start all services and verify the ready stack
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/nk1-super-start.log"
          HEALTH="$RUNNER_TEMP/nk1-super-health.json"
          UI="$RUNNER_TEMP/nk1-super-ui.html"
          RUNTIME="$RUNNER_TEMP/nk1-runtime-health.json"
          RESEARCH="$RUNNER_TEMP/nk1-research-status.json"
          node tools/super-start.mjs >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill -TERM "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 180); do
            if curl -fsS --max-time 4 http://127.0.0.1:8080/health -o "$HEALTH"; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [[ "$READY" -ne 1 ]]; then
            echo "Stack did not become ready in 360 seconds."
            cat "$LOG"
            cat "$HEALTH" 2>/dev/null || true
            exit 1
          fi

          curl -fsS --max-time 5 http://127.0.0.1:8080/ -o "$UI"
          curl -fsS --max-time 5 http://127.0.0.1:8080/api/organism/status-lite -o "$RUNTIME"
          curl -fsS --max-time 5 http://127.0.0.1:8080/api/research/status -o "$RESEARCH"

          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const health = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const runtime = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const research = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
            const ui = fs.readFileSync(process.argv[4], "utf8");
            assert.equal(health.ok, true, "gateway must report all required services ready");
            for (const name of ["runtime", "research", "ui"]) {
              assert.equal(health.dependencies[name].ok, true, name + " service must be ready");
            }
            assert.equal(runtime.ok, true, "runtime API must respond through the gateway");
            assert.equal(research.ok, true, "research status must respond through the gateway");
            assert.ok(ui.trim().length > 0, "production UI must be served through the gateway");
            console.log(JSON.stringify({ stackReady: health.ok, dependencies: health.dependencies, runtimeReady: runtime.ready, researchService: "research-bridge", uiBytes: ui.length }));
          ' "$HEALTH" "$RUNTIME" "$RESEARCH" "$UI"

          cat "$LOG"
