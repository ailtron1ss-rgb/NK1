name: NK1 Unified organism runtime

on:
  push:
    branches: [workpass70-source, aspect/p2702-proxy-restore-guard-20261119]
    paths:
      - "runtime/neuro-kurisu/src/organism/core/**"
      - "runtime/neuro-kurisu/src/organism/system/**"
      - "runtime/neuro-kurisu/src/organism/cognition/**"
      - "runtime/neuro-kurisu/src/organism/world/**"
      - "runtime/neuro-kurisu/src/organism/research/**"
      - "runtime/neuro-kurisu/src/organism/integration/hexis/**"
      - "runtime/neuro-kurisu/src/server/server.mjs"
      - "runtime/neuro-kurisu/tests/integration/**"
      - "app/src/components/HexisControlConsole.tsx"
      - "app/src/neuro-kurisu/api.ts"
      - "runtime/neuro-kurisu/tests/**"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - "package.json"
      - "tools/audit-runtime-test-coverage.mjs"
      - "tools/audit-runtime-test-coverage.test.mjs"
      - ".github/workflows/nk1-unified-organism-runtime.yml"
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/core/**"
      - "runtime/neuro-kurisu/src/organism/system/**"
      - "runtime/neuro-kurisu/src/organism/cognition/**"
      - "runtime/neuro-kurisu/src/organism/world/**"
      - "runtime/neuro-kurisu/src/organism/research/**"
      - "runtime/neuro-kurisu/tests/**"
      - "runtime/neuro-kurisu/package.json"
      - "runtime/neuro-kurisu/package-lock.json"
      - "package.json"
      - "tools/audit-runtime-test-coverage.mjs"
      - "tools/audit-runtime-test-coverage.test.mjs"
      - ".github/workflows/nk1-unified-organism-runtime.yml"

permissions:
  contents: read

concurrency:
  group: nk1-unified-organism-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unified-organism:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/neuro-kurisu/package-lock.json
      - name: Runtime test registry duplicate-invocation audit
        run: npm run test:runtime-test-coverage-audit && node tools/audit-runtime-test-coverage.mjs
      - name: Install locked runtime dependencies
        run: npm ci --prefix runtime/neuro-kurisu --ignore-scripts --no-audit --no-fund
      - name: P25 Adaptive Synaptic Matrix regression contract
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/p25-adaptive-synaptic-matrix.mjs
      - name: P25 real runtime adapter integration
        run: npm --prefix runtime/neuro-kurisu run test:p25:adaptive-synaptic-matrix:runtime
      - name: Runtime typecheck
        run: npm --prefix runtime/neuro-kurisu run typecheck
      - name: OmeStro idea 10 — structural discovery and holdout verification
        run: |
          node --experimental-strip-types runtime/neuro-kurisu/tests/idea10-mechanism-serendipity.mjs
          node --experimental-strip-types runtime/neuro-kurisu/tests/idea10-mechanism-runtime-intake.mjs
          node --experimental-strip-types runtime/neuro-kurisu/tests/idea10-mechanism-symmetry.mjs
          node --experimental-strip-types runtime/neuro-kurisu/tests/idea10-scientific-project-verification.mjs
          node --experimental-strip-types runtime/neuro-kurisu/tests/integration/hexis-hmx-export-contract.mjs
          node --experimental-strip-types runtime/neuro-kurisu/tests/integration/hexis-hmx-export-route.mjs
      - name: Unified cognitive cycle and boundary
        run: npm --prefix runtime/neuro-kurisu run test:workpass287:cognitive-cycle && npm --prefix runtime/neuro-kurisu run test:cognitive-cycle-boundary-runtime-wiring
      - name: Active information learning and exact action-outcome attribution
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/p2675-active-information-outcome-attribution.mjs && npm --prefix runtime/neuro-kurisu run test:p2675:information
      - name: Cognitive resource economy and Will voluntary attention
        run: npm --prefix runtime/neuro-kurisu run test:cognitive-resource-economy && npm --prefix runtime/neuro-kurisu run test:will:voluntary-attention-budget
      - name: Cooperative autonomous cycle batches and cancellation
        run: npm --prefix runtime/neuro-kurisu run test:autonomy
      - name: Autonomous runtime cadence and silence continuity
        run: npm --prefix runtime/neuro-kurisu run test:big-pass-224
      - name: Runtime-owned cognitive spine cadence and restart persistence
        run: npm --prefix runtime/neuro-kurisu run test:workpass637:cognitive-spine-runtime
      - name: N.E.K.O. BM25 anti-repeat for proactive initiative selection
        run: npm --prefix runtime/neuro-kurisu run test:neko-social-anti-repeat
      - name: Endogenous motivation and goal genesis
        run: npm --prefix runtime/neuro-kurisu run test:workpass292:motivation-to-goal && npm --prefix runtime/neuro-kurisu run test:workpass288:intrinsic-motivation
      - name: World perception ingress and integrity
        run: npm --prefix runtime/neuro-kurisu run test:world-perception
      - name: Exact same-action world prediction ticket closure
        run: npm --prefix runtime/neuro-kurisu run test:p2698:world-closure
      - name: Cognitive planner restore integrity and execution boundary
        run: npm --prefix runtime/neuro-kurisu run test:workpass611:cognitive-planner-restore-integrity && npm --prefix runtime/neuro-kurisu run test:workpass610:brain-fusion-strip-only && npm --prefix runtime/neuro-kurisu run test:cognitive-runtime-planner-execution-gate
      - name: Cognitive spine, world feedback and project-tool boundary
        run: npm --prefix runtime/neuro-kurisu run test:big-pass-39
      - name: Cognitive spine runtime sidecar and cadence integration
        run: node --experimental-strip-types runtime/neuro-kurisu/tests/big-pass-162-runtime-integration.mjs
      - name: Developmental runtime owner-group integrity
        run: npm --prefix runtime/neuro-kurisu run test:developmental-instance-groups
      - name: Continuity and organism integration
        run: npm --prefix runtime/neuro-kurisu run test:b1701-b2200:continuity && npm --prefix runtime/neuro-kurisu run test:p29:core-integration && npm --prefix runtime/neuro-kurisu run test:pcontinuity:integration
      - name: B299 personality evidence and restore boundary
        run: npm --prefix runtime/neuro-kurisu run test:b299:personality-boundary-consolidation && npm --prefix runtime/neuro-kurisu run test:big-pass-299:personality
      - name: B299 hostile snapshot restore integrity
        run: npm --prefix runtime/neuro-kurisu run test:b299:restore-integrity
      - name: Affective dominance projection and voice embodiment
        run: npm --prefix runtime/neuro-kurisu run test:voice
      - name: P2702 persistent personality restore integrity
        run: npm --prefix runtime/neuro-kurisu run test:p2702:personality
      - name: Self-model and identity-state restore integrity
        run: node --experimental-strip-types --test runtime/neuro-kurisu/tests/self-state-restore-integrity-workpass80.mjs
      - name: P34 causal personhood evidence lifecycle and persistence
        run: npm --prefix runtime/neuro-kurisu run test:p34:personhood && npm --prefix runtime/neuro-kurisu run test:p34:migration && npm --prefix runtime/neuro-kurisu run test:p34:integration
      - name: Organism runtime smoke
        run: npm --prefix runtime/neuro-kurisu run test:organism-smoke
