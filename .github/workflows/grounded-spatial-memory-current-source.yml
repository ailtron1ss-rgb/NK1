name: NK1 grounded spatial memory current-source integration
on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/memory/GroundedSpatialMemoryBridge.ts"
      - "runtime/neuro-kurisu/tests/grounded-spatial-memory-source-bridge-workpass.mjs"
      - "runtime/neuro-kurisu/tests/grounded-spatial-core-tick-workpass.mjs"
      - ".github/workflows/grounded-spatial-memory-current-source.yml"
  push:
    branches:
      - "consolidation/grounded-spatial-memory-current-20261119"
    paths:
      - "runtime/neuro-kurisu/src/organism/core/OrganismCore.ts"
      - "runtime/neuro-kurisu/src/organism/memory/GroundedSpatialMemoryBridge.ts"
      - "runtime/neuro-kurisu/tests/grounded-spatial-memory-source-bridge-workpass.mjs"
      - "runtime/neuro-kurisu/tests/grounded-spatial-core-tick-workpass.mjs"
      - ".github/workflows/grounded-spatial-memory-current-source.yml"
permissions:
  contents: read
jobs:
  grounded-spatial-current-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts
        working-directory: runtime/neuro-kurisu
      - name: Test observed spatial bridge, provenance and lifecycle
        run: node --experimental-strip-types tests/grounded-spatial-memory-source-bridge-workpass.mjs
        working-directory: runtime/neuro-kurisu
      - name: Exercise real OrganismCore perception-to-memory tick
        run: node --experimental-strip-types tests/grounded-spatial-core-tick-workpass.mjs
        working-directory: runtime/neuro-kurisu
      - name: Recheck canonical spatial observation replay guard
        run: node --experimental-strip-types tests/memoryos2-spatial-observation-refresh.mjs
        working-directory: runtime/neuro-kurisu
      - name: Typecheck runtime
        run: npm run typecheck
        working-directory: runtime/neuro-kurisu
