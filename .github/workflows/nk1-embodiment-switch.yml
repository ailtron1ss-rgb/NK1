name: NK1 embodiment switch contract

on:
  pull_request:
    branches: [workpass70-source]
    paths:
      - "app/src/components/avatar/embodimentSwitch.ts"
      - "app/src/components/avatar/embodimentCoordinator.ts"
      - "app/scripts/embodiment-coordinator.test.mjs"
      - "app/scripts/embodiment-switch.test.mjs"
      - "app/package.json"
      - ".github/workflows/nk1-embodiment-switch.yml"
  push:
    branches: [work/nk1-cross-renderer-body-switching-2026-10-30]

permissions:
  contents: read

concurrency:
  group: nk1-embodiment-switch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned app dependencies
        run: npm ci --prefix app --ignore-scripts
      - name: Test renderer-neutral body handoff
        run: npm --prefix app run test:embodiment-switch
      - name: App typecheck
        run: npm --prefix app run typecheck
