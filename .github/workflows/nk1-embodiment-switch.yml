permissions:
  contents: read

concurrency:
  group: nk1-embodiment-switch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned app dependencies
        run: npm ci --prefix app --ignore-scripts
      - name: Test renderer-neutral body handoff
        run: npm --prefix app run test:embodiment-switch
      - name: Test cognitive motion arbitration and renderer capability contracts
        run: npm --prefix app run test:body-systems
      - name: Test accessible avatar renderer controls
        run: node --test app/scripts/avatar-stage-layout.test.mjs
      - name: Test tick-bound cross-renderer presentation receipts
        run: node --test app/scripts/avatar-presentation-receipt.test.mjs
      - name: Test N.E.K.O.-derived semantic gesture cards and NK1 motion programs
        run: npm --prefix app run test:semantic-gesture-intent
      - name: Test shared grapheme-to-viseme articulation
        run: npm --prefix app run test:embodiment-timeline
      - name: Test body-switch UI integration bridge
        run: npm --prefix app run test:embodiment-ui-bridge
      - name: Test GLB/VRM binary preflight
        run: npm --prefix app run test:avatar-model-preflight
      - name: Test procedural and VRM 3D avatar contract
        run: node --test app/scripts/avatar-3d-stage.test.mjs
      - name: Test adaptive mobile avatar frame budget
        run: node --experimental-strip-types --test app/scripts/avatar-frame-budget.test.mjs
      - name: Test VRM affect-to-expression and speech coexistence
        run: npm --prefix app run test:vrm-runtime-adapter
      - name: Audit VRM 0.x/1.0 humanoid node maps and full-body capabilities
        run: npm --prefix app run test:vrm-humanoid-rig-audit
      - name: Test deterministic GLB action resolution and clip crossfades
        run: npm --prefix app run test:avatar-animation-runtime
      - name: Test real Three.js toon material lifecycle
        run: npm --prefix app run test:three-toon-materials
      - name: Verify hosted Kurisu asset hash and GLB structure
        run: npm --prefix app run verify:hosted-kurisu-model
      - name: App typecheck
        run: npm --prefix app run typecheck
