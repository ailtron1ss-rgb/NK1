name: NK1 interoceptive precision allocation
on:
  pull_request:
    paths:
      - "runtime/neuro-kurisu/src/organism/system/InteroceptivePrecisionAllocator.ts"
      - "runtime/neuro-kurisu/src/organism/system/InteroceptiveStateEstimator.ts"
      - "runtime/neuro-kurisu/tests/interoceptive-precision-allocation.mjs"
      - ".github/workflows/interoceptive-precision-allocation.yml"
  push:
    branches:
      - "aspect/interoceptive-precision-allocation-20261103"
    paths:
      - "runtime/neuro-kurisu/src/organism/system/InteroceptivePrecisionAllocator.ts"
      - "runtime/neuro-kurisu/src/organism/system/InteroceptiveStateEstimator.ts"
      - "runtime/neuro-kurisu/tests/interoceptive-precision-allocation.mjs"
      - ".github/workflows/interoceptive-precision-allocation.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Run interoceptive precision allocation regressions
        run: node runtime/neuro-kurisu/tests/interoceptive-precision-allocation.mjs
