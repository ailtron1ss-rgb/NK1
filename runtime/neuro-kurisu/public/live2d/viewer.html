<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Neuro‑Kurisu · Live2D</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040912}
    body{background:radial-gradient(ellipse at 50% 28%,rgba(56,112,148,.22),transparent 54%),radial-gradient(ellipse at 50% 80%,rgba(111,79,143,.10),transparent 46%),#040912}
    #canvas-wrap{position:absolute;inset:0}
    canvas{width:100%!important;height:100%!important;image-rendering:auto}
    #status{position:absolute;left:8px;bottom:8px;z-index:5;font:10px monospace;letter-spacing:.02em;color:rgba(225,241,255,.78);padding:4px 6px;border:1px solid rgba(173,211,235,.14);border-radius:6px;background:rgba(2,7,13,.45);backdrop-filter:blur(8px);pointer-events:none}
  </style>
</head>
<body>
<div id="canvas-wrap"><canvas id="canvas"></canvas></div>
<div id="status">загрузка…</div>
<script type="module">
import { normalizeEmbodimentIntentV1 } from './embodiment-intent.mjs';
import { smoothToward, sampleBlink } from './temporal-smoothing.mjs';
(() => {
  const status=document.getElementById('status');
  const parent=window.parent;
  let model=null,app=null,lipTarget=0,lipCurrent=0,lipFormTarget=0,lipFormCurrent=0,bodySignal={},assetProfile='auto',modelPath='./Kurisu/Kurisu.model3.json',lastAppliedExpression='';
  let lastIntentStateVersion=0;
  let blinkT=0,blinkStartedAt=-Infinity,blinkDurationMs=180,nextBlink=performance.now()+6500,nextSaccade=performance.now()+1200;
  // Low-pass facial channels prevent abrupt expression jumps while keeping intent responsive.
  const faceState={brow:0,angle:0,eyeSmile:0,cheek:0};
  let eyeX=0,eyeY=0,targetEyeX=0,targetEyeY=0,semanticEyeX=0,semanticEyeY=0,blinkSequence=0,saccadeSequence=0,lastMotionKey='',motionRequestSequence=0,lastFaceUpdateAt=performance.now(),lastTickAt=performance.now();
  const EXPR_MAP={
    neutral:'Stanby Smile',happy:'Stanby Smile',sad:'Stanby Sad',angry:'Stanby Angry',
    surprised:'Stanby Surprised',flustered:'Blush 1',embarrassed:'Blush 2',thinking:'Stanby Scared',
    focused:'Stanby Smile',smile:'Stanby Smile',tender:'Blush 1',sarcastic:'Stanby Smile',
    smug:'Stanby Smile',looking_away:'Stanby Scared',tired:'Stanby Scared'
  };
  const FACE_PROFILES=Object.freeze({
    neutral:{brow:0,angle:0,eyeSmile:0,cheek:0,eyeOpen:1},
    happy:{brow:.12,angle:-.08,eyeSmile:.42,cheek:.18,eyeOpen:.94},
    sad:{brow:-.34,angle:.22,eyeSmile:-.12,cheek:0,eyeOpen:.90},
    angry:{brow:-.58,angle:.48,eyeSmile:-.18,cheek:0,eyeOpen:.88},
    surprised:{brow:.62,angle:0,eyeSmile:0,cheek:0,eyeOpen:1},
    flustered:{brow:.18,angle:-.12,eyeSmile:.12,cheek:.58,eyeOpen:.94},
    embarrassed:{brow:-.08,angle:.12,eyeSmile:.05,cheek:.72,eyeOpen:.91},
    thinking:{brow:.24,angle:-.16,eyeSmile:-.04,cheek:0,eyeOpen:.94},
    focused:{brow:-.12,angle:.1,eyeSmile:-.08,cheek:0,eyeOpen:.90},
    smile:{brow:.1,angle:-.08,eyeSmile:.48,cheek:.16,eyeOpen:.94},
    tender:{brow:.16,angle:-.08,eyeSmile:.24,cheek:.32,eyeOpen:.92},
    sarcastic:{brow:.28,angle:.34,eyeSmile:.12,cheek:0,eyeOpen:.94},
    smug:{brow:.3,angle:.28,eyeSmile:.22,cheek:.08,eyeOpen:.94},
    looking_away:{brow:-.08,angle:-.12,eyeSmile:-.08,cheek:0,eyeOpen:.94},
    tired:{brow:-.22,angle:.08,eyeSmile:-.2,cheek:0,eyeOpen:.82}
  });
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,Number.isFinite(Number(n))?Number(n):0));
  // pixi-live2d-display@0.4.0: MotionPriority.NORMAL=2, FORCE=3.
  const MOTION_PRIORITY_NORMAL=2,MOTION_PRIORITY_FORCE=3;
  // Seeded micro-movements keep identical intent timelines reproducible across runs.
  const deterministicUnit=(seed)=>{const value=Math.sin(seed*12.9898+78.233)*43758.5453;return value-Math.floor(value)};
  function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('не удалось загрузить '+src));document.head.appendChild(s)})}
  function send(type,extra={}){try{parent&&parent.postMessage({type,...extra},window.location.origin)}catch{}}
  function setCore(id,value){try{const core=model?.internalModel?.coreModel;if(core?.setParameterValueById)core.setParameterValueById(id,value)}catch{}}
  function applyEmbodiment(d){
    bodySignal=d||{};
    const mouth=clamp(bodySignal.mouthOpen,0,1);
    // Mouth aperture follows the supplied viseme exactly; voice emphasis is a separate channel.
    lipTarget=bodySignal.speaking?mouth:0.015;
    lipFormTarget=bodySignal.speaking?clamp(bodySignal.mouthForm,-1,1):0;
    if(bodySignal.expression)applyExpression(bodySignal.expression);
    if(bodySignal.motionGroup){
      const k=`${String(bodySignal.motionGroup)}:${Number(bodySignal.motionIndex||0)}:${Number(bodySignal.motionToken||0)}`;
      if(k!==lastMotionKey){
        lastMotionKey=k;
        const request=++motionRequestSequence;
        const group=String(bodySignal.motionGroup),index=Number(bodySignal.motionIndex||0);
        const priority=bodySignal.speechPhase==='cancelled'?MOTION_PRIORITY_FORCE:MOTION_PRIORITY_NORMAL;
        try{
          Promise.resolve(model.motion(group,index,priority))
            .then(ok=>{
              if(request!==motionRequestSequence)return;
              if(ok===false){if(lastMotionKey===k)lastMotionKey='';send('live2d_motion_unavailable',{group,index});}
            })
            .catch(err=>{
              if(request!==motionRequestSequence)return;
              if(lastMotionKey===k)lastMotionKey='';
              send('live2d_motion_error',{error:String(err?.message||err).slice(0,180)});
            });
        }catch(err){
          if(request===motionRequestSequence&&lastMotionKey===k)lastMotionKey='';
          if(request===motionRequestSequence)send('live2d_motion_error',{error:String(err?.message||err).slice(0,180)});
        }
      }
    }
  }
  function addCoreOffset(id,offset,min,max){
    try{
      const core=model?.internalModel?.coreModel;
      if(core&&typeof core.addParameterValueById==='function')core.addParameterValueById(id,clamp(offset,min,max),1);
    }catch{}
  }
  function applyModelParameterOverrides(){
    const core=model?.internalModel?.coreModel;
    if(!core)return;
    addCoreOffset('ParamAngleX',clamp(bodySignal.gazeX,-.4,.4)*7,-30,30);
    addCoreOffset('ParamAngleY',clamp(bodySignal.gazeY,-.4,.4)*5,-30,30);
    addCoreOffset('ParamAngleZ',clamp(bodySignal.headTilt,-.15,.15)*35,-30,30);
    const set=(key,value)=>{try{core.setParameterValueById(key,value,1)}catch{}};
    const gazeX=bodySignal.gazeDriven?clamp(semanticEyeX,-.4,.4):0;
    const gazeY=bodySignal.gazeDriven?clamp(semanticEyeY,-.4,.4):0;
    set('ParamEyeBallX',clamp(gazeX+eyeX*.35,-1,1));
    set('ParamEyeBallY',clamp(gazeY+eyeY*.35,-1,1));
    /* Eye openness is composed from the active face profile below. */
    set('ParamMouthOpenY',clamp(lipCurrent,0,1));
    if(bodySignal.speaking)set('ParamMouthForm',clamp(lipFormCurrent,-1,1));
    // Small expression channels are composed after authored expressions/motion/physics.
    // This gives NK1 continuous facial nuance without pretending every state has a bespoke clip.
    const intensity=clamp(bodySignal.expressionIntensity,0,1);
    const face=FACE_PROFILES[bodySignal.expression]||FACE_PROFILES.neutral;
    const facialGain=.25+intensity*.75;
    const faceNow=performance.now();
    const faceDeltaSeconds=clamp((faceNow-lastFaceUpdateAt)/1000,0,.1);
    lastFaceUpdateAt=faceNow;
    faceState.brow=smoothToward(faceState.brow,face.brow*facialGain,faceDeltaSeconds,.16);
    faceState.angle=smoothToward(faceState.angle,face.angle*facialGain,faceDeltaSeconds,.16);
    faceState.eyeSmile=smoothToward(faceState.eyeSmile,face.eyeSmile*facialGain,faceDeltaSeconds,.16);
    faceState.cheek=smoothToward(faceState.cheek,face.cheek*facialGain,faceDeltaSeconds,.16);
    faceState.eyeOpen=smoothToward(faceState.eyeOpen??1,face.eyeOpen,faceDeltaSeconds,.19);
    set('ParamEyeLOpen',clamp(faceState.eyeOpen*(1-blinkT),0,1));
    set('ParamEyeROpen',clamp(faceState.eyeOpen*(1-blinkT),0,1));
    set('ParamBrowLY',clamp(faceState.brow,-1,1));
    set('ParamBrowRY',clamp(faceState.brow,-1,1));
    set('ParamBrowLAngle',clamp(faceState.angle,-1,1));
    set('ParamBrowRAngle',clamp(faceState.angle,-1,1));
    set('ParamEyeLSmile',clamp(faceState.eyeSmile,-1,1));
    set('ParamEyeRSmile',clamp(faceState.eyeSmile,-1,1));
    set('ParamCheek',clamp(faceState.cheek,0,1));
    // Subtle torso follow-through and breathing are continuous channels, not motion clips.
    const arousal=clamp(bodySignal.expressionIntensity,0,1);
    const breathPhase=performance.now()/1900;
    set('ParamBreath',clamp(.5+Math.sin(breathPhase)*(.035+arousal*.045),0,1));
    const gestureDirection=bodySignal.gestureProfile==='considering'||bodySignal.gestureProfile==='examining'?-1:
      bodySignal.gestureProfile==='presenting'||bodySignal.gestureProfile==='emphatic'?1:
      bodySignal.gestureProfile==='reassuring'?.35:0;
    const gestureDrive=clamp(bodySignal.gestureIntensity,0,.8);
    addCoreOffset('ParamBodyAngleX',clamp(gazeX*.9+gestureDirection*gestureDrive*.12,-.5,.5),-8,8);
    addCoreOffset('ParamBodyAngleY',clamp(gazeY*.65+(bodySignal.gestureProfile==='reassuring'?gestureDrive*.035:0),-.35,.35),-6,6);
    addCoreOffset('ParamBodyAngleZ',clamp(bodySignal.headTilt,-.15,.15)*7,-5,5);
  }
  function applyExpression(expr){
    const expressionName=EXPR_MAP[expr]||EXPR_MAP.neutral;
    if(!model||expressionName===lastAppliedExpression)return;
    try{model.expression(expressionName);lastAppliedExpression=expressionName}catch{}
  }
  function chooseProfile(){
    const requested=new URLSearchParams(location.search).get('profile');
    if(['mobile','balanced','quality'].includes(requested||'')) return requested;
    const mem=Number(navigator.deviceMemory||0);
    const touch=Number(navigator.maxTouchPoints||0)>0;
    return mem>0&&mem<=6 ? 'mobile' : (touch && Math.min(innerWidth,innerHeight)<900 ? 'mobile' : 'balanced');
  }
  function modelForProfile(profile){
    if(profile==='mobile') return './Kurisu.mobile/Kurisu-mobile.model3.json';
    return './Kurisu/Kurisu.model3.json';
  }
  async function boot(){
    try{
      assetProfile=chooseProfile();
      modelPath=modelForProfile(assetProfile);
      status.textContent=`ядро · ${assetProfile}`;
      await loadScript('https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js');
      await loadScript('https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js');
      await loadScript('https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js');
      const PIXI=window.PIXI;
      if(!PIXI?.live2d)throw new Error('Live2D runtime не найден');
      const resolution=Math.max(1,Math.min(2,Number(window.devicePixelRatio)||1));
       app=new PIXI.Application({view:document.getElementById('canvas'),autoStart:true,backgroundAlpha:0,resizeTo:window,antialias:true,resolution,autoDensity:true,powerPreference:'low-power'});
      const {Live2DModel}=PIXI.live2d;
      model=await Live2DModel.from(modelPath,{autoInteract:false});
      if(!model?.width)throw new Error('модель без размера');
      const fit=()=>{if(!model)return;const screenW=app.screen.width,screenH=app.screen.height;const scale=Math.min(screenW/model.width,screenH/model.height)*.92;model.scale.set(scale);model.x=screenW/2;model.y=screenH*.99;model.anchor.set(.5,1)};
      fit();window.addEventListener('resize',fit,{passive:true});app.stage.addChild(model);
      status.textContent=`ок · ${assetProfile}`;send('live2d_ready',{profile:assetProfile,modelPath});
      model.internalModel?.on?.('beforeModelUpdate',applyModelParameterOverrides);
       app.ticker.add(() => {
         if(!model)return;
         const now=performance.now();
         const active=Boolean(bodySignal.speaking||bodySignal.expressionIntensity>.5||bodySignal.gesture);
         const every=1000/(active?30:14);
         if(now-(model.__nkLastFrame||0)<every)return;model.__nkLastFrame=now;
         const deltaSeconds=clamp((now-lastTickAt)/1000,0,.1);lastTickAt=now;
         lipCurrent=smoothToward(lipCurrent,lipTarget,deltaSeconds,.075);
         lipFormCurrent=smoothToward(lipFormCurrent,lipFormTarget,deltaSeconds,.09);
         semanticEyeX=smoothToward(semanticEyeX,clamp(bodySignal.gazeX,-.4,.4),deltaSeconds,.14);
         semanticEyeY=smoothToward(semanticEyeY,clamp(bodySignal.gazeY,-.4,.4),deltaSeconds,.14);
         eyeX=smoothToward(eyeX,targetEyeX,deltaSeconds,.055);
         eyeY=smoothToward(eyeY,targetEyeY,deltaSeconds,.055);
         if(now>=nextBlink){blinkStartedAt=now;const seed=lastIntentStateVersion*17+(++blinkSequence);nextBlink=now+6500+deterministicUnit(seed)*7500}
         blinkT=sampleBlink(now-blinkStartedAt,blinkDurationMs);
         if(now>=nextSaccade){const amp=bodySignal.speaking?.12:.24;const seed=lastIntentStateVersion*31+(++saccadeSequence);targetEyeX=(deterministicUnit(seed)-.5)*amp;targetEyeY=(deterministicUnit(seed+1)-.5)*amp*.52;nextSaccade=now+1200+deterministicUnit(seed+2)*3200}
       });
    }catch(err){status.textContent='fallback';send('live2d_error',{error:String(err?.message||err)})}
  }
  document.getElementById('canvas').addEventListener('pointerdown',ev=>{
    if(!model)return;
    const r=ev.currentTarget.getBoundingClientRect();
    const nx=(ev.clientX-r.left)/Math.max(1,r.width), ny=(ev.clientY-r.top)/Math.max(1,r.height);
    const zone=ny<0.50?'head':'body';
    try{model.motion(zone==='head'?'TapHead':'TapBody')}catch{}
    send('live2d_tap',{zone,nx,ny});
  },{passive:true});
  window.addEventListener('message',ev=>{
    if(ev.origin!==window.location.origin)return;
    const d=ev.data||{};
    if(d.type==='kurisu_lipsync')lipTarget=clamp(d.value,0,1);
    else if(d.type==='kurisu_embodiment_intent'){
      const normalized=normalizeEmbodimentIntentV1(d);
      if(!normalized||!model||normalized.stateVersion<=lastIntentStateVersion)return;
      lastIntentStateVersion=normalized.stateVersion;
      applyEmbodiment(normalized);
      applyExpression(normalized.expression);
    }
    else if(d.type==='kurisu_embodiment')applyEmbodiment(d);
    else if(d.type==='kurisu_expression')applyExpression(String(d.expression||'neutral'));
    else if(d.type==='kurisu_gaze'){setCore('ParamAngleX',clamp(d.x,-1,1)*30);setCore('ParamAngleY',clamp(d.y,-1,1)*20);setCore('ParamEyeBallX',clamp(d.x,-1,1));setCore('ParamEyeBallY',clamp(d.y,-1,1))}
    else if(d.type==='tap'&&model){try{model.motion(d.zone==='head'?'TapHead':'TapBody')}catch{try{model.motion('Idle')}catch{}}}
  });
  boot();
})();
</script>
</body>
</html>
