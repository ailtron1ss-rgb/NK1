<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Neuro‑Kurisu · Live2D</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020806}
    body{background-image:radial-gradient(circle at 50% 40%,rgba(0,255,120,.10),transparent 55%)}
    #canvas-wrap{position:absolute;inset:0}
    canvas{width:100%!important;height:100%!important}
    #status{position:absolute;left:7px;bottom:6px;z-index:5;font:10px monospace;color:rgba(210,255,230,.42);pointer-events:none}
  </style>
</head>
<body>
<div id="canvas-wrap"><canvas id="canvas"></canvas></div>
<div id="status">загрузка…</div>
<script type="module">
import { normalizeEmbodimentIntentV1 } from './embodiment-intent.mjs';
(() => {
  const status=document.getElementById('status');
  const parent=window.parent;
  let model=null,app=null,lipTarget=0,lipCurrent=0,bodySignal={},assetProfile='auto',modelPath='./Kurisu/Kurisu.model3.json',lastAppliedExpression='';
  let lastIntentStateVersion=0;
  let blinkT=0,blinkUntil=0,nextBlink=performance.now()+6500,nextSaccade=performance.now()+1200;
  let eyeX=0,eyeY=0,targetEyeX=0,targetEyeY=0,lastMotionKey='';
  const EXPR_MAP={
    neutral:'Stanby Smile',happy:'Stanby Smile',sad:'Stanby Sad',angry:'Stanby Angry',
    surprised:'Stanby Surprised',flustered:'Blush 1',embarrassed:'Blush 2',thinking:'Stanby Scared',
    focused:'Stanby Smile',smile:'Stanby Smile',tender:'Blush 1',sarcastic:'Stanby Smile',
    smug:'Stanby Smile',looking_away:'Stanby Scared',tired:'Stanby Scared'
  };
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,Number.isFinite(Number(n))?Number(n):0));
  function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('не удалось загрузить '+src));document.head.appendChild(s)})}
  function send(type,extra={}){try{parent&&parent.postMessage({type,...extra},window.location.origin)}catch{}}
  function setCore(id,value){try{const core=model?.internalModel?.coreModel;if(core?.setParameterValueById)core.setParameterValueById(id,value)}catch{}}
  function applyEmbodiment(d){
    bodySignal=d||{};
    setCore('ParamAngleX',clamp(bodySignal.gazeX,-1,1)*30);
    setCore('ParamAngleY',clamp(bodySignal.gazeY,-1,1)*20);
    setCore('ParamAngleZ',clamp(bodySignal.headTilt,-.15,.15)*35);
    setCore('ParamEyeBallX',clamp(bodySignal.gazeX,-1,1));
    setCore('ParamEyeBallY',clamp(bodySignal.gazeY,-1,1));
    const mouth=clamp(bodySignal.mouthOpen,0,1), emph=clamp(bodySignal.voiceEmphasis,0,1), intensity=clamp(bodySignal.expressionIntensity,.0,1);
    // The ticker smooths lipCurrent toward lipTarget. Updating only the core parameter here
    // would be overwritten by the next frame, leaving protocol-driven mouth poses invisible.
    lipTarget=clamp(mouth+emph*.08,0,1);
    setCore('ParamMouthOpenY',Math.max(lipTarget,mouth+emph*.08));
    setCore('ParamMouthForm',(intensity-.5)*.8);
    if(bodySignal.motionGroup){
      const k=`${String(bodySignal.motionGroup)}:${Number(bodySignal.motionIndex||0)}:${Number(bodySignal.motionToken||0)}`;
      if(k!==lastMotionKey){
        try{Promise.resolve(model.motion(String(bodySignal.motionGroup),Number(bodySignal.motionIndex||0))).catch(()=>{});lastMotionKey=k}catch{}
      }
    }
  }
  function applyExpression(expr){
    const expressionName=EXPR_MAP[expr]||EXPR_MAP.neutral;
    if(!model||expressionName===lastAppliedExpression)return;
    try{model.expression(expressionName);lastAppliedExpression=expressionName}catch{}
  }
  function chooseProfile(){
    const requested=new URLSearchParams(location.search).get('profile');
    if(['mobile','balanced','quality'].includes(requested||'')) return requested;
    const mem=Number(navigator.deviceMemory||0);
    const touch=Number(navigator.maxTouchPoints||0)>0;
    return mem>0&&mem<=6 ? 'mobile' : (touch && Math.min(innerWidth,innerHeight)<900 ? 'mobile' : 'balanced');
  }
  function modelForProfile(profile){
    if(profile==='mobile') return './Kurisu.mobile/Kurisu-mobile.model3.json';
    return './Kurisu/Kurisu.model3.json';
  }
  async function boot(){
    try{
      assetProfile=chooseProfile();
      modelPath=modelForProfile(assetProfile);
      status.textContent=`ядро · ${assetProfile}`;
      await loadScript('https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js');
      await loadScript('https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js');
      await loadScript('https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js');
      const PIXI=window.PIXI;
      if(!PIXI?.live2d)throw new Error('Live2D runtime не найден');
      app=new PIXI.Application({view:document.getElementById('canvas'),autoStart:true,backgroundAlpha:0,resizeTo:window,antialias:true,powerPreference:'low-power'});
      const {Live2DModel}=PIXI.live2d;
      model=await Live2DModel.from(modelPath,{autoInteract:false});
      if(!model?.width)throw new Error('модель без размера');
      const fit=()=>{if(!model)return;const scale=Math.min(app.screen.width/model.width,app.screen.height/model.height)*.92;model.scale.set(scale);model.x=app.screen.width/2;model.y=app.screen.height*.98;model.anchor.set(.5,1)};
      fit();window.addEventListener('resize',fit,{passive:true});app.stage.addChild(model);
      status.textContent=`ок · ${assetProfile}`;send('live2d_ready',{profile:assetProfile,modelPath});
      app.ticker.add(() => {
        if(!model)return;
        const now=performance.now();
        const active=Boolean(bodySignal.speaking||bodySignal.expressionIntensity>.5||bodySignal.gesture);
        const targetFps=active?30:14;
        const every=1000/targetFps;
        if(now-(model.__nkLastFrame||0)<every)return;model.__nkLastFrame=now;
        lipCurrent+=(lipTarget-lipCurrent)*.30;
        eyeX+=(targetEyeX-eyeX)*.08;eyeY+=(targetEyeY-eyeY)*.08;
        if(now>=nextBlink){blinkT=1;blinkUntil=now+115;nextBlink=now+6500+Math.random()*7500}
        if(blinkT>0){blinkT*=.72;if(now>blinkUntil)blinkT=Math.max(0,blinkT-.12)}
        if(now>=nextSaccade){targetEyeX=(Math.random()-.5)*.35;targetEyeY=(Math.random()-.5)*.18;nextSaccade=now+1100+Math.random()*3200}
        setCore('ParamMouthOpenY',lipCurrent);
        setCore('ParamEyeLOpen',1-blinkT);setCore('ParamEyeROpen',1-blinkT);
        if(!bodySignal.gazeX&&!bodySignal.gazeY){setCore('ParamEyeBallX',eyeX);setCore('ParamEyeBallY',eyeY)}
      });
    }catch(err){status.textContent='fallback';send('live2d_error',{error:String(err?.message||err)})}
  }
  document.getElementById('canvas').addEventListener('pointerdown',ev=>{
    if(!model)return;
    const r=ev.currentTarget.getBoundingClientRect();
    const nx=(ev.clientX-r.left)/Math.max(1,r.width), ny=(ev.clientY-r.top)/Math.max(1,r.height);
    const zone=ny<0.50?'head':'body';
    try{model.motion(zone==='head'?'TapHead':'TapBody')}catch{}
    send('live2d_tap',{zone,nx,ny});
  },{passive:true});
  window.addEventListener('message',ev=>{
    if(ev.origin!==window.location.origin)return;
    const d=ev.data||{};
    if(d.type==='kurisu_lipsync')lipTarget=clamp(d.value,0,1);
    else if(d.type==='kurisu_embodiment_intent'){
      const normalized=normalizeEmbodimentIntentV1(d);
      if(!normalized||!model||normalized.stateVersion<=lastIntentStateVersion)return;
      lastIntentStateVersion=normalized.stateVersion;
      applyEmbodiment(normalized);
      applyExpression(normalized.expression);
    }
    else if(d.type==='kurisu_embodiment')applyEmbodiment(d);
    else if(d.type==='kurisu_expression')applyExpression(String(d.expression||'neutral'));
    else if(d.type==='kurisu_gaze'){setCore('ParamAngleX',clamp(d.x,-1,1)*30);setCore('ParamAngleY',clamp(d.y,-1,1)*20);setCore('ParamEyeBallX',clamp(d.x,-1,1));setCore('ParamEyeBallY',clamp(d.y,-1,1))}
    else if(d.type==='tap'&&model){try{model.motion(d.zone==='head'?'TapHead':'TapBody')}catch{try{model.motion('Idle')}catch{}}}
  });
  boot();
})();
</script>
</body>
</html>
