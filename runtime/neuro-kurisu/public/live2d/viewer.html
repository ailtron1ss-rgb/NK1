<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Neuro‑Kurisu · Live2D</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020806}
    body{background-image:radial-gradient(circle at 50% 40%,rgba(0,255,120,.10),transparent 55%)}
    #canvas-wrap{position:absolute;inset:0}
    canvas{width:100%!important;height:100%!important}
    #status{position:absolute;left:7px;bottom:6px;z-index:5;font:10px monospace;color:rgba(210,255,230,.42);pointer-events:none}
  </style>
</head>
<body>
<div id="canvas-wrap"><canvas id="canvas"></canvas></div>
<div id="status">загрузка…</div>
<script>
(() => {
  const status=document.getElementById('status');
  const parent=window.parent;
  let model=null,app=null,lipTarget=0,lipCurrent=0,bodySignal={},assetProfile='auto',modelPath='./Kurisu/Kurisu.model3.json',lastAppliedExpression=null;
  let lastIntentStateVersion=0,lastSpeechEventId=null,lastAudioClockId=null,lastAudioTimeMs=0;
  let blinkT=0,blinkUntil=0,nextBlink=performance.now()+6500,nextSaccade=performance.now()+1200;
  let eyeX=0,eyeY=0,targetEyeX=0,targetEyeY=0,lastMotionKey='';
  const EXPR_MAP={
    neutral:'Stanby Smile',happy:'Stanby Smile',sad:'Stanby Sad',angry:'Stanby Angry',
    surprised:'Stanby Surprised',flustered:'Blush 1',embarrassed:'Blush 2',thinking:'Stanby Scared',
    focused:'Stanby Smile',smile:'Stanby Smile',tender:'Blush 1',sarcastic:'Stanby Smile',
    smug:'Stanby Smile',looking_away:'Stanby Scared',tired:'Stanby Scared'
  };
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,typeof n==='number'&&Number.isFinite(n)?n:0));
  const isRecord=value=>value!==null&&typeof value==='object'&&!Array.isArray(value);
  const ALLOWED_MOTIONS=new Set(['Idle','Special','TapHead','TapBody']);
  function visualStateIsActive(signal=bodySignal){return Boolean(signal?.speaking||signal?.gesture||signal?.expressionIntensity>0.5)}
  function updateTickerBudget(){if(app?.ticker)app.ticker.maxFPS=visualStateIsActive()?30:14}
  function syncViewerVisibility(){if(!app?.ticker||!model)return;if(document.hidden){app.stop();return}updateTickerBudget();app.start()}
  document.addEventListener('visibilitychange',syncViewerVisibility);
  function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('не удалось загрузить '+src));document.head.appendChild(s)})}
  function send(type,extra={}){try{parent&&parent.postMessage({type,...extra},window.location.origin)}catch{}}
  function setCore(id,value){try{const core=model?.internalModel?.coreModel;if(core?.setParameterValueById)core.setParameterValueById(id,value)}catch{}}
  function sanitizeEmbodiment(d){
    if(!isRecord(d))return null;
    const result={};
    const numeric={gazeX:[-1,1],gazeY:[-1,1],headTilt:[-.15,.15],mouthOpen:[0,1],mouthForm:[-1,1],expressionIntensity:[0,1],voiceEmphasis:[0,1]};
    for(const [key,[low,high]] of Object.entries(numeric)){
      if(d[key]===undefined)continue;
      if(typeof d[key]!=='number'||!Number.isFinite(d[key]))return null;
      result[key]=clamp(d[key],low,high);
    }
    for(const key of ['speaking','gesture','gazeDriven']){
      if(d[key]===undefined)continue;
      if(typeof d[key]!=='boolean')return null;
      result[key]=d[key];
    }
    if(d.motionGroup!==undefined){if(typeof d.motionGroup!=='string'||!ALLOWED_MOTIONS.has(d.motionGroup))return null;result.motionGroup=d.motionGroup;}
    if(d.motionIndex!==undefined){if(!Number.isSafeInteger(d.motionIndex)||d.motionIndex<0||d.motionIndex>16)return null;result.motionIndex=d.motionIndex;}
    return result;
  }
  function applyEmbodiment(d){
    bodySignal=d||{};
    updateTickerBudget();
    const gazeX=clamp(bodySignal.gazeX,-1,1),gazeY=clamp(bodySignal.gazeY,-1,1);
    const headAngleX=clamp(bodySignal.headAngleX===undefined?gazeX:bodySignal.headAngleX,-1,1);
    const headAngleY=clamp(bodySignal.headAngleY===undefined?gazeY:bodySignal.headAngleY,-1,1);
    setCore('ParamAngleX',headAngleX*30);
    setCore('ParamAngleY',headAngleY*20);
    setCore('ParamAngleZ',clamp(bodySignal.headTilt,-.15,.15)*35);
    setCore('ParamEyeBallX',gazeX);
    setCore('ParamEyeBallY',gazeY);
    setCore('ParamBodyAngleX',clamp(bodySignal.bodyAngleX,-1,1)*10);
    setCore('ParamBodyAngleY',clamp(bodySignal.bodyAngleY,-1,1)*10);
    setCore('ParamBodyAngleZ',clamp(bodySignal.bodyAngleZ,-1,1)*10);
    const mouth=clamp(bodySignal.mouthOpen,0,1), emph=clamp(bodySignal.voiceEmphasis,0,1), intensity=clamp(bodySignal.expressionIntensity,.0,1);
    setCore('ParamMouthOpenY',Math.max(lipTarget,mouth+emph*.08));
    setCore('ParamMouthForm',bodySignal.mouthForm===undefined?(intensity-.5)*.8:clamp(bodySignal.mouthForm,-1,1));
    if(bodySignal.motionGroup){const k=`${String(bodySignal.motionGroup)}:${Number(bodySignal.motionIndex||0)}:${Number(bodySignal.motionToken||0)}`;if(k!==lastMotionKey){try{model.motion(String(bodySignal.motionGroup),Number(bodySignal.motionIndex||0));lastMotionKey=k}catch{}}}
  }
  function sanitizeIntent(d){
    if(!isRecord(d)||d.protocolVersion!==1||!Number.isSafeInteger(d.stateVersion)||d.stateVersion<=lastIntentStateVersion)return null;
    if(typeof d.sentAtEpochMs!=='number'||!Number.isFinite(d.sentAtEpochMs)||d.sentAtEpochMs<0)return null;
    if(!['idle','starting','speaking','ended','cancelled','unknown'].includes(d.speechPhase))return null;
    const speechEventId=d.speechEventId===null?null:(typeof d.speechEventId==='string'&&d.speechEventId.length>0&&d.speechEventId.length<=180?d.speechEventId:null);
    const audioClockId=d.audioClockId===null?null:(typeof d.audioClockId==='string'&&d.audioClockId.length>0&&d.audioClockId.length<=220?d.audioClockId:null);
    if(d.speechEventId!==null&&speechEventId===null)return null;
    if(d.audioClockId!==null&&audioClockId===null)return null;
    if(d.speechPhase==='speaking'&&(!speechEventId||!audioClockId))return null;
    if(typeof d.audioTimeMs!=='number'||!Number.isFinite(d.audioTimeMs)||d.audioTimeMs<0)return null;
    if(!['none','speech-synthesis-boundary-anchored-monotonic','speech-synthesis-elapsed-time-anchored-monotonic','runtime-tts-start-anchored-monotonic'].includes(d.clockSource))return null;
    if(d.speechPhase==='speaking'&&d.clockSource==='none')return null;
    if(typeof d.priority!=='number'||!Number.isFinite(d.priority)||d.priority<0||d.priority>100)return null;
    const cancellationToken=d.cancellationToken===null?null:(typeof d.cancellationToken==='string'&&d.cancellationToken.length<=220?d.cancellationToken:null);
    if(d.cancellationToken!==null&&cancellationToken===null)return null;
    if(d.speechPhase==='cancelled'&&(!speechEventId||cancellationToken!==`cancel:${speechEventId}`))return null;
    if(!isRecord(d.mouth)||!isRecord(d.gaze)||!isRecord(d.body))return null;
    if(typeof d.mouth.open!=='number'||!Number.isFinite(d.mouth.open)||typeof d.mouth.form!=='number'||!Number.isFinite(d.mouth.form)||typeof d.mouth.viseme!=='string'||!/^[a-z]{1,16}$/.test(d.mouth.viseme))return null;
    if(typeof d.gaze.x!=='number'||!Number.isFinite(d.gaze.x)||typeof d.gaze.y!=='number'||!Number.isFinite(d.gaze.y)||typeof d.gaze.driven!=='boolean')return null;
    if(typeof d.expression!=='string'||!Object.prototype.hasOwnProperty.call(EXPR_MAP,d.expression)||typeof d.expressionIntensity!=='number'||!Number.isFinite(d.expressionIntensity))return null;
    if(typeof d.body.headTilt!=='number'||!Number.isFinite(d.body.headTilt)||typeof d.body.gesture!=='boolean')return null;
    if(typeof d.body.motionGroup!=='string'||!ALLOWED_MOTIONS.has(d.body.motionGroup)||!/^[a-zA-Z0-9_-]{1,32}$/.test(d.body.motionGroup))return null;
    if(!Number.isInteger(d.body.motionIndex)||d.body.motionIndex<0||d.body.motionIndex>32||!Number.isSafeInteger(d.body.motionToken)||d.body.motionToken<0)return null;
    for(const [key,min,max] of [['headAngleX',-1,1],['headAngleY',-1,1],['bodyAngleX',-1,1],['bodyAngleY',-1,1],['bodyAngleZ',-1,1],['breathIntensity',0,1]]){
      const value=d.body[key];
      if(value!==undefined&&(typeof value!=='number'||!Number.isFinite(value)||value<min||value>max))return null;
    }
    if(typeof d.voiceEmphasis!=='number'||!Number.isFinite(d.voiceEmphasis))return null;
    return {
      stateVersion:d.stateVersion,sentAtEpochMs:d.sentAtEpochMs,speechEventId,audioClockId,
      speechPhase:d.speechPhase,audioTimeMs:d.audioTimeMs,clockSource:d.clockSource,priority:d.priority,cancellationToken,
      speaking:d.speechPhase==='speaking',expression:d.expression,expressionIntensity:clamp(d.expressionIntensity,0,1),
      mouthOpen:clamp(d.mouth.open,0,1),mouthForm:clamp(d.mouth.form,-1,1),mouthViseme:d.mouth.viseme,
      gazeX:clamp(d.gaze.x,-1,1),gazeY:clamp(d.gaze.y,-1,1),gazeDriven:d.gaze.driven,
      headAngleX:clamp(d.body.headAngleX===undefined?d.gaze.x:d.body.headAngleX,-1,1),
      headAngleY:clamp(d.body.headAngleY===undefined?d.gaze.y:d.body.headAngleY,-1,1),
      bodyAngleX:clamp(d.body.bodyAngleX,-1,1),bodyAngleY:clamp(d.body.bodyAngleY,-1,1),bodyAngleZ:clamp(d.body.bodyAngleZ,-1,1),
      breathIntensity:clamp(d.body.breathIntensity===undefined?0.35:d.body.breathIntensity,0,1),
      headTilt:clamp(d.body.headTilt,-.15,.15),gesture:d.body.gesture,motionGroup:d.body.motionGroup,
      motionIndex:d.body.motionIndex,motionToken:d.body.motionToken,voiceEmphasis:clamp(d.voiceEmphasis,0,1),
    };
  }
  function applyIntent(intent){
    if(intent.speechEventId===lastSpeechEventId&&intent.audioClockId===lastAudioClockId
       &&intent.speechPhase==='speaking'&&intent.audioTimeMs+1<lastAudioTimeMs)return;
    lastIntentStateVersion=intent.stateVersion;
    if(intent.speechEventId!==lastSpeechEventId||intent.audioClockId!==lastAudioClockId){
      lastAudioTimeMs=0;lastSpeechEventId=intent.speechEventId;lastAudioClockId=intent.audioClockId;
    }
    lastAudioTimeMs=Math.max(lastAudioTimeMs,intent.audioTimeMs);
    if(['cancelled','ended','idle','unknown'].includes(intent.speechPhase)){
      intent.speaking=false;intent.mouthOpen=.015;intent.mouthForm=0;intent.voiceEmphasis=0;
    }
    applyExpression(intent.expression);
    lipTarget=intent.mouthOpen;
    applyEmbodiment(intent);
  }
  function applyExpression(expr){
    const expressionName=EXPR_MAP[expr]||EXPR_MAP.neutral;
    if(!model?.expression||expressionName===lastAppliedExpression)return;
    try{model.expression(expressionName);lastAppliedExpression=expressionName}catch{}
  }
  function chooseProfile(){
    const requested=new URLSearchParams(location.search).get('profile');
    if(['mobile','balanced','quality'].includes(requested||'')) return requested;
    const mem=Number(navigator.deviceMemory||0);
    const touch=Number(navigator.maxTouchPoints||0)>0;
    return mem>0&&mem<=6 ? 'mobile' : (touch && Math.min(innerWidth,innerHeight)<900 ? 'mobile' : 'balanced');
  }
  function modelForProfile(profile){
    if(profile==='mobile') return './Kurisu.mobile/Kurisu-mobile.model3.json';
    return './Kurisu/Kurisu.model3.json';
  }
  async function boot(){
    try{
      assetProfile=chooseProfile();
      modelPath=modelForProfile(assetProfile);
      status.textContent=`ядро · ${assetProfile}`;
      await loadScript('./vendor/pixi.min.js');
      await loadScript('./vendor/live2dcubismcore.min.js');
      await loadScript('./vendor/cubism4.min.js');
      const PIXI=window.PIXI;
      if(!PIXI?.live2d)throw new Error('Live2D runtime не найден');
      app=new PIXI.Application({view:document.getElementById('canvas'),autoStart:false,backgroundAlpha:0,resizeTo:window,antialias:true,powerPreference:'low-power'});
      const {Live2DModel}=PIXI.live2d;
      model=await Live2DModel.from(modelPath,{autoInteract:false});
      if(!model?.width)throw new Error('модель без размера');
      const fit=()=>{if(!model)return;const scale=Math.min(app.screen.width/model.width,app.screen.height/model.height)*.92;model.scale.set(scale);model.x=app.screen.width/2;model.y=app.screen.height*.98;model.anchor.set(.5,1)};
      fit();window.addEventListener('resize',fit,{passive:true});app.stage.addChild(model);
      status.textContent=`ок · ${assetProfile}`;send('live2d_ready',{profile:assetProfile,modelPath});
      app.ticker.add(() => {
        if(!model)return;
        const now=performance.now();
        setCore('ParamBreath',0.5+Math.sin(now/1100)*(0.045+clamp(bodySignal.breathIntensity,0,1)*0.08));
        lipCurrent+=(lipTarget-lipCurrent)*.30;
        eyeX+=(targetEyeX-eyeX)*.08;eyeY+=(targetEyeY-eyeY)*.08;
        if(now>=nextBlink){blinkT=1;blinkUntil=now+115;nextBlink=now+6500+Math.random()*7500}
        if(blinkT>0){blinkT*=.72;if(now>blinkUntil)blinkT=Math.max(0,blinkT-.12)}
        if(now>=nextSaccade){targetEyeX=(Math.random()-.5)*.35;targetEyeY=(Math.random()-.5)*.18;nextSaccade=now+1100+Math.random()*3200}
        setCore('ParamMouthOpenY',lipCurrent);
        setCore('ParamEyeLOpen',1-blinkT);setCore('ParamEyeROpen',1-blinkT);
        if(!bodySignal.gazeX&&!bodySignal.gazeY){setCore('ParamEyeBallX',eyeX);setCore('ParamEyeBallY',eyeY)}
      });
      updateTickerBudget();
      syncViewerVisibility();
    }catch(err){status.textContent='fallback';send('live2d_error',{error:String(err?.message||err)})}
  }
  document.getElementById('canvas').addEventListener('pointerdown',ev=>{
    if(!model)return;
    const r=ev.currentTarget.getBoundingClientRect();
    const nx=(ev.clientX-r.left)/Math.max(1,r.width), ny=(ev.clientY-r.top)/Math.max(1,r.height);
    const zone=ny<0.50?'head':'body';
    try{model.motion(zone==='head'?'TapHead':'TapBody')}catch{}
    send('live2d_tap',{zone,nx,ny});
  },{passive:true});
  window.addEventListener('message',ev=>{
    if(ev.origin!==window.location.origin||ev.source!==window.parent)return;
    const d=ev.data;
    if(!isRecord(d)||typeof d.type!=='string')return;
    if(d.type==='kurisu_embodiment_intent'){
      const intent=sanitizeIntent(d);
      if(intent)applyIntent(intent);
    } else if(d.type==='kurisu_lipsync'){
      if(typeof d.value!=='number'||!Number.isFinite(d.value))return;
      lipTarget=clamp(d.value,0,1);
    } else if(d.type==='kurisu_embodiment'){
      const signal=sanitizeEmbodiment(d);
      if(signal)applyEmbodiment(signal);
    } else if(d.type==='kurisu_expression'){
      if(typeof d.expression!=='string'||!Object.prototype.hasOwnProperty.call(EXPR_MAP,d.expression))return;
      applyExpression(d.expression);
    } else if(d.type==='kurisu_gaze'){
      if(typeof d.x!=='number'||!Number.isFinite(d.x)||typeof d.y!=='number'||!Number.isFinite(d.y))return;
      setCore('ParamAngleX',clamp(d.x,-1,1)*30);setCore('ParamAngleY',clamp(d.y,-1,1)*20);setCore('ParamEyeBallX',clamp(d.x,-1,1));setCore('ParamEyeBallY',clamp(d.y,-1,1));
    } else if(d.type==='tap'&&model&&['head','body'].includes(d.zone)){
      try{model.motion(d.zone==='head'?'TapHead':'TapBody')}catch{try{model.motion('Idle')}catch{}}
    }
  });
  boot();
})();
</script>
</body>
</html>
