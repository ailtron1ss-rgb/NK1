<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Neuro‑Kurisu · Live2D Viewer</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
    html,body{margin:0;min-height:100%;background:#071018;color:#e8eef6}
    body{display:grid;min-height:100vh}
    .shell{position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 30%,rgba(96,160,255,.10),transparent 48%),#071018}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
    .hud{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:10px ui-monospace,monospace;color:rgba(232,238,246,.45)}
    .chip{background:rgba(5,12,18,.65);border:1px solid rgba(130,160,190,.16);padding:5px 8px;border-radius:999px;backdrop-filter:blur(5px)}
    .fallback{position:absolute;inset:0;display:none;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(190,138,216,.16),transparent 42%),#111822}
    .fallback-card{text-align:center;color:#b9c7d6}
    .fallback-avatar{width:min(52vw,280px);aspect-ratio:.75;margin:auto;position:relative}
    .fallback-hair{position:absolute;inset:4% 8% 0;background:linear-gradient(155deg,#9b2f24,#57191b);border-radius:50% 50% 42% 42%}
    .fallback-face{position:absolute;left:22%;right:22%;top:19%;height:47%;background:#f1d3bf;border-radius:46% 46% 42% 42%}
    .eye{position:absolute;top:42%;width:11%;height:5px;border-radius:8px;background:#2d3441}.eye.left{left:26%}.eye.right{right:26%}
    .mouth{position:absolute;left:40%;top:61%;width:20%;height:7px;border-bottom:2px solid #9c5f69;border-radius:50%}
  </style>
</head>
<body>
<div class="shell">
  <iframe id="live2d" title="Neuro-Kurisu Live2D" src="/live2d/viewer.html?profile=auto" allow="autoplay"></iframe>
  <div id="fallback" class="fallback"><div class="fallback-card"><div class="fallback-avatar"><div class="fallback-hair"></div><div class="fallback-face"><span class="eye left"></span><span class="eye right"></span><span class="mouth"></span></div></div><div>2D safe renderer</div></div></div>
  <div class="hud"><span id="state" class="chip">инициализация…</span><span id="tick" class="chip">tick —</span></div>
</div>
<script type="module">
import {
  buildAvatarPresentation,
  buildAvatarSpeechTimeline,
  sampleAvatarSpeechTimeline,
} from './avatar-state.mjs';
import { smoothEmbodimentAffect } from './embodiment-affect-core.mjs';

const frame = document.getElementById('live2d');
const fallback = document.getElementById('fallback');
const state = document.getElementById('state');
const tick = document.getElementById('tick');
let snapshotInFlight = false;
let speechInFlight = false;
let latestPresentation = null;
let speechCursor = null;
let lastControlAt = 0;
let mouthWasActive = false;
let intentStateVersion = 0;
let motionToken = 0;
let motionIdentity = "";
let lastPublishedSpeechIdentity = "";
let lastPublishedSpeechPhase = "idle";
let affectSmoothingState = null;
let lastAffectTarget = null;
let affectTransitionUntil = 0;
const AFFECT_SETTLE_MS = 900; // five 180ms time constants
const AFFECT_TARGET_EPSILON = 0.0005;
const CLOSED_POSE = Object.freeze({ open: 0.015, form: 0, viseme: 'rest' });

function affectTargetFor(body, active) {
  const intensity = Number.isFinite(body.expressionIntensity) ? body.expressionIntensity : 0;
  return {
    expressionIntensity: intensity,
    gazeX: Number.isFinite(body.gazeX) ? body.gazeX : 0,
    gazeY: Number.isFinite(body.gazeY) ? body.gazeY : 0,
    headTilt: Number.isFinite(body.headTilt) ? body.headTilt : 0,
    // Match React: spoken emphasis rises with arousal, then eases back to zero.
    voiceEmphasis: active ? Math.min(1, Math.max(0, intensity) + 0.15) : 0,
  };
}

function sampleAffect(body, active, now) {
  const target = affectTargetFor(body, active);
  if (lastAffectTarget) {
    const changed = Object.keys(target).some(key =>
      Math.abs(target[key] - lastAffectTarget[key]) > AFFECT_TARGET_EPSILON);
    if (changed) affectTransitionUntil = now + AFFECT_SETTLE_MS;
  }
  lastAffectTarget = target;
  affectSmoothingState = smoothEmbodimentAffect(affectSmoothingState, target, now);
  return affectSmoothingState;
}

function post(type, data = {}) {
  try { frame.contentWindow.postMessage({ type, ...data }, location.origin); } catch {}
}
window.addEventListener('message', (event) => {
  if (event.origin !== location.origin || event.source !== frame.contentWindow) return;
  if (event.data?.type === 'live2d_ready') {
    fallback.style.display = 'none';
    // Keep the organism's latest action/emotion label; readiness is a separate channel.
    if (state.textContent === 'инициализация…') state.textContent = 'Live2D online';
  } else if (event.data?.type === 'live2d_error') {
    fallback.style.display = 'grid';
    state.textContent = 'Live2D fallback';
  }
});

async function refreshSnapshot() {
  if (snapshotInFlight) return;
  snapshotInFlight = true;
  try {
    const response = await fetch('/api/organism/ui-snapshot', { cache: 'no-store' });
    if (!response.ok) throw new Error('avatar-snapshot-http-' + response.status);
    const snapshot = await response.json();
    const presentation = buildAvatarPresentation(snapshot);
    if (!presentation) throw new Error('avatar-snapshot-invalid');
    latestPresentation = presentation;
    state.textContent = (presentation.awake ? 'awake' : 'sleep') + ' · ' + presentation.action + ' · ' + presentation.emotion;
    tick.textContent = 'tick ' + presentation.tick;
    // React and runtime both emit one versioned EmbodimentIntent v1 envelope.
    // Snapshot updates refresh the slow affect channels without resetting the speech clock.
    publishIntent(performance.now());
  } catch {
    state.textContent = 'organism offline';
  } finally {
    snapshotInFlight = false;
  }
}

/** Poll only the compact runtime voice cursor; the full cognitive UI snapshot stays on a slow cadence. */
async function refreshSpeech() {
  if (speechInFlight) return;
  speechInFlight = true;
  try {
    const response = await fetch('/api/organism/avatar-speech', { cache: 'no-store' });
    if (!response.ok) return;
    const speech = await response.json();
    if (speech?.ok !== true || typeof speech.speaking !== 'boolean') return;
    const now = performance.now();
    if (typeof speech.speechEventId !== 'string' || speech.speechEventId.length < 1
        || speech.speechEventId.length > 140 || typeof speech.text !== 'string'
        || !Number.isFinite(speech.startedAt) || speech.startedAt < 0) {
      if (speechCursor) {
        speechCursor.speaking = false;
        speechCursor.phase = 'unknown';
        speechCursor.lastResponseAt = now;
      }
      return;
    }
    const identity = speech.speechEventId + ':' + speech.startedAt;
    if (!speechCursor || speechCursor.identity !== identity) {
      const timeline = buildAvatarSpeechTimeline(speech.text, speech.rate, 'ru-RU');
      speechCursor = {
        identity, eventId: speech.speechEventId, startedAt: speech.startedAt,
        timeline, speaking: speech.speaking, phase: speech.speaking ? 'speaking' : 'ended',
        lastResponseAt: now,
        // Bridge wall-clock TTS start to the monotonic animation clock once per utterance.
        elapsedAtAnchor: Math.max(0, Date.now() - speech.startedAt),
        performanceAtAnchor: now,
      };
    } else {
      speechCursor.speaking = speech.speaking;
      speechCursor.phase = speech.speaking ? 'speaking' : 'ended';
      speechCursor.lastResponseAt = now;
    }
  } catch {
    // A stale cursor is failed closed by isSpeechActive(), which closes the mouth after 1.2s.
  } finally {
    speechInFlight = false;
  }
}

function speechElapsedAt(now) {
  if (!speechCursor) return 0;
  return Math.max(0, speechCursor.elapsedAtAnchor + Math.max(0, now - speechCursor.performanceAtAnchor));
}

function currentSpeechPhase(now) {
  if (!speechCursor) return 'idle';
  if (speechCursor.phase === 'unknown') return 'unknown';
  if (speechCursor.speaking) return now - speechCursor.lastResponseAt <= 1200 ? 'speaking' : 'unknown';
  return 'ended';
}

function isSpeechActive(now) {
  return Boolean(speechCursor?.timeline.length && currentSpeechPhase(now) === 'speaking');
}

function publishIntent(now, sampledPose = null) {
  const body = latestPresentation?.body ?? {
    gazeX: 0, gazeY: 0, gazeDriven: false, headTilt: 0,
    expressionIntensity: 0.35, gesture: false, motionGroup: 'Idle', motionIndex: 0, voiceEmphasis: 0,
  };
  const phase = currentSpeechPhase(now);
  const active = phase === 'speaking';
  const affect = sampleAffect(body, active, now);
  const pose = active
    ? (sampledPose ?? sampleAvatarSpeechTimeline(speechCursor.timeline, speechElapsedAt(now)))
    : CLOSED_POSE;
  const eventId = speechCursor?.eventId ?? null;
  const clockId = speechCursor ? ('runtime-tts:' + speechCursor.eventId + ':' + speechCursor.startedAt) : null;
  const motionGroup = active ? 'Special' : (body.motionGroup || 'Idle');
  const motionIndex = Number.isSafeInteger(body.motionIndex) ? Math.max(0, Math.min(16, body.motionIndex)) : 0;
  const motionKey = [active ? eventId : (latestPresentation?.action || 'idle'), motionGroup, motionIndex].join(':');
  if (motionKey !== motionIdentity) {
    motionIdentity = motionKey;
    motionToken = Math.min(Number.MAX_SAFE_INTEGER, motionToken + 1);
  }
  const intent = {
    type: 'kurisu_embodiment_intent',
    protocolVersion: 1,
    stateVersion: ++intentStateVersion,
    sentAtEpochMs: Date.now(),
    speechEventId: eventId,
    audioClockId: clockId,
    speechPhase: phase,
    audioTimeMs: speechElapsedAt(now),
    clockSource: speechCursor ? 'runtime-tts-start-anchored-monotonic' : 'none',
    priority: active ? 70 : phase === 'unknown' ? 55 : 30,
    cancellationToken: phase === 'cancelled' && eventId ? ('cancel:' + eventId) : null,
    expression: latestPresentation?.expression || 'neutral',
    expressionIntensity: affect.expressionIntensity,
    mouth: { open: pose.open, form: pose.form, viseme: pose.viseme },
    gaze: {
      x: affect.gazeX,
      y: affect.gazeY,
      driven: body.gazeDriven === true,
    },
    body: {
      headTilt: affect.headTilt,
      gesture: active || Boolean(body.gesture),
      motionGroup,
      motionIndex,
      motionToken,
    },
    voiceEmphasis: affect.voiceEmphasis,
  };
  post('kurisu_embodiment_intent', intent);
  lastPublishedSpeechIdentity = speechCursor?.identity ?? '';
  lastPublishedSpeechPhase = phase;
}
function animateSpeech(now) {
  const phase = currentSpeechPhase(now);
  const active = isSpeechActive(now);
  const identity = speechCursor?.identity ?? '';
  if (active && now - lastControlAt >= 32) {
    const pose = sampleAvatarSpeechTimeline(speechCursor.timeline, speechElapsedAt(now));
    publishIntent(now, pose);
    mouthWasActive = true;
    lastControlAt = now;
  } else if (!active && now - lastControlAt >= 32
      && (mouthWasActive || phase !== lastPublishedSpeechPhase || identity !== lastPublishedSpeechIdentity)) {
    publishIntent(now, CLOSED_POSE);
    mouthWasActive = false;
    lastControlAt = now;
  } else if (!active && now - lastControlAt >= 32 && now < affectTransitionUntil) {
    // Keep publishing only during a short affect settle window while idle; speech
    // remains on its existing 30fps viseme clock and no permanent polling is added.
    publishIntent(now, CLOSED_POSE);
    lastControlAt = now;
  }
  window.requestAnimationFrame(animateSpeech);
}

void refreshSnapshot();
void refreshSpeech();
window.setInterval(() => { void refreshSnapshot(); }, 5000);
window.setInterval(() => { void refreshSpeech(); }, 150);
window.requestAnimationFrame(animateSpeech);
</script>
</body>
</html>
