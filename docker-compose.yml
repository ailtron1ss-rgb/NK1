services:
  neuro-kurisu:
    build:
      context: .
      dockerfile: runtime/neuro-kurisu/Dockerfile
    image: neuro-kurisu:local
    init: true
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3310"
      STATE_DIR: "/var/lib/neuro-kurisu"
      NEURO_API_TOKEN: ${NEURO_API_TOKEN:-nk1-local-compose-internal-token-change-me}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-15000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_VISION_ENABLED: ${GEMINI_VISION_ENABLED:-false}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-}
      LLAMA_CPP_URL: ${LLAMA_CPP_URL:-}
      LLAMA_CPP_MODEL: ${LLAMA_CPP_MODEL:-local-model}
      KOBOLD_URL: ${KOBOLD_URL:-http://127.0.0.1:5001}
      NEURO_MAX_BODY_BYTES: ${NEURO_MAX_BODY_BYTES:-1048576}
      NEURO_REQUEST_TIMEOUT_MS: ${NEURO_REQUEST_TIMEOUT_MS:-20000}
      NEURO_RATE_LIMIT: ${NEURO_RATE_LIMIT:-120}
      NEURO_RATE_WINDOW_MS: ${NEURO_RATE_WINDOW_MS:-60000}
      NEURO_BACKUP_EVERY_SAVES: ${NEURO_BACKUP_EVERY_SAVES:-25}
      NEURO_SKILL_SHADOW_SCHEDULER_JSON: ${NEURO_SKILL_SHADOW_SCHEDULER_JSON:-}
      NEURO_SKILL_PROMOTION_APPROVAL_KEYS_JSON: ${NEURO_SKILL_PROMOTION_APPROVAL_KEYS_JSON:-}
      NEURO_P26_HOLDOUT_VERIFIERS_JSON: ${NEURO_P26_HOLDOUT_VERIFIERS_JSON:-}
    expose:
      - "3310"
    volumes:
      - neuro-kurisu-state:/var/lib/neuro-kurisu
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3310/api/health').then(async r => { const d = await r.json(); process.exit(r.ok && d.ready === true ? 0 : 1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  neuro-kurisu-app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: neuro-kurisu-app:local
    init: true
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      PGLITE_DATA_DIR: "/var/lib/neuro-kurisu/app-db"
      NEURO_KURISU_API_TARGET: "http://neuro-kurisu:3310"
    expose:
      - "8080"
    volumes:
      - neuro-kurisu-app-db:/var/lib/neuro-kurisu/app-db
    depends_on:
      neuro-kurisu:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  gateway:
    image: caddy:2-alpine
    init: true
    restart: unless-stopped
    environment:
      NEURO_API_TOKEN: ${NEURO_API_TOKEN:-nk1-local-compose-internal-token-change-me}
    ports:
      - "${NK1_BIND_ADDR:-127.0.0.1}:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      neuro-kurisu:
        condition: service_healthy
      neuro-kurisu-app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -qx ok"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  neuro-kurisu-state:
  neuro-kurisu-app-db:
  caddy-data:
  caddy-config:
